openapi: 3.2.0
info:
  title: m3ter Integration Configs API
  description: 'If you are using Postman, you can:

    - Use the **Download** button above to download the m3ter Open API spec JSON file and then import this file as the **m3ter API Collection** into your Workspace. See Importing the m3ter Open API in our main user Documentation for details. - Copy this link: m3ter-Template API Collection and use it to import the **m3ter-Template API Collection** into your Workspace. See Importing the m3ter Template API Collection in our main user Documentation for details. ---


    # Introduction

    The m3ter platform supports two HTTP-based REST APIs returning JSON encoded responses:

    - The **Ingest API**, which you can use for submitting raw data measurements. *(See the Submit Measurements endpoint in this API Reference.)*

    - The **Config API**, which you can use for configuration and management. *(All other endpoints in this API Reference.)*


    ## Authentication and Authorization

    Our APIs use an industry-standard authorization protocol known as the OAuth 2.0 specification. OAuth2 supports several grant types, each designed for a specific use case. m3ter uses the following two grant types:

    - **Authorization Code**: Used for human login access via the m3ter Console. - **Client Credentials**: Used for machine-to-machine communication and API access. Complete the following flow for API access:


    1. **Create a Service User and add Permissions**: Log in to the m3ter Console, go to **Settings**, **Access** then **Service Users** tab, and create a Service User. To enable API calls, grant the user **Administrator** permissions. 2. **Generate Access Keys**: In the Console, open the *Overview* page for the Service User by clicking on the name. Generate an **Access Key id** and **Api Secret**. Make sure you copy the **Api Secret** because it is only visible at the time of creation. See Service Authentication for detailed instructions and an example. 3. **Obtain a Bearer Token using Basic Auth**: We implement the OAuth 2.0 Client Credentials Grant authentication flow for Service User Authentication. Submit a request to the m3ter OAuth Client Credentials authentication flow, using your concatenated **Access Key id** and **Api Secret** to obtain a Bearer Token for your Service User. *See examples below.*


    4. **Bearer Token Usage**: Use the HTTP ''Authorization'' header with the bearer token to authorise all subsequent API requests. > Warning: The Bearer Token is valid for 18,000 seconds or 5 hours. When the token has expired, you must obtain a new one. Below are two examples for obtaining a Bearer Token using Basic Auth: the first in cURL and the second as a Python script. ### cURL Example

    1. Open your terminal or command prompt. 2. Use the following `cURL` command to obtain a Bearer Token:


    ```bash

    curl -X POST https://api.m3ter.com/oauth/token \

    -H ''Content-Type: application/x-www-form-urlencoded'' \

    -u your_access_key_id:your_api_secret \

    -d ''grant_type=client_credentials''

    ```


    Replace `your_access_key_id` and `your_api_secret` with your actual **Access Key id** and **Api Secret**. 3. Run the command, and if successful, it will return a JSON response containing the Bearer Token. The response will look like this:


    ```json

    {

    "access_token": "your_bearer_token",

    "token_type": "Bearer",

    "expires_in": 18000

    }

    ```


    You can then use the Bearer Token *(the value of `"access_token"`)* for subsequent API calls to m3ter. ### Python Example

    1. Install the `requests` library if you haven''t already:


    ```bash

    pip install requests

    ```


    2.'
  version: '1.0'
  x-logo:
    url: https://console.m3ter.com/m3ter-logo-black.svg
servers:
- url: https://api.m3ter.com
security:
- OAuth2: []
tags:
- name: IntegrationConfigs
  description: Endpoints for configuring integrations
paths:
  /organizations/{orgId}/integrationconfigs:
    get:
      tags:
      - IntegrationConfigs
      summary: List All IntegrationConfigs
      description: 'List all integration configurations.


        This endpoint retrieves a list of all integration configurations for the specified Organization. The list can be paginated for easier management.'
      operationId: GetIntegrationConfigs
      parameters:
      - name: orgId
        in: path
        description: The unique identifier (UUID) for the organization. This specifies the organization within which the webhook destination is created.
        required: true
        style: simple
        explode: false
        schema:
          type: string
      - name: pageSize
        in: query
        description: Specifies the maximum number of integration configurations to retrieve per page.
        required: false
        allowEmptyValue: true
        style: form
        explode: true
        schema:
          maximum: 200
          minimum: 1
          type: integer
          format: int32
      - name: nextToken
        in: query
        description: The `nextToken` for multi-page retrievals. It is used to fetch the next page of integration configurations in a paginated list.
        required: false
        allowEmptyValue: true
        style: form
        explode: true
        schema:
          type: string
      - name: destinationId
        in: query
        description: optional filter for a specific destination
        required: false
        allowEmptyValue: true
        style: form
        explode: true
        schema:
          type: string
      responses:
        '200':
          description: Return the IntegrationConfigs
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedIntegrationConfigResponseData'
        4XX:
          $ref: '#/components/responses/Error'
        5XX:
          $ref: '#/components/responses/Error'
    post:
      tags:
      - IntegrationConfigs
      summary: Create IntegrationConfig
      description: Set the integration configuration for the entity.
      operationId: PostIntegrationConfig
      parameters:
      - name: orgId
        in: path
        description: UUID of the organization
        required: true
        style: simple
        explode: false
        schema:
          type: string
      requestBody:
        description: ''
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IntegrationConfigRequest'
        required: true
      responses:
        '200':
          description: Returns the IntegrationConfig
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntegrationConfigResponse'
        4XX:
          $ref: '#/components/responses/Error'
        5XX:
          $ref: '#/components/responses/Error'
  /organizations/{orgId}/integrationconfigs/available:
    get:
      tags:
      - IntegrationConfigs
      summary: Retrieve Available Configurations
      description: This endpoint gets the available configuration options for integrations.
      operationId: GetAvailableConfig
      parameters:
      - name: orgId
        in: path
        description: The unique identifier (UUID) of your Organization. The Organization represents your company as a direct customer of our service.
        required: true
        style: simple
        explode: false
        schema:
          type: string
      - name: systemName
        in: query
        description: The system to retrieve the configuration for.
        required: false
        allowEmptyValue: true
        style: form
        explode: true
        schema:
          type: string
      - name: entityType
        in: query
        description: The entity to retrieve the configuration for.
        required: false
        allowEmptyValue: true
        style: form
        explode: true
        schema:
          type: string
      responses:
        '200':
          description: Returns the configuration details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AvailableConfigurationResponse'
        4XX:
          $ref: '#/components/responses/Error'
        5XX:
          $ref: '#/components/responses/Error'
  /organizations/{orgId}/integrationconfigs/available/systems:
    get:
      tags:
      - IntegrationConfigs
      summary: Retrieve Available Integration Systems
      description: Retrieve the valid integration systems. Can be filtered by entityType.
      operationId: GetAvailableSystems
      parameters:
      - name: orgId
        in: path
        description: UUID of the organization
        required: true
        style: simple
        explode: false
        schema:
          type: string
      - name: entityType
        in: query
        description: The entity to retrieve the configuration for.
        required: false
        allowEmptyValue: true
        style: form
        explode: true
        schema:
          type: string
      responses:
        '200':
          description: Return the available integration systems
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SystemResponse'
        4XX:
          $ref: '#/components/responses/Error'
        5XX:
          $ref: '#/components/responses/Error'
  /organizations/{orgId}/integrationconfigs/available/{systemName}/auth/{entityType}:
    get:
      tags:
      - IntegrationConfigs
      summary: Retrieve Available Auth Config for System and Entity Type
      description: Retrieve the valid auth config for provided system and entity type.
      operationId: GetAvailableAuthForSystemAndEntityType
      parameters:
      - name: orgId
        in: path
        description: UUID of the organization
        required: true
        style: simple
        explode: false
        schema:
          type: string
      - name: systemName
        in: path
        description: The system to retrieve the configuration for.
        required: true
        style: simple
        explode: false
        schema:
          type: string
      - name: entityType
        in: path
        description: The entity to retrieve the configuration for.
        required: true
        style: simple
        explode: false
        schema:
          type: string
      responses:
        '200':
          description: Return the available auth config
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigOptions'
        4XX:
          $ref: '#/components/responses/Error'
        5XX:
          $ref: '#/components/responses/Error'
  /organizations/{orgId}/integrationconfigs/available/{systemName}/entities:
    get:
      tags:
      - IntegrationConfigs
      summary: Retrieve Available Entity Types for System
      description: Retrieve the valid entity types for provided system.
      operationId: GetAvailableSystemEntities
      parameters:
      - name: orgId
        in: path
        description: UUID of the organization
        required: true
        style: simple
        explode: false
        schema:
          type: string
      - name: systemName
        in: path
        description: The system to retrieve the configuration for.
        required: true
        style: simple
        explode: false
        schema:
          type: string
      responses:
        '200':
          description: Return the available entity types
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
        4XX:
          $ref: '#/components/responses/Error'
        5XX:
          $ref: '#/components/responses/Error'
  /organizations/{orgId}/integrationconfigs/entity/{entityType}:
    get:
      tags:
      - IntegrationConfigs
      summary: Retrieve IntegrationConfig
      description: Retrieve the integration configuration for the entity
      operationId: GetIntegrationConfigForType
      parameters:
      - name: orgId
        in: path
        description: UUID of the organization
        required: true
        style: simple
        explode: false
        schema:
          type: string
      - name: entityType
        in: path
        description: The entity to retrieve the configuration for.
        required: true
        style: simple
        explode: false
        schema:
          type: string
      - name: entityId
        in: query
        description: UUID of the entity to retrieve IntegrationConfigs for
        required: false
        allowEmptyValue: true
        style: form
        explode: true
        schema:
          type: string
      - name: destination
        in: query
        description: Destination type to retrieve IntegrationConfigs for
        required: false
        allowEmptyValue: true
        style: form
        explode: true
        schema:
          type: string
      - name: destinationId
        in: query
        description: UUID of the destination to retrieve IntegrationConfigs for
        required: false
        allowEmptyValue: true
        style: form
        explode: true
        schema:
          type: string
      - name: nextToken
        in: query
        description: nextToken for multi page retrievals
        required: false
        allowEmptyValue: true
        style: form
        explode: true
        schema:
          type: string
      - name: pageSize
        in: query
        description: Number of configs to retrieve per page
        required: false
        allowEmptyValue: true
        style: form
        explode: true
        schema:
          maximum: 200
          minimum: 1
          type: integer
          format: int32
      responses:
        '200':
          description: Return the IntegrationConfig
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntegrationRunResponse'
        4XX:
          $ref: '#/components/responses/Error'
        5XX:
          $ref: '#/components/responses/Error'
  /organizations/{orgId}/integrationconfigs/values/{systemName}/{configOption}:
    get:
      tags:
      - IntegrationConfigs
      summary: Get ConfigOption Values
      description: Get possible values for specific configuration setting.
      operationId: GetConfigOptionValues
      parameters:
      - name: orgId
        in: path
        description: UUID of the organization
        required: true
        style: simple
        explode: false
        schema:
          type: string
      - name: systemName
        in: path
        description: The name of the system.
        required: true
        style: simple
        explode: false
        schema:
          type: string
      - name: configOption
        in: path
        description: The entity to retrieve the configuration for.
        required: true
        style: simple
        explode: false
        schema:
          type: string
      responses:
        '200':
          description: Returns the ConfigOption Values
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigOptionsResponse'
        4XX:
          $ref: '#/components/responses/Error'
        5XX:
          $ref: '#/components/responses/Error'
  /organizations/{orgId}/integrationconfigs/{id}:
    get:
      tags:
      - IntegrationConfigs
      summary: Retrieve IntegrationConfig for UUID
      description: 'Retrieve the integration configuration for the given UUID.


        This endpoint retrieves the configuration details of a specific integration within an organization. It is useful for obtaining the settings and parameters of an integration.'
      operationId: GetIntegrationConfig
      parameters:
      - name: orgId
        in: path
        description: The unique identifier (UUID) of your Organization. The Organization represents your company as a direct customer of our service.
        required: true
        style: simple
        explode: false
        schema:
          type: string
      - name: id
        in: path
        description: The UUID of the integration configuration. This ID specifies which integration's configuration details are being requested.
        required: true
        style: simple
        explode: false
        schema:
          type: string
      responses:
        '200':
          description: Returns the IntegrationConfig
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntegrationRunResponse'
        4XX:
          $ref: '#/components/responses/Error'
        5XX:
          $ref: '#/components/responses/Error'
    put:
      tags:
      - IntegrationConfigs
      summary: Update IntegrationConfig
      description: 'Update the integration configuration for the given UUID.


        This endpoint allows you to update the configuration of a specific integration within your organization. It is used to modify settings or parameters of an existing integration.'
      operationId: UpdateIntegrationConfig
      parameters:
      - name: orgId
        in: path
        description: The unique identifier (UUID) of your Organization. The Organization represents your company as a direct customer of our service.
        required: true
        style: simple
        explode: false
        schema:
          type: string
      - name: id
        in: path
        description: The UUID of the IntegrationConfig. This ID identifies which specific integration configuration you wish to update.
        required: true
        style: simple
        explode: false
        schema:
          type: string
      requestBody:
        description: ''
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IntegrationConfigRequest'
        required: true
      responses:
        '200':
          description: Returns the IntegrationConfig
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntegrationConfigResponse'
        4XX:
          $ref: '#/components/responses/Error'
        5XX:
          $ref: '#/components/responses/Error'
    delete:
      tags:
      - IntegrationConfigs
      summary: Delete IntegrationConfig
      description: 'Delete the integration configuration for the given UUID.


        Use this endpoint to delete the configuration of a specific integration within your organization. It is intended for removing integration settings that are no longer needed.'
      operationId: DeleteIntegrationConfig
      parameters:
      - name: orgId
        in: path
        description: The unique identifier (UUID) of your Organization. The Organization represents your company as a direct customer of our service.
        required: true
        style: simple
        explode: false
        schema:
          type: string
      - name: id
        in: path
        description: The UUID of the IntegrationConfig to be deleted. This ID specifies the exact integration configuration that needs removal.
        required: true
        style: simple
        explode: false
        schema:
          type: string
      responses:
        '200':
          description: Returns the IntegrationConfig
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntegrationConfigResponse'
        4XX:
          $ref: '#/components/responses/Error'
        5XX:
          $ref: '#/components/responses/Error'
  /organizations/{orgId}/integrationconfigs/{id}/enable:
    post:
      tags:
      - IntegrationConfigs
      summary: Enable IntegrationConfig
      description: Enables a previously disabled integration configuration, allowing it to be operational again.
      operationId: EnableIntegrationConfig
      parameters:
      - name: orgId
        in: path
        description: The unique identifier (UUID) of your Organization. The Organization represents your company as a direct customer of our service.
        required: true
        style: simple
        explode: false
        schema:
          type: string
      - name: id
        in: path
        description: UUID of the integration configuration
        required: true
        style: simple
        explode: false
        schema:
          type: string
      responses:
        '200':
          description: Returns the IntegrationConfig
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntegrationConfigResponse'
        4XX:
          $ref: '#/components/responses/Error'
        5XX:
          $ref: '#/components/responses/Error'
components:
  schemas:
    AvailableConfigurationResponse:
      required:
      - globalConfigurationOptions
      - selectedConfigurations
      - supportedEntities
      type: object
      properties:
        supportedEntities:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/EntityConfiguration'
          description: An object mapping entity types to their respective `EntityConfiguration`. Provides information on which entities are supported and their configurations.
        selectedConfigurations:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/ConfigOptions'
          description: ''
        globalConfigurationOptions:
          description: An array of objects, each representing a global configuration option available for integrations.
          $ref: '#/components/schemas/ConfigOptions'
      description: Response containing available configuration options for integrations.
    DestinationConfiguration:
      required:
      - apiName
      - authConfigOptions
      - authType
      - categories
      - destination
      - destinationConfigOptions
      - displayName
      - released
      type: object
      properties:
        apiName:
          description: ''
          $ref: '#/components/schemas/DestinationType'
        destination:
          type: string
          description: The destination's unique identifier or name.
        displayName:
          type: string
          description: A human-readable display name for the destination.
        destinationConfigOptions:
          description: An array of objects, each representing a specific configuration option available for this destination.
          $ref: '#/components/schemas/ConfigOptions'
        authConfigOptions:
          description: An array of objects detailing authentication configuration options for the destination.
          $ref: '#/components/schemas/ConfigOptions'
        released:
          type: boolean
          description: 'A boolean indicating whether this destination configuration is released and available for use.


            * TRUE - Configuration is released.

            * FALSE - Configuration is not released.'
        authType:
          type: string
          description: The type of authentication required for this destination *(e.g., OAuth, API Key)*.
        categories:
          type: array
          description: ''
          items:
            type: string
      description: Configuration details for a specific destination within an entity.
    AbstractRequest:
      type: object
      properties:
        version:
          type: integer
          description: 'The version number of the entity:

            - **Create entity:** Not valid for initial insertion of new entity - *do not use for Create*. On initial Create, version is set at 1 and listed in the response.

            - **Update Entity:**  On Update, version is required and must match the existing version because a check is performed to ensure sequential versioning is preserved. Version is incremented by 1 and listed in the response.'
          format: int64
          x-stainless-terraform-configurability: computed
          x-stainless-terraform-always-send: true
      description: ''
    IntegrationConfigRequest:
      type: object
      description: ''
      allOf:
      - $ref: '#/components/schemas/AbstractRequest'
      - required:
        - destination
        - entityType
        type: object
        properties:
          entityType:
            minLength: 1
            pattern: ^[a-zA-Z0-9_-]*$
            type: string
            description: Specifies the type of entity for which the integration configuration is being updated. Must be a valid alphanumeric string.
            example: Bill
          entityId:
            type: string
            description: The unique identifier (UUID) of the entity. This field is used to specify which entity's integration configuration you're updating.
            example: 00000000-0000-0000-0000-000000000000
          destination:
            minLength: 1
            pattern: ^[a-zA-Z0-9_-]*$
            type: string
            description: Denotes the integration destination. This field identifies the target platform or service for the integration.
            example: Stripe
          destinationId:
            type: string
            description: The unique identifier (UUID) for the integration destination.
            example: 00000000-0000-0000-0000-000000000000
          configData:
            type: object
            description: A flexible object to include any additional configuration data specific to the integration.
            allOf:
            - type: object
              additionalProperties: true
            - type: object
              default: {}
          credentials:
            description: Base model for defining integration credentials across different types of integrations.
            $ref: '#/components/schemas/IntegrationCredentialsRequestBase'
          integrationCredentialsId:
            type: string
            description: ''
            example: 00000000-0000-0000-0000-000000000000
          name:
            type: string
            description: ''
            example: My Integration
    SystemResponse:
      type: object
      properties:
        identifier:
          type: string
          description: System name
        displayName:
          type: string
          description: User friendly display name
        validationSupported:
          type: boolean
          description: Whether or not m3ter supports validation of requests for this system. Requests will need to made without validation
        supportedAuthTypes:
          type: array
          description: List of supported auth types
          items:
            $ref: '#/components/schemas/AuthType'
      description: Response containing information about a system that m3ter can integrate with
    AbstractResponse:
      required:
      - id
      type: object
      properties:
        id:
          type: string
          description: 'The UUID of the entity. '
        version:
          type: integer
          description: 'The version number:

            - **Create:** On initial Create to insert a new entity, the version is set at 1 in the response.

            - **Update:** On successful Update, the version is incremented by 1 in the response.'
          format: int64
          x-stainless-terraform-configurability: computed
          x-stainless-terraform-always-send: true
      description: ''
    AuthType:
      type: string
      description: ''
      enum:
      - OAUTH_CODE
      - OAUTH_CLIENT_CREDENTIALS
      - HTTP_BASIC
      - M3TER_SIGNED_REQUEST
      - AWS_INTEGRATION
      - PADDLE
      - NETSUITE
      - CHARGEBEE
      - M3TER_APP_SIGNATURE
      - M3TER_SERVICE_USER
      - STRIPE_SIGNED_REQUEST
      - OPSGENIE_KEY
      - SAP_BYD
      - HUBSPOT_ACCESS_TOKEN
      - HUBSPOT_CLIENT_SECRET
      - SLACK_WEBHOOK
      - SAGE_INTACCT_CLIENT_CREDENTIALS
      - SAGE_INTACCT_CLIENT_SECRET
      - STATIC_API_KEY
      - GCP_WIF
      - SNS_REQUEST
    AbstractCollection_ConfigSetting_:
      type: object
      properties:
        empty:
          type: boolean
          description: ''
      description: ''
    RunStatus:
      type: string
      description: ''
      enum:
      - WAITING
      - STARTED
      - COMPLETE
      - ERROR
      - AWAITING_RETRY
      - AUTH_FAILED
      - ACCOUNTING_PERIOD_CLOSED
      - INVOICE_ALREADY_PAID
      - DISABLED
      - TIMEOUT_LIMIT_EXCEEDED
      - RATE_LIMIT_RETRY
    ConfigOptions:
      type: object
      allOf:
      - $ref: '#/components/schemas/ArrayList_ConfigSetting_'
      - $ref: '#/components/schemas/AbstractList_ConfigSetting_'
      - $ref: '#/components/schemas/AbstractCollection_ConfigSetting_'
    DestinationType:
      type: string
      description: ''
      enum:
      - WEBHOOK
      - NETSUITE
      - STRIPE
      - STRIPE_TEST
      - AWS
      - PADDLE
      - PADDLE_SANDBOX
      - SALESFORCE
      - XERO
      - CHARGEBEE
      - QUICKBOOKS
      - QUICKBOOKS_SANDBOX
      - M3TER
    IntegrationCredentialsRequestBase:
      required:
      - type
      type: object
      properties:
        empty:
          type: boolean
          description: "A flag to indicate whether the credentials are empty. \n\n* TRUE - empty credentials.\n* FALSE - credential details required."
        type:
          minLength: 1
          type: string
          description: Specifies the type of authorization required for the integration.
          enum:
          - HTTP_BASIC
          - OAUTH_CLIENT_CREDENTIALS
          - M3TER_SIGNED_REQUEST
          - AWS_INTEGRATION
          - PADDLE_AUTH
          - NETSUITE_AUTH
          - CHARGEBEE_AUTH
          - M3TER_APP_SIGNATURE
          - M3TER_SERVICE_USER
          - STRIPE_SIGNED_REQUEST
          - HUBSPOT_ACCESS_TOKEN
          - HUBSPOT_CLIENT_SECRET
          - OPSGENIE_KEY
          - SAP_BYD
          - SLACK_WEBHOOK
          - SAGE_INTACCT_CLIENT_CREDENTIALS
          - SAGE_INTACCT_CLIENT_SECRET
          - STATIC_API_KEY
          - GCP_WIF
          - SNS_REQUEST
        name:
          type: string
          description: The name of the credentials
          example: Integration Credentials
        destination:
          description: ''
          $ref: '#/components/schemas/DestinationType'
      description: Base model for defining integration credentials across different types of integrations.
      allOf:
      - $ref: '#/components/schemas/AbstractRequest'
    PaginatedIntegrationConfigResponseData:
      type: object
      properties:
        data:
          type: array
          description: ''
          items:
            $ref: '#/components/schemas/IntegrationConfigResponse'
        nextToken:
          type: string
          description: ''
      description: ''
    AbstractResponseWithAuditFields:
      type: object
      description: ''
      allOf:
      - $ref: '#/components/schemas/AbstractResponse'
      - type: object
        properties:
          dtCreated:
            type: string
            description: The DateTime when this item was created *(in ISO-8601 format)*.
            format: date-time
            x-stainless-skip: terraform
          dtLastModified:
            type: string
            description: The DateTime when this item was last modified *(in ISO-8601 format)*.
            format: date-time
            x-stainless-skip: terraform
          createdBy:
            type: string
            description: The ID of the user who created this item.
            x-stainless-skip: terraform
          lastModifiedBy:
            type: string
            description: The ID of the user who last modified this item.
            x-stainless-skip: terraform
    AbstractList_ConfigSetting_:
      $ref: '#/components/schemas/AbstractCollection_ConfigSetting_'
    IntegrationConfigResponse:
      type: object
      description: Response containing a IntegrationConfigResponse entity.
      allOf:
      - $ref: '#/components/schemas/AbstractResponseWithAuditFields'
      - $ref: '#/components/schemas/AbstractResponse'
      - required:
        - destination
        - entityType
        type: object
        properties:
          entityType:
            minLength: 1
            type: string
            description: The type of entity the integration is for *(e.g. Bill)*.
            example: Bill
          entityId:
            type: string
            description: The unique identifier (UUID) of the entity this integration is for *(e.g. the ID of a notification configuration. Optional.)*
            example: 00000000-0000-0000-0000-000000000000
          destination:
            minLength: 1
            type: string
            description: The type of destination *(e.g. Netsuite, webhooks)*.
            example: Stripe
          destinationId:
            type: string
            description: The unique identifier (UUID) of the entity the integration is for.
            example: 00000000-0000-0000-0000-000000000000
          configData:
            type: object
            description: The configuration data for the integration.
            allOf:
            - type: object
              additionalProperties: true
            - type: object
              description: Configuration data for the integration
          authorized:
            type: boolean
            description: "A flag indicating whether the integration configuration is authorized. \n\n* TRUE - authorized.\n* FALSE - not authorized."
          enabled:
            type: boolean
            description: 'A flag indicating whether the integration configuration is currently enabled or disabled.


              * TRUE - enabled.

              * FALSE - disabled.'
          triggerType:
            description: 'Specifies the type of trigger for the integration. '
            deprecated: true
            allOf:
            - $ref: '#/components/schemas/TriggerType'
          integrationCredentialsId:
            type: string
            description: UUID of the credentials to use for this integration
            example: 00000000-0000-0000-0000-000000000000
          name:
            type: string
            description: The name of the configuration
            example: My Integration
        description: Response containing a IntegrationConfigResponse entity
    TriggerType:
      type: string
      description: 'Specifies the type of trigger for the integration. '
      enum:
      - EVENT
      - SCHEDULE
    IntegrationRunResponse:
      type: object
      description: Response containing an IntegrationRun entity.
      allOf:
      - $ref: '#/components/schemas/AbstractResponseWithAuditFields'
      - $ref: '#/components/schemas/AbstractResponse'
      - required:
        - destination
        - entityId
        - entityType
        - status
        type: object
        properties:
          entityType:
            minLength: 1
            type: string
            description: 'The type of entity the integration run is for. Two options:

              * Bill

              * Notification'
          entityId:
            minLength: 1
            type: string
            description: The unique identifier (UUID) of the entity the integration run is for.
          dtStarted:
            type: string
            description: The date and time the integration run was started *(in ISO-8601 format)*.
            format: date-time
          dtCompleted:
            type: string
            description: The date and time the integration was completed. *(in ISO-8601 format)*.
            format: date-time
          status:
            description: The current status of the integration run.
            allOf:
            - $ref: '#/components/schemas/RunStatus'
            - type: object
              description: Status of the integration
          destination:
            type: string
            description: The destination system for the integration run.
          destinationId:
            type: string
            description: Identifier of the destination
          error:
            type: string
            description: Describes any errors encountered during the integration run.
          url:
            type: string
            description: The URL of the entity in the destination system if available.
          externalId:
            type: string
            description: The external ID in the destination system if available.
          parentIntegrationRunId:
            type: string
            description: ID of the parent integration run, or null if this is a parent integration run
          replayedFromIntegrationRunId:
            type: string
            description: ID of the integration run this was replayed from, or null if this is not a replay
        description: Response containing a IntegrationRun entity
    EntityConfiguration:
      required:
      - destinations
      - entityConfigurationOptions
      - readableName
      - released
      type: object
      properties:
        readableName:
          type: string
          description: A human-readable name for the entity. Helps in identifying the entity type easily.
        destinations:
          type: array
          description: An array of `DestinationConfiguration` objects, detailing available destinations for this entity.
          items:
            $ref: '#/components/schemas/DestinationConfiguration'
        entityConfigurationOptions:
          description: An array of objects, each representing a specific configuration option available for the entity.
          $ref: '#/components/schemas/ConfigOptions'
        released:
          type: boolean
          description: 'A boolean indicating whether this entity configuration is released and available for use.


            * TRUE - Configuration is released.

            * FALSE - Configuration is not released.'
      description: Configuration details for a specific entity type in the integration.
    ConfigOptionsResponse:
      type: object
      properties:
        id:
          type: string
          description: ''
        label:
          type: string
          description: ''
      description: Response containing an options for a configuration
    ArrayList_ConfigSetting_:
      type: object
      description: ''
      allOf:
      - $ref: '#/components/schemas/AbstractList_ConfigSetting_'
      - $ref: '#/components/schemas/AbstractCollection_ConfigSetting_'
      - type: object
        properties:
          empty:
            type: boolean
            description: ''
  responses:
    Error:
      description: Error message
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
  securitySchemes:
    OAuth2:
      type: oauth2
      description: "m3ter supports machine to machine authentication using the `clientCredentials` OAuth2 flow.\n\nThe `authorizationCode` flow controls access for human users via the m3ter Console application. \n"
      flows:
        clientCredentials:
          tokenUrl: /oauth/token
          scopes:
            m3ter-resources/m3ter-scope: m3ter resources
        authorizationCode:
          authorizationUrl: https://m3ter.auth.us-east-1.amazoncognito.com/oauth2/authorize
          tokenUrl: https://m3ter.auth.us-east-1.amazoncognito.com/oauth2/token
          scopes:
            m3ter-resources/m3ter-scope: m3ter resources
            openid: OpenID
            email: email
