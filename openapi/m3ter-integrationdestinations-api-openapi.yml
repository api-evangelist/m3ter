      operationId: SetWorkflowUseDraft
      parameters:
      - name: orgId
        in: path
        description: UUID of the organization
        required: true
        style: simple
        explode: false
        schema:
          type: string
      - name: id
        in: path
        description: UUID of the workflow
        required: true
        style: simple
        explode: false
        schema:
          type: string
