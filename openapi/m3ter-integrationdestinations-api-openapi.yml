  version: '1.0'
  x-logo:
    url: https://console.m3ter.com/m3ter-logo-black.svg
servers:
- url: https://api.m3ter.com
security:
- OAuth2: []
tags:
- name: IntegrationDestinations
  description: ''
paths:
  /organizations/{orgId}/integrationdestinations/webhooks:
    get:
      tags:
      - IntegrationDestinations
      summary: List Destinations
      description: Retrieve a list of all Destinations created in the Organization.
      operationId: ListWebhookIntegrations
      parameters:
      - name: orgId
        in: path
        description: UUID of the organization
        required: true
        style: simple
        explode: false
        schema:
          type: string
      - name: pageSize
        in: query
        description: Number of WebhookIntegrations to retrieve per page
        required: false
        allowEmptyValue: true
        style: form
        explode: true
        schema:
          maximum: 200
          minimum: 1
          type: integer
          format: int32
      - name: nextToken
        in: query
        description: nextToken for multi page retrievals
        required: false
        allowEmptyValue: true
        style: form
        explode: true
        schema:
          type: string
      - name: ids
        in: query
        description: ''
        required: false
        style: form
        explode: true
        schema:
          maxItems: 200
          type:
          - array
          - 'null'
          items:
            type: string
      responses:
        '200':
          description: Returns a list of Destinations.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedWebhookDestinationResponseData'
        4XX:
          $ref: '#/components/responses/Error'
        5XX:
          $ref: '#/components/responses/Error'
    post:
      tags:
      - IntegrationDestinations
      summary: Create Webhook Destination
      description: This endpoint creates a new webhook destination. A webhook destination is a URL where webhook payloads will be sent.
      operationId: CreateWebhookDestination
      parameters:
      - name: orgId
        in: path
        description: The unique identifier (UUID) for the organization. This specifies the organization within which the webhook destination is created.
        required: true
        style: simple
        explode: false
        schema:
          type: string
      requestBody:
        description: ''
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebhookDestinationRequest'
        required: true
      responses:
        '200':
          description: Returns the DestinationCreateRequest
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookDestinationResponse'
        4XX:
          $ref: '#/components/responses/Error'
        5XX:
          $ref: '#/components/responses/Error'
  /organizations/{orgId}/integrationdestinations/webhooks/{id}:
    get:
      tags:
      - IntegrationDestinations
      summary: Retrieve Destination
      description: Retrieve the webhook Destination for the UUID.
      operationId: GetWebhookIntegrationDestination
      parameters:
      - name: orgId
        in: path
        description: UUID of the organization
        required: true
        style: simple
        explode: false
        schema:
          type: string
      - name: id
        in: path
        description: The UUID of the webhook destination.
        required: true
        style: simple
        explode: false
        schema:
          type: string
      responses:
        '200':
          description: Returns the Destination
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookDestinationResponse'
        4XX:
          $ref: '#/components/responses/Error'
        5XX:
          $ref: '#/components/responses/Error'
    put:
      tags:
      - IntegrationDestinations
      summary: Update Destination
      description: Update a destination to be used for a webhook.
      operationId: UpdateWebhookDestination
      parameters:
      - name: orgId
        in: path
        description: UUID of the organization
        required: true
        style: simple
        explode: false
        schema:
          type: string
      - name: id
        in: path
        description: The UUID of the WebhookDestination to update.
        required: true
        style: simple
        explode: false
        schema:
          type: string
      requestBody:
        description: ''
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebhookDestinationRequest'
        required: true
      responses:
        '200':
          description: Returns the Destination Update Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookDestinationResponse'
        4XX:
          $ref: '#/components/responses/Error'
        5XX:
          $ref: '#/components/responses/Error'
    delete:
      tags:
      - IntegrationDestinations
      summary: Delete Webhook Destination
      description: This endpoint deletes a specific webhook destination identified by its UUID.
      operationId: DeleteWebhookDestination
      parameters:
      - name: orgId
        in: path
        description: The unique identifier (UUID) of your Organization. The Organization represents your company as a direct customer of our service.
        required: true
        style: simple
        explode: false
        schema:
          type: string
      - name: id
        in: path
        description: The unique identifier (UUID) of the webhook destination to be deleted.
        required: true
        style: simple
        explode: false
        schema:
          type: string
      responses:
        '200':
          description: Returns the deleted Destination
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookDestinationResponse'
        4XX:
          $ref: '#/components/responses/Error'
        5XX:
          $ref: '#/components/responses/Error'
  /organizations/{orgId}/integrationdestinations/webhooks/{id}/active:
    put:
      tags:
      - IntegrationDestinations
      summary: Activate Webhook Destination
      description: 'Set the `active` status on a webhook integration destination.


        Use this endpoint to activate or deactivate a webhook integration destination. It toggles the `active` status of the specific wehbook destination with the given ID.'
      operationId: ActivateWebhookDestination
      parameters:
      - name: orgId
        in: path
        description: The unique identifier (UUID) of your Organization. The Organization represents your company as a direct customer of our service.
        required: true
        style: simple
        explode: false
        schema:
          type: string
      - name: id
        in: path
        description: The unique identifier (UUID) of the webhook destination. This ID is used to specify which webhook integration is being targeted for activation or deactivation.
        required: true
        style: simple
        explode: false
        schema:
          type: string
      - name: active
        in: query
        description: active status of the webhook
        required: false
        style: form
        explode: true
        schema:
          type: boolean
      responses:
        '200':
          description: Returns the WebhookDestinationRequest
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookDestinationResponse'
        4XX:
          $ref: '#/components/responses/Error'
        5XX:
          $ref: '#/components/responses/Error'
  /organizations/{orgId}/integrationdestinations/workflows:
    get:
      tags:
      - IntegrationDestinations
      summary: List WorkflowIntegrations
      description: Retrieve a list of WorkflowIntegration entities
      operationId: ListWorkflowIntegrations
      parameters:
      - name: orgId
        in: path
        description: UUID of the organization
        required: true
        style: simple
        explode: false
        schema:
          type: string
      - name: pageSize
        in: query
        description: Number of workflows to retrieve per page
        required: false
        allowEmptyValue: true
        style: form
        explode: true
        schema:
          maximum: 200
          minimum: 1
          type: integer
          format: int32
      - name: nextToken
        in: query
        description: nextToken for multi page retrievals
        required: false
        allowEmptyValue: true
        style: form
        explode: true
        schema:
          type: string
      - name: ids*
        in: query
        description: List of workflow ids to retrieve
        required: false
        allowEmptyValue: true
        style: form
        explode: true
        schema:
          type: array
          items:
            type: object
      - name: ids
        in: query
        description: ''
        required: false
        style: form
        explode: true
        schema:
          maxItems: 200
          type:
          - array
          - 'null'
          items:
            type: string
      responses:
        '200':
          description: ListWorkflowIntegrations 200 response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedWorkflowListResponseData'
        4XX:
          $ref: '#/components/responses/Error'
        5XX:
          $ref: '#/components/responses/Error'
    post:
      tags:
      - IntegrationDestinations
      summary: Create Workflow
      description: Create a new workflow
      operationId: CreateWorkflow
      parameters:
      - name: orgId
        in: path
        description: UUID of the organization
        required: true
        style: simple
        explode: false
        schema:
          type: string
      requestBody:
        description: ''
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkflowRequest'
        required: true
      responses:
        '200':
          description: CreateWorkflow 200 response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowDestinationResponse'
        4XX:
          $ref: '#/components/responses/Error'
        5XX:
          $ref: '#/components/responses/Error'
  /organizations/{orgId}/integrationdestinations/workflows/accessrights:
    get:
      tags:
      - IntegrationDestinations
      summary: Get Workflow Access Rights
      description: Retrieve the access rights of the workflow service
      operationId: GetWorkflowAccessRights
      parameters:
      - name: orgId
        in: path
        description: UUID of the organization
        required: true
        style: simple
        explode: false
        schema:
          type: string
      responses:
        '200':
          description: Return the status details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowAccessRightsResponse'
        4XX:
          $ref: '#/components/responses/Error'
        5XX:
          $ref: '#/components/responses/Error'
  /organizations/{orgId}/integrationdestinations/workflows/functions:
    get:
      tags:
      - IntegrationDestinations
      summary: List Functions
      description: Retrieve the available workflow functions, optionally filtered by destination type
      operationId: ListFunctions
      parameters:
      - name: orgId
        in: path
        description: UUID of the organization
        required: true
        style: simple
        explode: false
        schema:
          type: string
      - name: destination
        in: query
        description: Destination type to filter functions by
        required: false
        allowEmptyValue: true
        style: form
        explode: true
        schema:
          type: string
      responses:
        '200':
          description: ListFunctions 200 response
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  $ref: '#/components/schemas/FunctionDetails'
        4XX:
          $ref: '#/components/responses/Error'
        5XX:
          $ref: '#/components/responses/Error'
  /organizations/{orgId}/integrationdestinations/workflows/import:
    post:
      tags:
      - IntegrationDestinations
      summary: Export Workflow Version
      description: Import a workflow.
      operationId: ImportWorkflow
      parameters:
      - name: orgId
        in: path
        description: UUID of the organization
        required: true
        style: simple
        explode: false
        schema:
          type: string
      requestBody:
        description: ''
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkflowPayload'
        required: true
      responses:
        '200':
          description: ImportWorkflow 200 response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowDestinationResponse'
        4XX:
          $ref: '#/components/responses/Error'
        5XX:
          $ref: '#/components/responses/Error'
  /organizations/{orgId}/integrationdestinations/workflows/triggers:
    get:
      tags:
      - IntegrationDestinations
      summary: Get Triggerse
      description: Retrieve the triggers for workflows
      operationId: GetWorkflowTriggers
      parameters:
      - name: orgId
        in: path
        description: UUID of the organization
        required: true
        style: simple
        explode: false
        schema:
          type: string
      responses:
        '200':
          description: GetWorkflowTriggers 200 response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowTriggersResponse'
        4XX:
          $ref: '#/components/responses/Error'
        5XX:
          $ref: '#/components/responses/Error'
  /organizations/{orgId}/integrationdestinations/workflows/validate:
    post:
      tags:
      - IntegrationDestinations
      summary: Validate Workflow
      description: Validate workflow
      operationId: ValidateWorkflow
      parameters:
      - name: orgId
        in: path
        description: UUID of the organization
        required: true
        style: simple
        explode: false
        schema:
          type: string
      requestBody:
        description: ''
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ValidateWorkflowRequest'
        required: true
      responses:
        '200':
          description: ValidateWorkflow 200 response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidateWorkflowResponse'
        4XX:
          $ref: '#/components/responses/Error'
        5XX:
          $ref: '#/components/responses/Error'
  /organizations/{orgId}/integrationdestinations/workflows/{id}:
    get:
      tags:
      - IntegrationDestinations
      summary: Get Workflow
      description: Retrieve the workflow for the specified ID
      operationId: GetWorkflowForId
      parameters:
      - name: id
        in: path
        description: UUID of the workflow to retrieve
        required: true
        style: simple
        explode: false
        schema:
          type: string
      - name: orgId
        in: path
        description: UUID of the organization
        required: true
        style: simple
        explode: false
        schema:
          type: string
      - name: workflowVersion
        in: query
        description: Optional version number to retrieve
        required: false
        style: form
        explode: true
        schema:
          type: integer
          format: int32
      - name: draft
        in: query
        description: Set to true to retrieve the latest draft
        required: false
        style: form
        explode: true
        schema:
          type: boolean
      - name: draftVersion
        in: query
        description: UUID of a specific draft version to retrieve
        required: false
        style: form
        explode: true
        schema:
          type: string
      responses:
        '200':
          description: GetWorkflowForId 200 response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowDestinationResponse'
        4XX:
          $ref: '#/components/responses/Error'
        5XX:
          $ref: '#/components/responses/Error'
    put:
      tags:
      - IntegrationDestinations
      summary: Update Workflow
      description: Update an existing workflow
      operationId: UpdateWorkflow
      parameters:
      - name: orgId
        in: path
        description: UUID of the organization
        required: true
        style: simple
        explode: false
        schema:
          type: string
      - name: id
        in: path
        description: UUID of the workflow
        required: true
        style: simple
        explode: false
        schema:
          type: string
      requestBody:
        description: ''
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkflowRequest'
        required: true
      responses:
        '200':
          description: UpdateWorkflow 200 response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowDestinationResponse'
        4XX:
          $ref: '#/components/responses/Error'
        5XX:
          $ref: '#/components/responses/Error'
    delete:
      tags:
      - IntegrationDestinations
      summary: Delete Workflow
      description: Delete an existing workflow
      operationId: DeleteWorkflow
      parameters:
      - name: orgId
        in: path
        description: UUID of the organization
        required: true
        style: simple
        explode: false
        schema:
          type: string
      - name: id
        in: path
        description: UUID of the workflow
        required: true
        style: simple
        explode: false
        schema:
          type: string
      responses:
        '200':
          description: DeleteWorkflow 200 response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowDestinationResponse'
        4XX:
          $ref: '#/components/responses/Error'
        5XX:
          $ref: '#/components/responses/Error'
  /organizations/{orgId}/integrationdestinations/workflows/{id}/draft:
    put:
      tags:
      - IntegrationDestinations
      summary: Save Workflow Draft
      description: Save a draft of the workflow without publishing it as a new version
      operationId: SaveWorkflowDraft
      parameters:
      - name: orgId
        in: path
        description: UUID of the organization
        required: true
        style: simple
        explode: false
        schema:
          type: string
      - name: id
        in: path
        description: UUID of the workflow
        required: true
        style: simple
        explode: false
        schema:
          type: string
      requestBody:
        description: ''
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkflowRequest'
        required: true
      responses:
        '200':
          description: SaveWorkflowDraft 200 response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowDestinationResponse'
        4XX:
          $ref: '#/components/responses/Error'
        5XX:
          $ref: '#/components/responses/Error'
    delete:
      tags:
      - IntegrationDestinations
      summary: Discard Workflow Draft
      description: Discard the current workflow draft
      operationId: DiscardWorkflowDraft
      parameters:
      - name: orgId
        in: path
        description: UUID of the organization
        required: true
        style: simple
        explode: false
        schema:
          type: string
      - name: id
        in: path
        description: UUID of the workflow
        required: true
        style: simple
        explode: false
        schema:
          type: string
      responses:
        '200':
          description: DiscardWorkflowDraft 200 response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowDestinationResponse'
        4XX:
          $ref: '#/components/responses/Error'
        5XX:
          $ref: '#/components/responses/Error'
  /organizations/{orgId}/integrationdestinations/workflows/{id}/enable:
    put:
      tags:
      - IntegrationDestinations
      summary: Enable Workflow
      description: Enable a workflow. Requires that the workflow contains no errors
      operationId: EnableWorkflow
      parameters:
      - name: orgId
        in: path
        description: UUID of the organization
        required: true
        style: simple
        explode: false
        schema:
          type: string
      - name: id
        in: path
        description: UUID of the workflow
        required: true
        style: simple
        explode: false
        schema:
          type: string
      - name: enable
        in: query
        description: '`false` to disable the workflow'
        required: false
        style: form
        explode: true
        schema:
          type: boolean
      responses:
        '200':
          description: EnableWorkflow 200 response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowDestinationResponse'
        4XX:
          $ref: '#/components/responses/Error'
        5XX:
          $ref: '#/components/responses/Error'
  /organizations/{orgId}/integrationdestinations/workflows/{id}/export:
    get:
      tags:
      - IntegrationDestinations
      summary: Export Workflow Version
      description: Export the specified version of the workflow for the UUID.
      operationId: ExportWorkflowVersion
      parameters:
      - name: orgId
        in: path
        description: UUID of the organization
        required: true
        style: simple
        explode: false
        schema:
          type: string
      - name: id
        in: path
        description: UUID of the workflow
        required: true
        style: simple
        explode: false
        schema:
          type: string
      - name: version
        in: query
        description: The version of the workflow to export. If no version is specified the latest version is used
        required: false
        style: form
        explode: true
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: ExportWorkflowVersion 200 response
          content:
            application/json:
              schema:
