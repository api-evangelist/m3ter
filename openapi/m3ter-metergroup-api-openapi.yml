  version: '1.0'
  x-logo:
    url: https://console.m3ter.com/m3ter-logo-black.svg
servers:
- url: https://api.m3ter.com
security:
- OAuth2: []
tags:
- name: MeterGroup
  description: 'Endpoints for creating/updating/deleting MeterGroups.


    MeterGroups represent a logical grouping of Meters. They are not required for billing, but mainly for Analytics purposes. For example: "show me the total income for all Meters in the ''Events'' group".'
paths:
  /organizations/{orgId}/metergroups:
    get:
      tags:
      - MeterGroup
      summary: List MeterGroups
      description: Retrieve a list of MeterGroup entities
      operationId: ListMeterGroups
      parameters:
      - name: orgId
        in: path
        description: UUID of the organization
        required: true
        style: simple
        explode: false
        schema:
          type: string
      - name: pageSize
        in: query
        description: Number of MeterGroups to retrieve per page
        required: false
        allowEmptyValue: true
        style: form
        explode: true
        schema:
          maximum: 100
          minimum: 1
          type: integer
          format: int32
      - name: nextToken
        in: query
        description: nextToken for multi page retrievals
        required: false
        allowEmptyValue: true
        style: form
        explode: true
        schema:
          type: string
      - name: ids
        in: query
        description: list of ids to retrieve
        required: false
        allowEmptyValue: true
        style: form
        explode: true
        schema:
          type: array
          items:
            type: string
      responses:
        '200':
          description: ListMeterGroups 200 response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedMeterGroupResponseData'
        4XX:
          $ref: '#/components/responses/Error'
        5XX:
          $ref: '#/components/responses/Error'
    post:
      tags:
      - MeterGroup
      summary: Create MeterGroup
      description: Create a new MeterGroup.
      operationId: PostMeterGroup
      parameters:
      - name: orgId
        in: path
        description: UUID of the organization
        required: true
        style: simple
        explode: false
        schema:
          type: string
      requestBody:
        description: ''
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MeterGroupRequest'
        required: true
      responses:
        '200':
          description: Return the created MeterGroup
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeterGroupResponse'
        4XX:
          $ref: '#/components/responses/Error'
        5XX:
          $ref: '#/components/responses/Error'
  /organizations/{orgId}/metergroups/{id}:
    get:
      tags:
      - MeterGroup
      summary: Retrieve MeterGroup
      description: Retrieve a MeterGroup for the given UUID.
      operationId: GetMeterGroup
      parameters:
      - name: orgId
        in: path
        description: UUID of the organization
        required: true
        style: simple
        explode: false
        schema:
          type: string
      - name: id
        in: path
        description: The UUID of the MeterGroup to retrieve.
        required: true
        style: simple
        explode: false
        schema:
          type: string
      responses:
        '200':
          description: Return the MeterGroup
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeterGroupResponse'
        4XX:
          $ref: '#/components/responses/Error'
        5XX:
          $ref: '#/components/responses/Error'
    put:
      tags:
      - MeterGroup
      summary: Update MeterGroup
      description: Update MeterGroup for the given UUID.
      operationId: PutMeterGroup
      parameters:
      - name: orgId
        in: path
        description: UUID of the organization
        required: true
        style: simple
        explode: false
        schema:
          type: string
      - name: id
        in: path
        description: The UUID of the MeterGroup to update.
        required: true
        style: simple
        explode: false
        schema:
          type: string
      requestBody:
        description: ''
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MeterGroupRequest'
        required: true
      responses:
        '200':
          description: Return the updated MeterGroup
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeterGroupResponse'
        4XX:
          $ref: '#/components/responses/Error'
        5XX:
          $ref: '#/components/responses/Error'
    delete:
      tags:
      - MeterGroup
      summary: Delete MeterGroup
      description: Delete a MeterGroup for the given UUID.
      operationId: DeleteMeterGroup
      parameters:
      - name: orgId
        in: path
        description: UUID of the organization
        required: true
        style: simple
        explode: false
        schema:
          type: string
      - name: id
        in: path
        description: The UUID of the MeterGroup to delete.
        required: true
        style: simple
        explode: false
        schema:
          type: string
      responses:
        '200':
          description: Return the deleted MeterGroup
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeterGroupResponse'
        4XX:
          $ref: '#/components/responses/Error'
        5XX:
          $ref: '#/components/responses/Error'
components:
  schemas:
    PaginatedMeterGroupResponseData:
      type: object
      properties:
        data:
          type: array
          description: ''
          items:
            $ref: '#/components/schemas/MeterGroupResponse'
        nextToken:
          type: string
          description: ''
      description: ''
    AbstractResponse:
      required:
      - id
      type: object
      properties:
        id:
          type: string
          description: 'The UUID of the entity. '
        version:
          type: integer
          description: 'The version number:

            - **Create:** On initial Create to insert a new entity, the version is set at 1 in the response.

            - **Update:** On successful Update, the version is incremented by 1 in the response.'
          format: int64
          x-stainless-terraform-configurability: computed
          x-stainless-terraform-always-send: true
      description: ''
    MeterGroupResponse:
      type: object
      description: ''
      allOf:
      - $ref: '#/components/schemas/AbstractResponse'
      - type: object
        properties:
          name:
            type: string
            description: ''
          dtCreated:
            type: string
            description: The DateTime when the meter group was created *(in ISO-8601 format)*.
            format: date-time
          dtLastModified:
            type: string
            description: The DateTime when the meter group was last modified *(in ISO-8601 format)*.
            format: date-time
          createdBy:
            type: string
            description: The id of the user who created this meter group.
          lastModifiedBy:
            type: string
            description: The id of the user who last modified this meter group.
    MeterGroupRequest:
      required:
      - name
      type: object
      properties:
        version:
          type: integer
          description: ''
          format: int64
        name:
          maxLength: 200
          minLength: 1
          type: string
          description: ''
      description: ''
  responses:
    Error:
      description: Error message
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
  securitySchemes:
    OAuth2:
      type: oauth2
      description: "m3ter supports machine to machine authentication using the `clientCredentials` OAuth2 flow.\n\nThe `authorizationCode` flow controls access for human users via the m3ter Console application. \n"
      flows:
        clientCredentials:
          tokenUrl: /oauth/token
          scopes:
            m3ter-resources/m3ter-scope: m3ter resources
        authorizationCode:
          authorizationUrl: https://m3ter.auth.us-east-1.amazoncognito.com/oauth2/authorize
          tokenUrl: https://m3ter.auth.us-east-1.amazoncognito.com/oauth2/token
          scopes:
            m3ter-resources/m3ter-scope: m3ter resources
            openid: OpenID
            email: email
