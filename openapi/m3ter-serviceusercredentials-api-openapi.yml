  version: '1.0'
  x-logo:
    url: https://console.m3ter.com/m3ter-logo-black.svg
servers:
- url: https://api.m3ter.com
security:
- OAuth2: []
tags:
- name: ServiceUserCredentials
  description: Endpoints for creating/activating/deactivating/deleting service user credentials
paths:
  /organizations/{orgId}/serviceusers/{id}/credentials:
    get:
      tags:
      - ServiceUserCredentials
      summary: List ServiceUser Credentials
      description: Retrieve the credentials key pairs for a service user.
      operationId: ListServiceUserCredentials
      parameters:
      - name: orgId
        in: path
        description: UUID of the organization
        required: true
        style: simple
        explode: false
        schema:
          type: string
      - name: id
        in: path
        description: UUID of the service user.
        required: true
        style: simple
        explode: false
        schema:
          type: string
      responses:
        '200':
          description: Returns a list of ServiceUser credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedServiceCredentialsResponseData'
        4XX:
          $ref: '#/components/responses/Error'
        5XX:
          $ref: '#/components/responses/Error'
    post:
      tags:
      - ServiceUserCredentials
      summary: Create ServiceUser Credentials
      description: Create a new credentials key pair for a service user.
      operationId: PostServiceUserCredentials
      parameters:
      - name: orgId
        in: path
        description: UUID of the organization
        required: true
        style: simple
        explode: false
        schema:
          type: string
      - name: id
        in: path
        description: UUID of the service user.
        required: true
        style: simple
        explode: false
        schema:
          type: string
      responses:
        '200':
          description: Returns the new ServiceUser credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceCredentialsResponse'
        4XX:
          $ref: '#/components/responses/Error'
        5XX:
          $ref: '#/components/responses/Error'
  /organizations/{orgId}/serviceusers/{id}/credentials/{apiKey}:
    get:
      tags:
      - ServiceUserCredentials
      summary: Retrieve ServiceUser Credentials
      description: Retrieve a credentials key pair for a service user.
      operationId: GetServiceUserCredentials
      parameters:
      - name: orgId
        in: path
        description: UUID of the organization
        required: true
        style: simple
        explode: false
        schema:
          type: string
      - name: id
        in: path
        description: UUID of the service user.
        required: true
        style: simple
        explode: false
        schema:
          type: string
      - name: apiKey
        in: path
        description: API key for the service user credentials.
        required: true
        style: simple
        explode: false
        schema:
          type: string
      responses:
        '200':
          description: Returns the ServiceUser credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceCredentialsResponse'
        4XX:
          $ref: '#/components/responses/Error'
        5XX:
          $ref: '#/components/responses/Error'
    delete:
      tags:
      - ServiceUserCredentials
      summary: Delete ServiceUser Credentials
      description: Delete a deactivated credentials key pair for a service user.
      operationId: DeleteServiceUserCredentials
      parameters:
      - name: orgId
        in: path
        description: UUID of the organization
        required: true
        style: simple
        explode: false
        schema:
          type: string
      - name: id
        in: path
        description: UUID of the service user.
        required: true
        style: simple
        explode: false
        schema:
          type: string
      - name: apiKey
        in: path
        description: API key for the service user credentials.
        required: true
        style: simple
        explode: false
        schema:
          type: string
      responses:
        '200':
          description: Returns the ServiceUser credentials that were deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceCredentialsResponse'
        4XX:
          $ref: '#/components/responses/Error'
        5XX:
          $ref: '#/components/responses/Error'
  /organizations/{orgId}/serviceusers/{id}/credentials/{apiKey}/activate:
    put:
      tags:
      - ServiceUserCredentials
      summary: Activate ServiceUser Credentials
      description: Activate a credentials key pair for a service user.
      operationId: ActivateServiceUserCredentials
      parameters:
      - name: orgId
        in: path
        description: UUID of the organization
        required: true
        style: simple
        explode: false
        schema:
          type: string
      - name: id
        in: path
        description: UUID of the service user.
        required: true
        style: simple
        explode: false
        schema:
          type: string
      - name: apiKey
        in: path
        description: API key for the service user credentials.
        required: true
        style: simple
        explode: false
        schema:
          type: string
      responses:
        '200':
          description: Returns the activated ServiceUser credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceCredentialsResponse'
        4XX:
          $ref: '#/components/responses/Error'
        5XX:
          $ref: '#/components/responses/Error'
  /organizations/{orgId}/serviceusers/{id}/credentials/{apiKey}/inactivate:
    put:
      tags:
      - ServiceUserCredentials
      summary: Deactivate ServiceUser Credentials
      description: Deactivate a credentials key pair for a service user.
      operationId: InactivateServiceUserCredentials
      parameters:
      - name: orgId
        in: path
        description: UUID of the organization
        required: true
        style: simple
        explode: false
        schema:
          type: string
      - name: id
        in: path
        description: UUID of the service user.
        required: true
        style: simple
        explode: false
        schema:
          type: string
      - name: apiKey
        in: path
        description: API key for the service user credentials.
        required: true
        style: simple
        explode: false
        schema:
          type: string
      responses:
        '200':
          description: Returns the deactivated ServiceUser credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceCredentialsResponse'
        4XX:
          $ref: '#/components/responses/Error'
        5XX:
          $ref: '#/components/responses/Error'
components:
  responses:
    Error:
      description: Error message
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
  schemas:
    PaginatedServiceCredentialsResponseData:
      type: object
      properties:
        data:
          type: array
          description: ''
          items:
            $ref: '#/components/schemas/ServiceCredentialsResponse'
        nextToken:
          type: string
          description: ''
      description: ''
    AbstractResponse:
      required:
      - id
      type: object
      properties:
        id:
          type: string
          description: 'The UUID of the entity. '
        version:
          type: integer
          description: 'The version number:

            - **Create:** On initial Create to insert a new entity, the version is set at 1 in the response.

            - **Update:** On successful Update, the version is incremented by 1 in the response.'
          format: int64
          x-stainless-terraform-configurability: computed
          x-stainless-terraform-always-send: true
      description: ''
    ServiceCredentialsResponse:
      type: object
      description: ''
      allOf:
      - $ref: '#/components/schemas/AbstractResponse'
      - type: object
        properties:
          apiKey:
            type: string
            description: ''
          apiSecret:
            type: string
            description: ''
          inactive:
            type: boolean
            description: ''
          dtCreated:
            type: string
            description: The DateTime when the service credentials were created.
            format: date-time
          dtLastModified:
            type: string
            description: The DateTime when the service credentials were last modified.
            format: date-time
          createdBy:
            type: string
            description: The id of the user who created these service credentials.
          lastModifiedBy:
            type: string
            description: The id of the user who last modified these service credentials.
  securitySchemes:
    OAuth2:
      type: oauth2
      description: "m3ter supports machine to machine authentication using the `clientCredentials` OAuth2 flow.\n\nThe `authorizationCode` flow controls access for human users via the m3ter Console application. \n"
      flows:
        clientCredentials:
          tokenUrl: /oauth/token
          scopes:
            m3ter-resources/m3ter-scope: m3ter resources
        authorizationCode:
          authorizationUrl: https://m3ter.auth.us-east-1.amazoncognito.com/oauth2/authorize
          tokenUrl: https://m3ter.auth.us-east-1.amazoncognito.com/oauth2/token
          scopes:
            m3ter-resources/m3ter-scope: m3ter resources
            openid: OpenID
            email: email
