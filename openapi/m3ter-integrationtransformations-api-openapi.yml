  version: '1.0'
  x-logo:
    url: https://console.m3ter.com/m3ter-logo-black.svg
servers:
- url: https://api.m3ter.com
security:
- OAuth2: []
tags:
- name: IntegrationTransformations
  description: Endpoints for configuring transformations
paths:
  /organizations/{orgId}/integrationtransformations:
    get:
      tags:
      - IntegrationTransformations
      summary: Retrieve IntegrationTransformations
      description: Retrieve the integration transformations
      operationId: GetIntegrationTransformations
      parameters:
      - name: orgId
        in: path
        description: UUID of the organization
        required: true
        style: simple
        explode: false
        schema:
          type: string
      - name: pageSize
        in: query
        description: Number of transformations to retrieve per page
        required: false
        allowEmptyValue: true
        style: form
        explode: true
        schema:
          maximum: 100
          minimum: 1
          type: integer
          format: int32
      - name: nextToken
        in: query
        description: NextToken for multi page retrievals
        required: false
        allowEmptyValue: true
        style: form
        explode: true
        schema:
          type: string
      - name: destinationSystem
        in: query
        description: Destination system to retrieve transformation for
        required: false
        allowEmptyValue: true
        style: form
        explode: true
        schema:
          type: string
      responses:
        '200':
          description: Return a list of transformations
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedData_Object_'
        4XX:
          $ref: '#/components/responses/Error'
        5XX:
          $ref: '#/components/responses/Error'
    post:
      tags:
      - IntegrationTransformations
      summary: Create a new transformation
      operationId: CreateIntegrationTransformation
      parameters:
      - name: orgId
        in: path
        description: UUID of the organization
        required: true
        style: simple
        explode: false
        schema:
          type: string
      requestBody:
        description: transformation details to create
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IntegrationTransformationRequest'
        required: true
      responses:
        '200':
          description: Return the IntegrationTransformation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntegrationTransformationResponse'
        4XX:
          $ref: '#/components/responses/Error'
        5XX:
          $ref: '#/components/responses/Error'
  /organizations/{orgId}/integrationtransformations/preview:
    post:
      tags:
      - IntegrationTransformations
      summary: Preview a transformation against an existing entity
      description: Create a new transformation
      operationId: PreviewIntegrationTransformation
      parameters:
      - name: orgId
        in: path
        description: UUID of the organization
        required: true
        style: simple
        explode: false
        schema:
          type: string
      requestBody:
        description: transformation details to preview
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IntegrationTransformationPreviewRequest'
        required: true
      responses:
        '200':
          description: Return the IntegrationTransformationPreviewResponse
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntegrationTransformationPreviewResponse'
        4XX:
          $ref: '#/components/responses/Error'
        5XX:
          $ref: '#/components/responses/Error'
  /organizations/{orgId}/integrationtransformations/systems:
    get:
      tags:
      - IntegrationTransformations
      summary: Preview a transformation against an existing entity
      description: Create a new transformation
      operationId: ListSupportedSystems
      parameters:
      - name: orgId
        in: path
        description: UUID of the organization
        required: true
        style: simple
        explode: false
        schema:
          type: string
      responses:
        '200':
          description: Return the list of supported systems
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupportedSystemsResponse'
        4XX:
          $ref: '#/components/responses/Error'
        5XX:
          $ref: '#/components/responses/Error'
  /organizations/{orgId}/integrationtransformations/{id}:
    get:
      tags:
      - IntegrationTransformations
      summary: Get IntegrationTransformation for the UUID
      description: Retrieve the integration transformation for the id
      operationId: GetIntegrationTransformationForId
      parameters:
      - name: orgId
        in: path
        description: UUID of the organization
        required: true
        style: simple
        explode: false
        schema:
          type: string
      - name: id
        in: path
        description: The UUID of the entity.
        required: true
        style: simple
        explode: false
        schema:
          type: string
      responses:
        '200':
          description: Return the IntegrationTransformation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntegrationTransformationResponse'
        4XX:
          $ref: '#/components/responses/Error'
        5XX:
          $ref: '#/components/responses/Error'
    put:
      tags:
      - IntegrationTransformations
      summary: Update the IntegrationTransformation for the UUID
      description: Update the integration transformation for the id
      operationId: PutIntegrationTransformationForId
      parameters:
      - name: orgId
        in: path
        description: UUID of the organization
        required: true
        style: simple
        explode: false
        schema:
          type: string
      - name: id
        in: path
        description: The UUID of the entity.
        required: true
        style: simple
        explode: false
        schema:
          type: string
      requestBody:
        description: ''
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IntegrationTransformationRequest'
        required: true
      responses:
        '200':
          description: Return the IntegrationTransformation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntegrationTransformationResponse'
        4XX:
          $ref: '#/components/responses/Error'
        5XX:
          $ref: '#/components/responses/Error'
    delete:
      tags:
      - IntegrationTransformations
      summary: Delete IntegrationTransformation for the UUID
      description: Deletes the integration transformation for the id
      operationId: DeleteIntegrationTransformationForId
      parameters:
      - name: orgId
        in: path
        description: UUID of the organization
        required: true
        style: simple
        explode: false
        schema:
          type: string
      - name: id
        in: path
        description: The UUID of the entity.
        required: true
        style: simple
        explode: false
        schema:
          type: string
      responses:
        '200':
          description: Return the deleted IntegrationTransformation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntegrationTransformationResponse'
        4XX:
          $ref: '#/components/responses/Error'
        5XX:
          $ref: '#/components/responses/Error'
components:
  schemas:
    AbstractLookupResponse:
      required:
      - destinationField
      - type
      type: object
      properties:
        destinationField:
          type: string
          description: ''
        type:
          description: ''
          $ref: '#/components/schemas/LookupType'
      description: ''
    AbstractRequest:
      type: object
      properties:
        version:
          type: integer
          description: 'The version number of the entity:

            - **Create entity:** Not valid for initial insertion of new entity - *do not use for Create*. On initial Create, version is set at 1 and listed in the response.

            - **Update Entity:**  On Update, version is required and must match the existing version because a check is performed to ensure sequential versioning is preserved. Version is incremented by 1 and listed in the response.'
          format: int64
          x-stainless-terraform-configurability: computed
          x-stainless-terraform-always-send: true
      description: ''
    TypeValidationErrorResponse:
      required:
      - field
      - message
      - severity
      type: object
      properties:
        message:
          type: string
          description: ''
        field:
          type: string
          description: ''
        severity:
          description: ''
          $ref: '#/components/schemas/TypeValidationSeverity'
      description: ''
    TypeValidationSeverity:
      type: string
      description: ''
      enum:
      - ERROR
      - WARNING
      - INFO
    SupportedSystemsResponse:
      required:
      - systems
      type: object
      properties:
        systems:
          type: array
          description: ''
          items:
            $ref: '#/components/schemas/SystemResponse'
      description: List of supported systems
    SystemResponse:
      type: object
      properties:
        identifier:
          type: string
          description: System name
        displayName:
          type: string
          description: User friendly display name
        validationSupported:
          type: boolean
          description: Whether or not m3ter supports validation of requests for this system. Requests will need to made without validation
        supportedAuthTypes:
          type: array
          description: List of supported auth types
          items:
            $ref: '#/components/schemas/AuthType'
      description: Response containing information about a system that m3ter can integrate with
    IntegrationTransformationPreviewRequest:
      required:
      - entity
      - entityId
      - entitySchema
      - rawData
      - system
      - transformations
      type: object
      properties:
        entity:
          type: string
          description: ''
        entityId:
          type: string
          description: ''
        system:
          type: string
          description: ''
        entitySchema:
          type: string
          description: ''
        transformations:
          type: array
          description: ''
          items:
            $ref: '#/components/schemas/AbstractLookupRequest'
        rawData:
          type: object
          additionalProperties: true
          description: ''
      description: ''
    LookupType:
      type: string
      description: ''
      enum:
      - CALCULATION
      - STATIC
      - LOOKUP
    IntegrationTransformationPreviewResponse:
      type: object
      properties:
        transformedObject:
          type: object
          additionalProperties: true
          description: ''
        validationErrors:
          type: array
          description: ''
          items:
            $ref: '#/components/schemas/TypeValidationErrorResponse'
      description: Response containing a preview of a transformation
    AbstractResponse:
      required:
      - id
      type: object
      properties:
        id:
          type: string
          description: 'The UUID of the entity. '
        version:
          type: integer
          description: 'The version number:

            - **Create:** On initial Create to insert a new entity, the version is set at 1 in the response.

            - **Update:** On successful Update, the version is incremented by 1 in the response.'
          format: int64
          x-stainless-terraform-configurability: computed
          x-stainless-terraform-always-send: true
      description: ''
    PaginatedData_Object_:
      type: object
      properties:
        data:
          type: array
          description: An array containing the list of requested external entities.
          items:
            type: object
        nextToken:
          type: string
          description: The `nextToken` for multi-page retrievals. It is used to fetch the next page of external entities in a paginated list.
      description: ''
    AbstractResponseWithAuditFields:
      type: object
      description: ''
      allOf:
      - $ref: '#/components/schemas/AbstractResponse'
      - type: object
        properties:
          dtCreated:
            type: string
            description: The DateTime when this item was created *(in ISO-8601 format)*.
            format: date-time
            x-stainless-skip: terraform
          dtLastModified:
            type: string
            description: The DateTime when this item was last modified *(in ISO-8601 format)*.
            format: date-time
            x-stainless-skip: terraform
          createdBy:
            type: string
            description: The ID of the user who created this item.
            x-stainless-skip: terraform
          lastModifiedBy:
            type: string
            description: The ID of the user who last modified this item.
            x-stainless-skip: terraform
    IntegrationTransformationRequest:
      type: object
      description: ''
      allOf:
      - $ref: '#/components/schemas/AbstractRequest'
      - required:
        - description
        - destinationSystem
        - destinationTable
        - name
        - sourceSystem
        - sourceTable
        - transformations
        type: object
        properties:
          name:
            minLength: 1
            type: string
            description: ''
            example: m3ter Bill to Netsuite Invoice
          description:
            minLength: 1
            type: string
            description: ''
            example: Transforms a m3ter Bill into a Netsuite Invoice
          sourceSystem:
            minLength: 1
            type: string
            description: ''
            example: m3ter
          destinationSystem:
            minLength: 1
            type: string
            description: ''
            example: Netsuite
          sourceTable:
            minLength: 1
            type: string
            description: ''
            example: Bill
          destinationTable:
            minLength: 1
            type: string
            description: ''
            example: customrecord_invoice
          transformations:
            minItems: 1
            type: array
            description: ''
            example:
            - destinationField: m3terId
              type: LOOKUP
              sourceField: id
            discriminator:
              propertyName: type
              mapping:
                CALCULATION: '#/components/schemas/CalculationLookupRequest'
                LOOKUP: '#/components/schemas/FieldLookupRequest'
                STATIC: '#/components/schemas/StaticValueRequest'
            items:
              $ref: '#/components/schemas/AbstractLookupRequest'
    AbstractLookupRequest:
      required:
      - destinationField
      - type
      type: object
      properties:
        destinationField:
          minLength: 1
          pattern: ^[a-zA-Z0-9_-]*$
          type: string
          description: ''
        type:
          description: ''
          $ref: '#/components/schemas/LookupType'
      description: ''
    AuthType:
      type: string
      description: ''
      enum:
      - OAUTH_CODE
      - OAUTH_CLIENT_CREDENTIALS
      - HTTP_BASIC
      - M3TER_SIGNED_REQUEST
      - AWS_INTEGRATION
      - PADDLE
      - NETSUITE
      - CHARGEBEE
      - M3TER_APP_SIGNATURE
      - M3TER_SERVICE_USER
      - STRIPE_SIGNED_REQUEST
      - OPSGENIE_KEY
      - SAP_BYD
      - HUBSPOT_ACCESS_TOKEN
      - HUBSPOT_CLIENT_SECRET
      - SLACK_WEBHOOK
      - SAGE_INTACCT_CLIENT_CREDENTIALS
      - SAGE_INTACCT_CLIENT_SECRET
      - STATIC_API_KEY
      - GCP_WIF
      - SNS_REQUEST
    IntegrationTransformationResponse:
      type: object
      description: ''
      allOf:
      - $ref: '#/components/schemas/AbstractResponseWithAuditFields'
      - $ref: '#/components/schemas/AbstractResponse'
      - type: object
        properties:
          name:
            type: string
            description: ''
            example: m3ter Bill to Netsuite Invoice
          description:
            type: string
            description: ''
            example: Transforms a m3ter Bill into a Netsuite Invoice
          sourceSystem:
            type: string
            description: ''
            example: m3ter
          destinationSystem:
            type: string
            description: ''
            example: Netsuite
          sourceTable:
            type: string
            description: ''
            example: Bill
          destinationTable:
            type: string
            description: ''
            example: customrecord_invoice
          transformations:
            type: array
            description: ''
            example:
            - destinationField: m3terId
              type: LOOKUP
              sourceField: id
            discriminator:
              propertyName: type
              mapping:
                CALCULATION: '#/components/schemas/CalculationLookupResponse'
                LOOKUP: '#/components/schemas/FieldLookupResponse'
                STATIC: '#/components/schemas/StaticValueResponse'
            items:
              $ref: '#/components/schemas/AbstractLookupResponse'
        description: Response containing a IntegrationRun entity
  responses:
    Error:
      description: Error message
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
  securitySchemes:
    OAuth2:
      type: oauth2
      description: "m3ter supports machine to machine authentication using the `clientCredentials` OAuth2 flow.\n\nThe `authorizationCode` flow controls access for human users via the m3ter Console application. \n"
      flows:
        clientCredentials:
          tokenUrl: /oauth/token
          scopes:
            m3ter-resources/m3ter-scope: m3ter resources
        authorizationCode:
          authorizationUrl: https://m3ter.auth.us-east-1.amazoncognito.com/oauth2/authorize
          tokenUrl: https://m3ter.auth.us-east-1.amazoncognito.com/oauth2/token
          scopes:
            m3ter-resources/m3ter-scope: m3ter resources
            openid: OpenID
            email: email
