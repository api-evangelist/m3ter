openapi: 3.2.0
info:
  title: m3ter Integration Credentials API
  description: 'If you are using Postman, you can:

    - Use the **Download** button above to download the m3ter Open API spec JSON file and then import this file as the **m3ter API Collection** into your Workspace. See Importing the m3ter Open API in our main user Documentation for details. - Copy this link: m3ter-Template API Collection and use it to import the **m3ter-Template API Collection** into your Workspace. See Importing the m3ter Template API Collection in our main user Documentation for details. ---


    # Introduction

    The m3ter platform supports two HTTP-based REST APIs returning JSON encoded responses:

    - The **Ingest API**, which you can use for submitting raw data measurements. *(See the Submit Measurements endpoint in this API Reference.)*

    - The **Config API**, which you can use for configuration and management. *(All other endpoints in this API Reference.)*


    ## Authentication and Authorization

    Our APIs use an industry-standard authorization protocol known as the OAuth 2.0 specification. OAuth2 supports several grant types, each designed for a specific use case. m3ter uses the following two grant types:

    - **Authorization Code**: Used for human login access via the m3ter Console. - **Client Credentials**: Used for machine-to-machine communication and API access. Complete the following flow for API access:


    1. **Create a Service User and add Permissions**: Log in to the m3ter Console, go to **Settings**, **Access** then **Service Users** tab, and create a Service User. To enable API calls, grant the user **Administrator** permissions. 2. **Generate Access Keys**: In the Console, open the *Overview* page for the Service User by clicking on the name. Generate an **Access Key id** and **Api Secret**. Make sure you copy the **Api Secret** because it is only visible at the time of creation. See Service Authentication for detailed instructions and an example. 3. **Obtain a Bearer Token using Basic Auth**: We implement the OAuth 2.0 Client Credentials Grant authentication flow for Service User Authentication. Submit a request to the m3ter OAuth Client Credentials authentication flow, using your concatenated **Access Key id** and **Api Secret** to obtain a Bearer Token for your Service User. *See examples below.*


    4. **Bearer Token Usage**: Use the HTTP ''Authorization'' header with the bearer token to authorise all subsequent API requests. > Warning: The Bearer Token is valid for 18,000 seconds or 5 hours. When the token has expired, you must obtain a new one. Below are two examples for obtaining a Bearer Token using Basic Auth: the first in cURL and the second as a Python script. ### cURL Example

    1. Open your terminal or command prompt. 2. Use the following `cURL` command to obtain a Bearer Token:


    ```bash

    curl -X POST https://api.m3ter.com/oauth/token \

    -H ''Content-Type: application/x-www-form-urlencoded'' \

    -u your_access_key_id:your_api_secret \

    -d ''grant_type=client_credentials''

    ```


    Replace `your_access_key_id` and `your_api_secret` with your actual **Access Key id** and **Api Secret**. 3. Run the command, and if successful, it will return a JSON response containing the Bearer Token. The response will look like this:


    ```json

    {

    "access_token": "your_bearer_token",

    "token_type": "Bearer",

    "expires_in": 18000

    }

    ```


    You can then use the Bearer Token *(the value of `"access_token"`)* for subsequent API calls to m3ter. ### Python Example

    1. Install the `requests` library if you haven''t already:


    ```bash

    pip install requests

    ```


    2.'
  version: '1.0'
  x-logo:
    url: https://console.m3ter.com/m3ter-logo-black.svg
servers:
- url: https://api.m3ter.com
security:
- OAuth2: []
tags:
- name: IntegrationCredentials
  description: Endpoints for configuring credentials
paths:
  /organizations/{orgId}/integrationcredentials:
    get:
      tags:
      - IntegrationCredentials
      summary: List integration credentials
      description: Retrieve a list of the integration authorization items for the organization
      operationId: ListIntegrationCredentials
      parameters:
      - name: orgId
        in: path
        description: UUID of the organization
        required: true
        style: simple
        explode: false
        schema:
          type: string
      - name: pageSize
        in: query
        description: Number of credentials to retrieve per page
        required: false
        allowEmptyValue: true
        style: form
        explode: true
        schema:
          maximum: 200
          minimum: 1
          type: integer
          format: int32
      - name: nextToken
        in: query
        description: nextToken for multi page retrievals
        required: false
        allowEmptyValue: true
        style: form
        explode: true
        schema:
          type: string
      - name: destination
        in: query
        description: destination filter
        required: false
        allowEmptyValue: true
        style: form
        explode: true
        schema:
          $ref: '#/components/schemas/DestinationType'
      responses:
        '200':
          description: ListIntegrationCredentials 200 response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedIntegrationCredentialsResponseBaseData'
        4XX:
          $ref: '#/components/responses/Error'
        5XX:
          $ref: '#/components/responses/Error'
    post:
      tags:
      - IntegrationCredentials
      summary: Create IntegrationCredential
      description: Create an integration credentials
      operationId: CreateIntegrationCredentials
      parameters:
      - name: orgId
        in: path
        description: UUID of the organization
        required: true
        style: simple
        explode: false
        schema:
          type: string
      - name: id
        in: path
        description: The UUID of the credentials.
        required: true
        style: simple
        explode: false
        schema:
          type: string
      requestBody:
        description: ''
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IntegrationCredentialsRequestBase'
        required: true
      responses:
        '200':
          description: Return the created credentials
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/IntegrationNetsuiteCredentialsResponse'
                - $ref: '#/components/schemas/IntegrationChargebeeCredentialsResponse'
                - $ref: '#/components/schemas/IntegrationBasicCredentialsResponse'
                - $ref: '#/components/schemas/IntegrationClientCredentialsRequest'
                - $ref: '#/components/schemas/IntegrationPaddleCredentialsResponse'
                - $ref: '#/components/schemas/IntegrationM3terSignedCredentialsResponse'
                - $ref: '#/components/schemas/IntegrationAWSCredentialsResponse'
                - $ref: '#/components/schemas/IntegrationOAuthCodeCredentialsResponse'
                - $ref: '#/components/schemas/IntegrationStripeSignedCredentialsResponse'
                - $ref: '#/components/schemas/IntegrationSapBydCredentialsResponse'
                - $ref: '#/components/schemas/IntegrationHubspotClientSecretResponse'
                - $ref: '#/components/schemas/IntegrationSageIntacctClientCredentialsResponse'
                - $ref: '#/components/schemas/IntegrationSageIntacctClientSecretResponse'
                - $ref: '#/components/schemas/IntegrationStaticApiKeyCredentialsResponse'
                - $ref: '#/components/schemas/IntegrationGcpCredentialsResponse'
                - $ref: '#/components/schemas/IntegrationSnsRequestCredentialsResponse'
        4XX:
          $ref: '#/components/responses/Error'
        5XX:
          $ref: '#/components/responses/Error'
  /organizations/{orgId}/integrationcredentials/{id}:
    get:
      tags:
      - IntegrationCredentials
      summary: Retrieve IntegrationCredentials
      description: Retrieve the integration credentials for the UUID
      operationId: GetIntegrationCredentialsForId
      parameters:
      - name: orgId
        in: path
        description: UUID of the organization
        required: true
        style: simple
        explode: false
        schema:
          type: string
      - name: id
        in: path
        description: The UUID of the credentials.
        required: true
        style: simple
        explode: false
        schema:
          type: string
      responses:
        '200':
          description: Return the IntegrationCredentials
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/IntegrationNetsuiteCredentialsResponse'
                - $ref: '#/components/schemas/IntegrationChargebeeCredentialsResponse'
                - $ref: '#/components/schemas/IntegrationBasicCredentialsResponse'
                - $ref: '#/components/schemas/IntegrationClientCredentialsRequest'
                - $ref: '#/components/schemas/IntegrationPaddleCredentialsResponse'
                - $ref: '#/components/schemas/IntegrationM3terSignedCredentialsResponse'
                - $ref: '#/components/schemas/IntegrationAWSCredentialsResponse'
                - $ref: '#/components/schemas/IntegrationOAuthCodeCredentialsResponse'
                - $ref: '#/components/schemas/IntegrationStripeSignedCredentialsResponse'
                - $ref: '#/components/schemas/IntegrationSapBydCredentialsResponse'
                - $ref: '#/components/schemas/IntegrationHubspotClientSecretResponse'
                - $ref: '#/components/schemas/IntegrationSageIntacctClientCredentialsResponse'
                - $ref: '#/components/schemas/IntegrationSageIntacctClientSecretResponse'
                - $ref: '#/components/schemas/IntegrationStaticApiKeyCredentialsResponse'
                - $ref: '#/components/schemas/IntegrationGcpCredentialsResponse'
        4XX:
          $ref: '#/components/responses/Error'
        5XX:
          $ref: '#/components/responses/Error'
    put:
      tags:
      - IntegrationCredentials
      summary: Update IntegrationCredentials
      description: Updated the integration credentials for the UUID
      operationId: UpdateIntegrationCredentialsForId
      parameters:
      - name: orgId
        in: path
        description: UUID of the organization
        required: true
        style: simple
        explode: false
        schema:
          type: string
      - name: id
        in: path
        description: The UUID of the credentials.
        required: true
        style: simple
        explode: false
        schema:
          type: string
      requestBody:
        description: ''
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IntegrationCredentialsRequestBase'
        required: true
      responses:
        '200':
          description: Return the IntegrationCredentials
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/IntegrationNetsuiteCredentialsResponse'
                - $ref: '#/components/schemas/IntegrationChargebeeCredentialsResponse'
                - $ref: '#/components/schemas/IntegrationBasicCredentialsResponse'
                - $ref: '#/components/schemas/IntegrationClientCredentialsRequest'
                - $ref: '#/components/schemas/IntegrationPaddleCredentialsResponse'
                - $ref: '#/components/schemas/IntegrationM3terSignedCredentialsResponse'
                - $ref: '#/components/schemas/IntegrationAWSCredentialsResponse'
                - $ref: '#/components/schemas/IntegrationOAuthCodeCredentialsResponse'
                - $ref: '#/components/schemas/IntegrationStripeSignedCredentialsResponse'
                - $ref: '#/components/schemas/IntegrationSapBydCredentialsResponse'
                - $ref: '#/components/schemas/IntegrationHubspotClientSecretResponse'
                - $ref: '#/components/schemas/IntegrationSageIntacctClientCredentialsResponse'
                - $ref: '#/components/schemas/IntegrationSageIntacctClientSecretResponse'
                - $ref: '#/components/schemas/IntegrationStaticApiKeyCredentialsResponse'
                - $ref: '#/components/schemas/IntegrationGcpCredentialsResponse'
        4XX:
          $ref: '#/components/responses/Error'
        5XX:
          $ref: '#/components/responses/Error'
    delete:
      tags:
      - IntegrationCredentials
      summary: Delete IntegrationCredentials
      description: Delete the integration credentials for the UUID
      operationId: DeleteIntegrationCredentialsForId
      parameters:
      - name: orgId
        in: path
        description: UUID of the organization
        required: true
        style: simple
        explode: false
        schema:
          type: string
      - name: id
        in: path
        description: The UUID of the credentials.
        required: true
        style: simple
        explode: false
        schema:
          type: string
      responses:
        '200':
          description: Return the IntegrationCredentials
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/IntegrationNetsuiteCredentialsResponse'
                - $ref: '#/components/schemas/IntegrationChargebeeCredentialsResponse'
                - $ref: '#/components/schemas/IntegrationBasicCredentialsResponse'
                - $ref: '#/components/schemas/IntegrationClientCredentialsRequest'
                - $ref: '#/components/schemas/IntegrationPaddleCredentialsResponse'
                - $ref: '#/components/schemas/IntegrationM3terSignedCredentialsResponse'
                - $ref: '#/components/schemas/IntegrationAWSCredentialsResponse'
                - $ref: '#/components/schemas/IntegrationOAuthCodeCredentialsResponse'
                - $ref: '#/components/schemas/IntegrationSapBydCredentialsResponse'
                - $ref: '#/components/schemas/IntegrationHubspotClientSecretResponse'
                - $ref: '#/components/schemas/IntegrationSageIntacctClientCredentialsResponse'
                - $ref: '#/components/schemas/IntegrationSageIntacctClientSecretResponse'
                - $ref: '#/components/schemas/IntegrationStaticApiKeyCredentialsResponse'
                - $ref: '#/components/schemas/IntegrationGcpCredentialsResponse'
        4XX:
          $ref: '#/components/responses/Error'
        5XX:
          $ref: '#/components/responses/Error'
components:
  schemas:
    IntegrationStaticApiKeyCredentialsResponse:
      type: object
      description: ''
      allOf:
      - $ref: '#/components/schemas/IntegrationCredentialsRequestBase'
      - $ref: '#/components/schemas/IntegrationCredentialsResponse'
      - $ref: '#/components/schemas/AbstractResponseWithAuditFields'
      - $ref: '#/components/schemas/AbstractResponse'
      - type: object
        properties:
          apiKey:
            type: string
            description: ''
        description: Response containing a response for a credential using a static API key
    IntegrationM3terSignedCredentialsResponse:
      type: object
      properties:
        apiKey:
          type: string
          description: The API key provided by m3ter. This key is part of the credential set required for signing requests and authenticating with m3ter services.
          example: api key
        secret:
          type: string
          description: The secret associated with the API key. This secret is used in conjunction with the API key to generate a signature for secure authentication.
          example: api secret
      description: 'Response representing a set of credentials used for signing m3ter requests. '
      allOf:
      - $ref: '#/components/schemas/IntegrationCredentialsResponse'
      - $ref: '#/components/schemas/AbstractResponseWithAuditFields'
      - $ref: '#/components/schemas/AbstractResponse'
    IntegrationNetsuiteCredentialsResponse:
      type: object
      properties:
        accountId:
          type: string
          description: Netsuite account ID.
          example: 1234567-sb1
        certificateId:
          type: string
          description: m3ter certificate ID
          example: certificate id
        clientId:
          type: string
          description: Netsuite integration client ID
          example: client id
      description: Response containing a IntegrationCredentials entity for Netsuite auth
      allOf:
      - $ref: '#/components/schemas/IntegrationCredentialsResponse'
      - $ref: '#/components/schemas/AbstractResponseWithAuditFields'
      - $ref: '#/components/schemas/AbstractResponse'
    IntegrationGcpCredentialsResponse:
      type: object
      properties:
        projectNumber:
          type: string
          description: GCP Project number
          example: '123456789012'
        wifPoolId:
          type: string
          description: the ID of the workforce identity pool
          example: my-pool
        providerId:
          type: string
          description: the ID of the provider within the workforce identity pool
          example: my-provider
        gcpServiceAccountEmail:
          type: string
          description: the email of the GCP service account to impersonate when using workload identity federation
          example: some@email.com
      description: Response representing a credential set for GCP integration
      allOf:
      - $ref: '#/components/schemas/IntegrationCredentialsResponse'
      - $ref: '#/components/schemas/AbstractResponseWithAuditFields'
      - $ref: '#/components/schemas/AbstractResponse'
    IntegrationBasicCredentialsResponse:
      type: object
      properties:
        username:
          type: string
          description: ''
          example: username
        password:
          type: string
          description: ''
          example: password
      description: Response containing a IntegrationCredentials entity for HTTP Basic auth
      allOf:
      - $ref: '#/components/schemas/IntegrationCredentialsResponse'
      - $ref: '#/components/schemas/AbstractResponseWithAuditFields'
      - $ref: '#/components/schemas/AbstractResponse'
    AbstractRequest:
      type: object
      properties:
        version:
          type: integer
          description: 'The version number of the entity:

            - **Create entity:** Not valid for initial insertion of new entity - *do not use for Create*. On initial Create, version is set at 1 and listed in the response.

            - **Update Entity:**  On Update, version is required and must match the existing version because a check is performed to ensure sequential versioning is preserved. Version is incremented by 1 and listed in the response.'
          format: int64
          x-stainless-terraform-configurability: computed
          x-stainless-terraform-always-send: true
      description: ''
    IntegrationSageIntacctClientSecretResponse:
      type: object
      properties:
        clientSecret:
          type: string
          description: ''
          example: client secret
      description: Response containing client secret set for inbound webhooks from Sage Intacct.
      allOf:
      - $ref: '#/components/schemas/IntegrationCredentialsResponse'
      - $ref: '#/components/schemas/AbstractResponseWithAuditFields'
      - $ref: '#/components/schemas/AbstractResponse'
    IntegrationAWSCredentialsResponse:
      type: object
      properties:
        accountId:
          type: string
          description: the ID of the AWS account
          example: '123456789123'
        roleName:
          type: string
          description: the name of the role that m3ter will assume to interact with resources in the AWS account
          example: m3terRole
      description: Response representing a credential set for AWS integration
      allOf:
      - $ref: '#/components/schemas/IntegrationCredentialsResponse'
      - $ref: '#/components/schemas/AbstractResponseWithAuditFields'
      - $ref: '#/components/schemas/AbstractResponse'
    IntegrationOAuthCodeCredentialsResponse:
      type: object
      description: ''
      allOf:
      - $ref: '#/components/schemas/IntegrationCredentialsResponse'
      - $ref: '#/components/schemas/AbstractResponseWithAuditFields'
      - $ref: '#/components/schemas/AbstractResponse'
      - required:
        - type
        type: object
        properties:
          type:
            minLength: 1
            type: string
            description: the type of credentials
        description: Request representing a credential set for oauth code auth
    AbstractResponse:
      required:
      - id
      type: object
      properties:
        id:
          type: string
          description: 'The UUID of the entity. '
        version:
          type: integer
          description: 'The version number:

            - **Create:** On initial Create to insert a new entity, the version is set at 1 in the response.

            - **Update:** On successful Update, the version is incremented by 1 in the response.'
          format: int64
          x-stainless-terraform-configurability: computed
          x-stainless-terraform-always-send: true
      description: ''
    IntegrationSapBydCredentialsResponse:
      type: object
      properties:
        hostname:
          type: string
          description: ''
          example: my123456
      description: Response containing a IntegrationCredentials entity for SAP ByD auth
      allOf:
      - $ref: '#/components/schemas/IntegrationBasicCredentialsResponse'
      - $ref: '#/components/schemas/IntegrationCredentialsResponse'
      - $ref: '#/components/schemas/AbstractResponseWithAuditFields'
      - $ref: '#/components/schemas/AbstractResponse'
    IntegrationClientCredentialsRequest:
      type: object
      description: ''
      allOf:
      - $ref: '#/components/schemas/AbstractRequest'
      - $ref: '#/components/schemas/IntegrationCredentialsRequestBase'
      - required:
        - clientId
        - externalCustomerId
        - keyId
        - type
        type: object
        properties:
          type:
            minLength: 1
            type: string
            description: ''
            example: OAUTH_CLIENT_CREDENTIALS
            enum:
            - OAUTH_CLIENT_CREDENTIALS
          empty:
            type: boolean
            description: ''
          externalCustomerId:
            minLength: 1
            type: string
            description: ''
            example: customer_id
          clientId:
            minLength: 1
            type: string
            description: ''
            example: client id
          keyId:
            minLength: 1
            type: string
            description: ''
            example: client secret
        description: Request representing a credential set for oauth2, the client credentials flow
    PaginatedIntegrationCredentialsResponseBaseData:
      type: object
      properties:
        data:
          type: array
          description: ''
          items:
            $ref: '#/components/schemas/IntegrationCredentialsResponse'
        nextToken:
          type: string
          description: ''
      description: ''
    DestinationType:
      type: string
      description: ''
      enum:
      - WEBHOOK
      - NETSUITE
      - STRIPE
      - STRIPE_TEST
      - AWS
      - PADDLE
      - PADDLE_SANDBOX
      - SALESFORCE
      - XERO
      - CHARGEBEE
      - QUICKBOOKS
      - QUICKBOOKS_SANDBOX
      - M3TER
    IntegrationCredentialsRequestBase:
      required:
      - type
      type: object
      properties:
        empty:
          type: boolean
          description: "A flag to indicate whether the credentials are empty. \n\n* TRUE - empty credentials.\n* FALSE - credential details required."
        type:
          minLength: 1
          type: string
          description: Specifies the type of authorization required for the integration.
          enum:
          - HTTP_BASIC
          - OAUTH_CLIENT_CREDENTIALS
          - M3TER_SIGNED_REQUEST
          - AWS_INTEGRATION
          - PADDLE_AUTH
          - NETSUITE_AUTH
          - CHARGEBEE_AUTH
          - M3TER_APP_SIGNATURE
          - M3TER_SERVICE_USER
          - STRIPE_SIGNED_REQUEST
          - HUBSPOT_ACCESS_TOKEN
          - HUBSPOT_CLIENT_SECRET
          - OPSGENIE_KEY
          - SAP_BYD
          - SLACK_WEBHOOK
          - SAGE_INTACCT_CLIENT_CREDENTIALS
          - SAGE_INTACCT_CLIENT_SECRET
          - STATIC_API_KEY
          - GCP_WIF
          - SNS_REQUEST
        name:
          type: string
          description: The name of the credentials
          example: Integration Credentials
        destination:
          description: ''
          $ref: '#/components/schemas/DestinationType'
      description: Base model for defining integration credentials across different types of integrations.
      allOf:
      - $ref: '#/components/schemas/AbstractRequest'
    IntegrationSnsRequestCredentialsResponse:
      type: object
      properties:
        topicArn:
          type: string
          description: ''
          example: arn:aws:sns:eu-west-2:123456789012:my-source-topic
      description: Response containing the SNS topic ARN permitted to deliver to an inbound webhook.
      allOf:
      - $ref: '#/components/schemas/IntegrationCredentialsResponse'
      - $ref: '#/components/schemas/AbstractResponseWithAuditFields'
      - $ref: '#/components/schemas/AbstractResponse'
    IntegrationSageIntacctClientCredentialsResponse:
      type: object
      properties:
        clientId:
          type: string
          description: ''
          example: client id
        clientSecret:
          type: string
          description: ''
          example: client secret
        userId:
          type: string
          description: ''
          example: User ID
        companyId:
          type: string
          description: ''
          example: Company ID
      description: Response containing a IntegrationCredentials entity for Client Credentials auth for Sage Intacct
      allOf:
      - $ref: '#/components/schemas/IntegrationCredentialsResponse'
      - $ref: '#/components/schemas/AbstractResponseWithAuditFields'
      - $ref: '#/components/schemas/AbstractResponse'
    AbstractResponseWithAuditFields:
      type: object
      description: ''
      allOf:
      - $ref: '#/components/schemas/AbstractResponse'
      - type: object
        properties:
          dtCreated:
            type: string
            description: The DateTime when this item was created *(in ISO-8601 format)*.
            format: date-time
            x-stainless-skip: terraform
          dtLastModified:
            type: string
            description: The DateTime when this item was last modified *(in ISO-8601 format)*.
            format: date-time
            x-stainless-skip: terraform
          createdBy:
            type: string
            description: The ID of the user who created this item.
            x-stainless-skip: terraform
          lastModifiedBy:
            type: string
            description: The ID of the user who last modified this item.
            x-stainless-skip: terraform
    IntegrationChargebeeCredentialsResponse:
      type: object
      properties:
        apiKey:
          type: string
          description: ''
          example: api key
        site:
          type: string
          description: ''
          example: example-sandbox
      description: Response containing a IntegrationCredentials entity for Chargebee auth
      allOf:
      - $ref: '#/components/schemas/IntegrationCredentialsResponse'
      - $ref: '#/components/schemas/AbstractResponseWithAuditFields'
      - $ref: '#/components/schemas/AbstractResponse'
    IntegrationPaddleCredentialsResponse:
      type: object
      properties:
        apiKey:
          type: string
          description: ''
          example: api key
      description: Response containing a IntegrationCredentials entity for Paddle auth
      allOf:
      - $ref: '#/components/schemas/IntegrationCredentialsResponse'
      - $ref: '#/components/schemas/AbstractResponseWithAuditFields'
      - $ref: '#/components/schemas/AbstractResponse'
    IntegrationCredentialsResponse:
      type: object
      description: Response containing a IntegrationCredentials entity
      allOf:
      - $ref: '#/components/schemas/AbstractResponseWithAuditFields'
      - $ref: '#/components/schemas/AbstractResponse'
      - required:
        - destination
        - type
        type: object
        properties:
          type:
            minLength: 1
            type: string
            description: the type of credentials
          destination:
            minLength: 1
            type: string
            description: the system the integration is for
          destinationId:
            type: string
            description: the destinationId the integration is for
          name:
            type: string
            description: the name of the credentials
        description: Response containing a IntegrationCredentials entity
    IntegrationHubspotClientSecretResponse:
      type: object
      properties:
        accessToken:
          type: string
          description: ''
          example: eyJhbGciOiJub25lIn0.eyJzdWIiOiIxMjM0NTY3ODkwIiwibmFtZSI6IkpvaG4gRG9lIiwiYWRtaW4iOnRydWUsImlhdCI6MTczNjI5MjEyNH0.
      description: Response containing access token set for HubSpot auth.
      allOf:
      - $ref: '#/components/schemas/IntegrationCredentialsResponse'
      - $ref: '#/components/schemas/AbstractResponseWithAuditFields'
      - $ref: '#/components/schemas/AbstractResponse'
    IntegrationStripeSignedCredentialsResponse:
      type: object
      properties:
        signingKey:
          type: string
          description: the public key from a Stripe webhook that can be used to authenticate an inbound request.
          example: signing key
      description: Response containing a credential set for inbound webhooks from Stripe.
      allOf:
      - $ref: '#/components/schemas/IntegrationCredentialsResponse'
      - $ref: '#/components/schemas/AbstractResponseWithAuditFields'
      - $ref: '#/components/schemas/AbstractResponse'
  responses:
    Error:
      description: Error message
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
  securitySchemes:
    OAuth2:
      type: oauth2
      description: "m3ter supports machine to machine authentication using the `clientCredentials` OAuth2 flow.\n\nThe `authorizationCode` flow controls access for human users via the m3ter Console application. \n"
      flows:
        clientCredentials:
          tokenUrl: /oauth/token
          scopes:
            m3ter-resources/m3ter-scope: m3ter resources
        authorizationCode:
          authorizationUrl: https://m3ter.auth.us-east-1.amazoncognito.com/oauth2/authorize
          tokenUrl: https://m3ter.auth.us-east-1.amazoncognito.com/oauth2/token
          scopes:
            m3ter-resources/m3ter-scope: m3ter resources
            openid: OpenID
            email: email
