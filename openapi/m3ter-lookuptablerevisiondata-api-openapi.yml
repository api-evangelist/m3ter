        5XX:
          $ref: '#/components/responses/Error'
  /organizations/{orgId}/lookuptables/{lookupTableId}/revisions/{lookupTableRevisionId}/data/copy:
    post:
      tags:
      - LookupTableRevisionData
      summary: Copy LookupTableRevisionData
      description: 'Copy the Lookup Table Revision Data from a source Revision to an optional target Revision:

        * If you omit a target `revisionId`, then the source Revision and its Data is duplicated. The new Revision is given the source Revision''s name appended with "Copy" but is assigned a new unique id.

        * If you specify a target `revisionId` to copy the source Revision and its Data to, you must ensure that the target Revision has a Data schema that matches the source Revision''s Data schema otherwise you''ll receive an error'
      operationId: CopyLookupTableRevisionData
      parameters:
      - name: orgId
        in: path
        description: UUID of the Organization. The Organization represents your company as a direct customer of the m3ter service.
        required: true
        style: simple
        explode: false
        schema:
          type: string
          deprecated: true
          x-stainless-deprecation-message: the org id should be set at the client level instead
      - name: lookupTableId
        in: path
        description: UUID of the Lookup Table.
        required: true
        style: simple
        explode: false
        schema:
          type: string
      - name: lookupTableRevisionId
        in: path
        description: UUID of the source Lookup Table Revision to copy from.
        required: true
        style: simple
        explode: false
        schema:
          type: string
      requestBody:
        description: ''
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LookupTableRevisionCopyRequest'
        required: false
      responses:
        '200':
          description: Returns the Data JobId and target RevisionId
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LookupTableRevisionCopyResponse'
        4XX:
          $ref: '#/components/responses/Error'
        5XX:
          $ref: '#/components/responses/Error'
