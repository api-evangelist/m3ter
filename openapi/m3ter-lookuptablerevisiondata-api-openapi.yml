      description: List Lookup Table Revision Data items for the given UUID.
      operationId: GetLookupTableRevisionData
      parameters:
      - name: orgId
        in: path
        description: UUID of the Organization. The Organization represents your company as a direct customer of the m3ter service.
        required: true
        style: simple
        explode: false
        schema:
          type: string
          deprecated: true
          x-stainless-deprecation-message: the org id should be set at the client level instead
      - name: lookupTableId
        in: path
        description: UUID of the Lookup Table.
        required: true
        style: simple
        explode: false
        schema:
          type: string
      - name: lookupTableRevisionId
        in: path
        description: UUID of the Lookup Table Revision.
        required: true
        style: simple
        explode: false
        schema:
          type: string
      - name: limit
        in: query
        description: 'The maximum number of Data items to return. Defaults to 2000. You can set this to return fewer items if required.


          If you expect the Revision to contain more than 2000 Data items, you can use the [Trigger Downlad URL Job](https://www.m3ter.com/docs/api#tag/LookupTableRevisionData/operation/TriggerDownloadJob) to download the Lookup Table Revision Data.'
