openapi: 3.2.0
info:
  title: m3ter Lookup Table Revision Data API
  description: 'If you are using Postman, you can:

    - Use the **Download** button above to download the m3ter Open API spec JSON file and then import this file as the **m3ter API Collection** into your Workspace. See Importing the m3ter Open API in our main user Documentation for details. - Copy this link: m3ter-Template API Collection and use it to import the **m3ter-Template API Collection** into your Workspace. See Importing the m3ter Template API Collection in our main user Documentation for details. ---


    # Introduction

    The m3ter platform supports two HTTP-based REST APIs returning JSON encoded responses:

    - The **Ingest API**, which you can use for submitting raw data measurements. *(See the Submit Measurements endpoint in this API Reference.)*

    - The **Config API**, which you can use for configuration and management. *(All other endpoints in this API Reference.)*


    ## Authentication and Authorization

    Our APIs use an industry-standard authorization protocol known as the OAuth 2.0 specification. OAuth2 supports several grant types, each designed for a specific use case. m3ter uses the following two grant types:

    - **Authorization Code**: Used for human login access via the m3ter Console. - **Client Credentials**: Used for machine-to-machine communication and API access. Complete the following flow for API access:


    1. **Create a Service User and add Permissions**: Log in to the m3ter Console, go to **Settings**, **Access** then **Service Users** tab, and create a Service User. To enable API calls, grant the user **Administrator** permissions. 2. **Generate Access Keys**: In the Console, open the *Overview* page for the Service User by clicking on the name. Generate an **Access Key id** and **Api Secret**. Make sure you copy the **Api Secret** because it is only visible at the time of creation. See Service Authentication for detailed instructions and an example. 3. **Obtain a Bearer Token using Basic Auth**: We implement the OAuth 2.0 Client Credentials Grant authentication flow for Service User Authentication. Submit a request to the m3ter OAuth Client Credentials authentication flow, using your concatenated **Access Key id** and **Api Secret** to obtain a Bearer Token for your Service User. *See examples below.*


    4. **Bearer Token Usage**: Use the HTTP ''Authorization'' header with the bearer token to authorise all subsequent API requests. > Warning: The Bearer Token is valid for 18,000 seconds or 5 hours. When the token has expired, you must obtain a new one. Below are two examples for obtaining a Bearer Token using Basic Auth: the first in cURL and the second as a Python script. ### cURL Example

    1. Open your terminal or command prompt. 2. Use the following `cURL` command to obtain a Bearer Token:


    ```bash

    curl -X POST https://api.m3ter.com/oauth/token \

    -H ''Content-Type: application/x-www-form-urlencoded'' \

    -u your_access_key_id:your_api_secret \

    -d ''grant_type=client_credentials''

    ```


    Replace `your_access_key_id` and `your_api_secret` with your actual **Access Key id** and **Api Secret**. 3. Run the command, and if successful, it will return a JSON response containing the Bearer Token. The response will look like this:


    ```json

    {

    "access_token": "your_bearer_token",

    "token_type": "Bearer",

    "expires_in": 18000

    }

    ```


    You can then use the Bearer Token *(the value of `"access_token"`)* for subsequent API calls to m3ter. ### Python Example

    1. Install the `requests` library if you haven''t already:


    ```bash

    pip install requests

    ```


    2.'
  version: '1.0'
  x-logo:
    url: https://console.m3ter.com/m3ter-logo-black.svg
servers:
- url: https://api.m3ter.com
security:
- OAuth2: []
tags:
- name: LookupTableRevisionData
  description: 'Endpoints for creating/updating/deleting Data for specific Lookup Table Revisions.


    When you''ve added fields to create a data schema for a Lookup Table Revision, you can use upsert operations to create or update the data values for those fields:

    * Use Upsert LookupTableRevisionData to upsert some or all of a Revision''s field data values.

    * Use Upsert LookupTableRevisionData Entry to upsert an individual Revision field''s data value.


    **NOTES:**

    * You can only create or update field data values for DRAFT Revisions.

    * You cannot change the field data values for PUBLISHED Revisions.


    **Beta Version!** The Lookup Table feature is currently available in Beta release version. See Feature Release Stages for Beta release definition. Lookup Table Revision Data endpoints will only be available if Lookup Tables have been enabled for your Organization. For more details see Lookup Tables (Beta) in our main User documentation.'
paths:
  /organizations/{orgId}/lookuptables/{lookupTableId}/revisions/{lookupTableRevisionId}/data:
    get:
      tags:
      - LookupTableRevisionData
      summary: Get LookupTableRevisionData
      description: List Lookup Table Revision Data items for the given UUID.
      operationId: GetLookupTableRevisionData
      parameters:
      - name: orgId
        in: path
        description: UUID of the Organization. The Organization represents your company as a direct customer of the m3ter service.
        required: true
        style: simple
        explode: false
        schema:
          type: string
      - name: lookupTableId
        in: path
        description: UUID of the Lookup Table.
        required: true
        style: simple
        explode: false
        schema:
          type: string
      - name: lookupTableRevisionId
        in: path
        description: UUID of the Lookup Table Revision.
        required: true
        style: simple
        explode: false
        schema:
          type: string
      - name: limit
        in: query
        description: 'The maximum number of Data items to return. Defaults to 2000. You can set this to return fewer items if required.


          If you expect the Revision to contain more than 2000 Data items, you can use the [Trigger Downlad URL Job](https://www.m3ter.com/docs/api#tag/LookupTableRevisionData/operation/TriggerDownloadJob) to download the Lookup Table Revision Data.'
        required: false
        style: form
        explode: true
        schema:
          type: integer
          format: int32
          default: 2000
      - name: additional
        in: query
        description: Comma separated list of additional fields. For example, you can use `additional=lookupKey` to get the lookup key returned for each Data item. You can then use a lookup key for the Get/Upsert/Delete data entry endpoints in this section.
        required: false
        allowEmptyValue: true
        style: form
        explode: true
        schema:
          type: array
          items:
            type: string
      responses:
        '200':
          description: Returns the LookupTableRevisionData
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LookupTableRevisionDataResponse'
        4XX:
          $ref: '#/components/responses/Error'
        5XX:
          $ref: '#/components/responses/Error'
    put:
      tags:
      - LookupTableRevisionData
      summary: Upsert LookupTableRevisionData
      description: Create/update the Lookup Table Revision Data for the given UUID.
      operationId: PutLookupTableRevisionData
      parameters:
      - name: orgId
        in: path
        description: UUID of the Organization. The Organization represents your company as a direct customer of the m3ter service.
        required: true
        style: simple
        explode: false
        schema:
          type: string
      - name: lookupTableId
        in: path
        description: UUID of the Lookup Table.
        required: true
        style: simple
        explode: false
        schema:
          type: string
      - name: lookupTableRevisionId
        in: path
        description: UUID of the Lookup Table Revision.
        required: true
        style: simple
        explode: false
        schema:
          type: string
      - name: additional
        in: query
        description: Comma separated list of additional fields. For example, you can use `additional=lookupKey` to get the lookup key returned for each Data item. You can then use a lookup key for the Get/Upsert/Delete data entry endpoints in this section.
        required: false
        allowEmptyValue: true
        style: form
        explode: true
        schema:
          type: array
          items:
            type: string
      requestBody:
        description: ''
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LookupTableRevisionDataRequest'
        required: true
      responses:
        '200':
          description: Returns the upserted LookupTableRevisionData
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LookupTableRevisionDataResponse'
        4XX:
          $ref: '#/components/responses/Error'
        5XX:
          $ref: '#/components/responses/Error'
    delete:
      tags:
      - LookupTableRevisionData
      summary: Delete LookupTableRevisionData
      description: Delete the Lookup Table Revision Data for the given UUID.
      operationId: DeleteLookupTableRevisionData
      parameters:
      - name: orgId
        in: path
        description: UUID of the Organization. The Organization represents your company as a direct customer of the m3ter service.
        required: true
        style: simple
        explode: false
        schema:
          type: string
      - name: lookupTableId
        in: path
        description: UUID of the Lookup Table.
        required: true
        style: simple
        explode: false
        schema:
          type: string
      - name: lookupTableRevisionId
        in: path
        description: UUID of the Lookup Table Revision.
        required: true
        style: simple
        explode: false
        schema:
          type: string
      responses:
        '200':
          description: Returns the result for Delete of LookupTableRevisionData
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LookupTableRevisionDataDeleteResponse'
        4XX:
          $ref: '#/components/responses/Error'
        5XX:
          $ref: '#/components/responses/Error'
  /organizations/{orgId}/lookuptables/{lookupTableId}/revisions/{lookupTableRevisionId}/data/archived:
    post:
      tags:
      - LookupTableRevisionData
      summary: Get LookupTableRevisionArchivedData URL
      description: 'Get a URL which you can use to download the data for the specified archived Lookup Table Revision:

        * The `contentType` request parameter is required.

        * The returned URL is presigned - you can copy it into a browser and the data file is downloaded locally.

        * The upload URL is time limited - the `expiry` time is given in the response and the URL is valid for ***one hour***.'
      operationId: GetLookupTableRevisionArchivedDataUrl
      parameters:
      - name: orgId
        in: path
        description: UUID of the organization
        required: true
        style: simple
        explode: false
        schema:
          type: string
      - name: lookupTableId
        in: path
        description: UUID of the LookupTable
        required: true
        style: simple
        explode: false
        schema:
          type: string
      - name: lookupTableRevisionId
        in: path
        description: UUID of the LookupTableRevision
        required: true
        style: simple
        explode: false
        schema:
          type: string
      requestBody:
        description: ''
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LookupTableDataArchivedRequest'
        required: true
      responses:
        '200':
          description: Returns the URL.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LookupTableDataArchivedResponse'
        4XX:
          $ref: '#/components/responses/Error'
        5XX:
          $ref: '#/components/responses/Error'
  /organizations/{orgId}/lookuptables/{lookupTableId}/revisions/{lookupTableRevisionId}/data/copy:
    post:
      tags:
      - LookupTableRevisionData
      summary: Copy LookupTableRevisionData
      description: 'Copy the Lookup Table Revision Data from a source Revision to an optional target Revision:

        * If you omit a target `revisionId`, then the source Revision and its Data is duplicated. The new Revision is given the source Revision''s name appended with "Copy" but is assigned a new unique id.

        * If you specify a target `revisionId` to copy the source Revision and its Data to, you must ensure that the target Revision has a Data schema that matches the source Revision''s Data schema otherwise you''ll receive an error'
      operationId: CopyLookupTableRevisionData
      parameters:
      - name: orgId
        in: path
        description: UUID of the Organization. The Organization represents your company as a direct customer of the m3ter service.
        required: true
        style: simple
        explode: false
        schema:
          type: string
      - name: lookupTableId
        in: path
        description: UUID of the Lookup Table.
        required: true
        style: simple
        explode: false
        schema:
          type: string
      - name: lookupTableRevisionId
        in: path
        description: UUID of the source Lookup Table Revision to copy from.
        required: true
        style: simple
        explode: false
        schema:
          type: string
      requestBody:
        description: ''
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LookupTableRevisionCopyRequest'
        required: false
      responses:
        '200':
          description: Returns the Data JobId and target RevisionId
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LookupTableRevisionCopyResponse'
        4XX:
          $ref: '#/components/responses/Error'
        5XX:
          $ref: '#/components/responses/Error'
  /organizations/{orgId}/lookuptables/{lookupTableId}/revisions/{lookupTableRevisionId}/data/generateuploadurl:
    post:
      tags:
      - LookupTableRevisionData
      summary: Generate LookupTableRevisionData Upload URL
      description: 'Generate a URL which can be used to upload a data file for creating or updating the Lookup Table Revision''s data:


        * An upload URL is returned together with an UPLOAD `jobId`.

        * You can then upload your data file using a PUT request using the returned upload URL as the endpoint. For the PUT request, map the headers returned and their values and in the request body select the specified CSV or JSONL file containing the Revision Data to upload.

        * You can use the returned UPLOAD `jobId` with the List LookupTableRevisionData Jobs or the Get LookupTableRevisionData Job Response endpoints for any follow-up or troubleshooting.


        **Important:**

        * The `contentLength` request parameter is required.

        * The upload URL is time limited - it is valid for ***one minute***.'
      operationId: GenerateLookupTableDataUploadUrl
      parameters:
      - name: orgId
        in: path
        description: UUID of the Organization. The Organization represents your company as a direct customer of the m3ter service.
        required: true
        style: simple
        explode: false
        schema:
          type: string
      - name: lookupTableId
        in: path
        description: UUID of the Lookup Table.
        required: true
        style: simple
        explode: false
        schema:
          type: string
      - name: lookupTableRevisionId
        in: path
        description: UUID of the Lookup Table Revision.
        required: true
        style: simple
        explode: false
        schema:
          type: string
      requestBody:
        description: ''
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LookupTableDataUploadRequest'
        required: true
      responses:
        '200':
          description: Returns the upload URL.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LookupTableDataUploadResponse'
        4XX:
          $ref: '#/components/responses/Error'
        5XX:
          $ref: '#/components/responses/Error'
  /organizations/{orgId}/lookuptables/{lookupTableId}/revisions/{lookupTableRevisionId}/data/jobs:
    get:
      tags:
      - LookupTableRevisionData
      summary: List LookupTableRevisionData Jobs
      description: 'List the Lookup Table Revision Data job Responses for the given Lookup Table Revision.


        There are four types of Revision Data jobs:

        * **COPY**. Job runs when you use the Copy LookupTableRevisionData endpoint which returns the `jobId`.

        * **UPLOAD**. Job runs when you use the Generate LookupTableRevisionData Upload URL endpoint which returns the `jobId`.

        * **DOWNLOAD**. Job runs when you use the [](https://www.m3ter.com/docs/api#tag/LookupTableRevisionData/operation/TriggerLookupTableRevisionDataDownloadJob) endpoint which returns the `jobId`.

        * **ARCHIVE**. Job runs when you either manually change a DRAFT Revision to PUBLISHED using the Update LookupTableRevision Status endpoint or you publish a DRAFT Revision and the existing PUBLISHED Revision is archived.


        **NOTE:** This endpoint returns the id of each Data job. You then use:

        * The Get LookupTableRevisionData Job Response endpoint to retrieve a specific Data job Response.

        * The Delete LookupTableRevisionData Job Response to delete a specific Data job Response.'
      operationId: ListLookupTableRevisionDataJobs
      parameters:
      - name: orgId
        in: path
        description: UUID of the Organization. The Organization represents your company as a direct customer of the m3ter service.
        required: true
        style: simple
        explode: false
        schema:
          type: string
      - name: lookupTableId
        in: path
        description: UUID of the Lookup Table.
        required: true
        style: simple
        explode: false
        schema:
          type: string
      - name: lookupTableRevisionId
        in: path
        description: UUID of the Lookup Table Revision.
        required: true
        style: simple
        explode: false
        schema:
          type: string
      - name: pageSize
        in: query
        description: The number of Lookup Table Revision Data Job Responses to retrieve per page.
        required: false
        allowEmptyValue: true
        style: form
        explode: true
        schema:
          maximum: 100
          minimum: 1
          type: integer
          format: int32
      - name: nextToken
        in: query
        description: The nextToken for multi page retrievals
        required: false
        allowEmptyValue: true
        style: form
        explode: true
        schema:
          type: string
      responses:
        '200':
          description: Returns a List of LookupTableRevisionDataJob Responses
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedLookupTableRevisionDataJobResponseData'
        4XX:
          $ref: '#/components/responses/Error'
        5XX:
          $ref: '#/components/responses/Error'
  /organizations/{orgId}/lookuptables/{lookupTableId}/revisions/{lookupTableRevisionId}/data/jobs/download:
    post:
      tags:
      - LookupTableRevisionData
      summary: Trigger Download LookupTableRevisionData URL Job
      description: Trigger an URL job to download the Lookup Table Revision Data. The URL download Data `jobId` is returned and you can then use the List LookupTableRevisionData Jobs endpoint or the Get LookupTableRevisionData Job Response endpoint to retrieve the URL and perform the Revision data Download.
      operationId: TriggerLookupTableRevisionDataDownloadJob
      parameters:
      - name: orgId
        in: path
        description: UUID of the Organization. The Organization represents your company as a direct customer of the m3ter service.
        required: true
        style: simple
        explode: false
        schema:
          type: string
      - name: lookupTableId
        in: path
        description: UUID of the Lookup Table.
        required: true
        style: simple
        explode: false
        schema:
          type: string
      - name: lookupTableRevisionId
        in: path
        description: UUID of the Lookup Table Revision.
        required: true
        style: simple
        explode: false
        schema:
          type: string
      requestBody:
        description: ''
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LookupTableDataDownloadJobRequest'
        required: true
      responses:
        '200':
          description: Returns the trigger Download URL jobId.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LookupTableDataDownloadJobResponse'
        4XX:
          $ref: '#/components/responses/Error'
        5XX:
          $ref: '#/components/responses/Error'
  /organizations/{orgId}/lookuptables/{lookupTableId}/revisions/{lookupTableRevisionId}/data/jobs/{id}:
    get:
      tags:
      - LookupTableRevisionData
      summary: Get LookupTableRevisionData Job Response
      description: 'Get the Lookup Table Revision Data job Response for given job id.


        **NOTE:** Use the List LookupTableRevisionData Jobs endpoint to list the Data job Responses for a specific Revision.'
      operationId: GetLookupTableRevisionDataJobResponse
      parameters:
      - name: orgId
        in: path
        description: UUID of the Organization. The Organization represents your company as a direct customer of the m3ter service.
        required: true
        style: simple
        explode: false
        schema:
          type: string
      - name: lookupTableId
        in: path
        description: UUID of the Lookup Table.
        required: true
        style: simple
        explode: false
        schema:
          type: string
      - name: lookupTableRevisionId
        in: path
        description: UUID of the Lookup Table Revision.
        required: true
        style: simple
        explode: false
        schema:
          type: string
      - name: id
        in: path
        description: UUID of the Lookup Table Revision Data job.
        required: true
        style: simple
        explode: false
        schema:
          type: string
      responses:
        '200':
          description: Returns the LookupTableRevisionDataJob Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LookupTableRevisionDataJobResponse'
        4XX:
          $ref: '#/components/responses/Error'
        5XX:
          $ref: '#/components/responses/Error'
    delete:
      tags:
      - LookupTableRevisionData
      summary: Delete LookupTableRevisionData Job Response
      description: 'Delete the LookupTableRevisionData Job Response for given job id.


        **NOTE:** Use the List LookupTableRevisionData Jobs endpoint to list the Data job Responses for a specific Revision.'
      operationId: DeleteLookupTableRevisionDataJobResponse
      parameters:
      - name: orgId
        in: path
        description: UUID of the Organization. The Organization represents your company as a direct customer of the m3ter service.
        required: true
        style: simple
        explode: false
        schema:
          type: string
      - name: lookupTableId
        in: path
        description: UUID of the Lookup Table.
        required: true
        style: simple
        explode: false
        schema:
          type: string
      - name: lookupTableRevisionId
        in: path
        description: UUID of the Lookup Table Revision.
        required: true
        style: simple
        explode: false
        schema:
          type: string
      - name: id
        in: path
        description: UUID of the Lookup Table Revision Data job.
        required: true
        style: simple
        explode: false
        schema:
          type: string
      responses:
        '200':
          description: Returns the deleted LookupTableRevisionDataJob Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LookupTableRevisionDataJobResponse'
        4XX:
          $ref: '#/components/responses/Error'
        5XX:
          $ref: '#/components/responses/Error'
  /organizations/{orgId}/lookuptables/{lookupTableId}/revisions/{lookupTableRevisionId}/data/{lookupKey}:
    get:
      tags:
      - LookupTableRevisionData
      summary: Get LookupTableRevisionData entry
      description: 'Retrieve a Lookup Table Revision Data item for the given lookup key.


        **NOTES:**

        * To obtain the lookup key for a Revision''s data items, use the Get LookupTableRevisionData endpoint in this section and use the `additional=lookupKey` query parameter.

        * If the Revision''s Data schema uses multiple key fields, enter these as a comma-separated list for the `lookupKey` path parameter: .../key1,key2,key3 and so on. Importantly, multiple keys must be *entered in the same order* as they are configured in the Revision''s Data schema.'
      operationId: GetLookupTableRevisionDataEntry
      parameters:
      - name: orgId
        in: path
        description: UUID of the Organization. The Organization represents your company as a direct customer of the m3ter service.
        required: true
        style: simple
        explode: false
        schema:
          type: string
      - name: lookupTableId
        in: path
        description: UUID of the Lookup Table.
        required: true
        style: simple
        explode: false
        schema:
          type: string
      - name: lookupTableRevisionId
        in: path
        description: UUID of the Lookup Table Revision.
        required: true
        style: simple
        explode: false
        schema:
          type: string
      - name: lookupKey
        in: path
        description: The specific lookup key for the Data item to retrieve.
        required: true
        style: simple
        explode: false
        schema:
          type: string
      responses:
        '200':
          description: Returns the LookupTableRevisionData item
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LookupTableRevisionDataResponse'
        4XX:
          $ref: '#/components/responses/Error'
        5XX:
          $ref: '#/components/responses/Error'
    put:
      tags:
      - LookupTableRevisionData
      summary: Upsert LookupTableRevisionData entry
      description: 'Create/update a Lookup Table Revision Data item by lookup key.


        **NOTES:**

        * To obtain the lookup key for a Revision''s data items, use the Get LookupTableRevisionData endpoint in this section and use the `additional=lookupKey` query parameter.

        * If the Revision''s Data schema uses multiple key fields, enter these as a comma-separated list for the `lookupKey` path parameter: .../key1,key2,key3 and so on. Importantly, multiple keys must be *entered in the same order* as they are configured in the Revision''s Data schema.'
      operationId: PutLookupTableRevisionDataEntry
      parameters:
      - name: orgId
        in: path
        description: UUID of the Organization. The Organization represents your company as a direct customer of the m3ter service.
        required: true
        style: simple
        explode: false
        schema:
          type: string
      - name: lookupTableId
        in: path
        description: UUID of the Lookup Table.
        required: true
        style: simple
        explode: false
        schema:
          type: string
      - name: lookupTableRevisionId
        in: path
        description: UUID of the Lookup Table Revision.
        required: true
        style: simple
        explode: false
        schema:
          type: string
      - name: lookupKey
        in: path
        description: The specific lookup key for the Data item to upsert.
        required: true
        style: simple
        explode: false
        schema:
          type: string
      - name: additional
        in: query
        description: Comma separated list of additional fields. For example, you can use `additional=lookupKey` to get the lookup key returned for the Data item.
        required: false
        allowEmptyValue: true
        style: form
        explode: true
        schema:
          type: array
          items:
            type: string
      requestBody:
        description: ''
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LookupTableRevisionDataItemUpsertRequest'
        required: true
      responses:
        '200':
          description: Returns the upserted Lookup Table Revision Data item
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LookupTableRevisionDataResponse'
        4XX:
          $ref: '#/components/responses/Error'
        5XX:
          $ref: '#/components/responses/Error'
    delete:
      tags:
      - LookupTableRevisionData
      summary: Delete LookupTableRevisionData entry
      description: 'Delete a Lookup Table Revision Data entry by lookup key.


