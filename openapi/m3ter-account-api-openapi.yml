          billEpoch:
            type: string
            description: 'Defines first bill date for Account Bills. For example, if the Plan attached to the Account is set for monthly billing frequency and you set the first bill date to be January 1st, Bills are created every month starting on that date.


              Optional attribute - if not defined, then first bill date is determined by the Epoch settings at Organizational level.'
