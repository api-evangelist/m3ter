openapi: 3.2.0
info:
  title: m3ter External Mapping API
  description: 'If you are using Postman, you can:

    - Use the **Download** button above to download the m3ter Open API spec JSON file and then import this file as the **m3ter API Collection** into your Workspace. See Importing the m3ter Open API in our main user Documentation for details. - Copy this link: m3ter-Template API Collection and use it to import the **m3ter-Template API Collection** into your Workspace. See Importing the m3ter Template API Collection in our main user Documentation for details. ---


    # Introduction

    The m3ter platform supports two HTTP-based REST APIs returning JSON encoded responses:

    - The **Ingest API**, which you can use for submitting raw data measurements. *(See the Submit Measurements endpoint in this API Reference.)*

    - The **Config API**, which you can use for configuration and management. *(All other endpoints in this API Reference.)*


    ## Authentication and Authorization

    Our APIs use an industry-standard authorization protocol known as the OAuth 2.0 specification. OAuth2 supports several grant types, each designed for a specific use case. m3ter uses the following two grant types:

    - **Authorization Code**: Used for human login access via the m3ter Console. - **Client Credentials**: Used for machine-to-machine communication and API access. Complete the following flow for API access:


    1. **Create a Service User and add Permissions**: Log in to the m3ter Console, go to **Settings**, **Access** then **Service Users** tab, and create a Service User. To enable API calls, grant the user **Administrator** permissions. 2. **Generate Access Keys**: In the Console, open the *Overview* page for the Service User by clicking on the name. Generate an **Access Key id** and **Api Secret**. Make sure you copy the **Api Secret** because it is only visible at the time of creation. See Service Authentication for detailed instructions and an example. 3. **Obtain a Bearer Token using Basic Auth**: We implement the OAuth 2.0 Client Credentials Grant authentication flow for Service User Authentication. Submit a request to the m3ter OAuth Client Credentials authentication flow, using your concatenated **Access Key id** and **Api Secret** to obtain a Bearer Token for your Service User. *See examples below.*


    4. **Bearer Token Usage**: Use the HTTP ''Authorization'' header with the bearer token to authorise all subsequent API requests. > Warning: The Bearer Token is valid for 18,000 seconds or 5 hours. When the token has expired, you must obtain a new one. Below are two examples for obtaining a Bearer Token using Basic Auth: the first in cURL and the second as a Python script. ### cURL Example

    1. Open your terminal or command prompt. 2. Use the following `cURL` command to obtain a Bearer Token:


    ```bash

    curl -X POST https://api.m3ter.com/oauth/token \

    -H ''Content-Type: application/x-www-form-urlencoded'' \

    -u your_access_key_id:your_api_secret \

    -d ''grant_type=client_credentials''

    ```


    Replace `your_access_key_id` and `your_api_secret` with your actual **Access Key id** and **Api Secret**. 3. Run the command, and if successful, it will return a JSON response containing the Bearer Token. The response will look like this:


    ```json

    {

    "access_token": "your_bearer_token",

    "token_type": "Bearer",

    "expires_in": 18000

    }

    ```


    You can then use the Bearer Token *(the value of `"access_token"`)* for subsequent API calls to m3ter. ### Python Example

    1. Install the `requests` library if you haven''t already:


    ```bash

    pip install requests

    ```


    2.'
  version: '1.0'
  x-logo:
    url: https://console.m3ter.com/m3ter-logo-black.svg
servers:
- url: https://api.m3ter.com
security:
- OAuth2: []
tags:
- name: External Mapping
paths:
  /organizations/{orgId}/externalmappingconfiguration/values/{destination}/{entityType}:
    get:
      tags:
      - External Mapping
      summary: Retrieve External Entities from Destination
      description: 'Retrieve a list of external entities from the specified destination system.


        This endpoint enables you to retrieve a list of potential values for creating an External Mapping from a specified destination system. The list is only returned if the destination system has been authenticated successfully and it supports such functionality, otherwise, you will receive an empty response.'
      operationId: GetExternalMappingOptionsForDestination
      parameters:
      - name: orgId
        in: path
        description: The unique identifier (UUID) of your Organization. The Organization represents your company as a direct customer of our service.
        required: true
        style: simple
        explode: false
        schema:
          type: string
      - name: destination
        in: path
        description: The name of the destination system from where the external entities are to be retrieved.
        required: true
        style: simple
        explode: false
        schema:
          type: string
      - name: entityType
        in: path
        description: The m3ter entity type.
        required: true
        style: simple
        explode: false
        schema:
          type: string
      - name: externalTable
        in: query
        description: Name of the target externalTable
        required: false
        allowEmptyValue: true
        style: form
        explode: true
        schema:
          type: string
      responses:
        '200':
          description: Returns a list of the external systems entities
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ExternalEntityResponse'
        4XX:
          $ref: '#/components/responses/Error'
        5XX:
          $ref: '#/components/responses/Error'
  /organizations/{orgId}/externalmappings:
    get:
      tags:
      - External Mapping
      summary: List External Mappings
      description: 'Retrieve a list of all External Mapping entities.


        This endpoint retrieves a list of all External Mapping entities for a specific Organization. The list can be paginated for better management, and supports filtering using the external system.'
      operationId: ListExternalMappings
      parameters:
      - name: orgId
        in: path
        description: The unique identifier (UUID) of your Organization. The Organization represents your company as a direct customer of our service.
        required: true
        style: simple
        explode: false
        schema:
          type: string
      - name: pageSize
        in: query
        description: Specifies the maximum number of External Mappings to retrieve per page.
        required: false
        allowEmptyValue: true
        style: form
        explode: true
        schema:
          maximum: 200
          minimum: 1
          type: integer
          format: int32
      - name: nextToken
        in: query
        description: The `nextToken` for multi-page retrievals. It is used to fetch the next page of External Mappings in a paginated list.
        required: false
        allowEmptyValue: true
        style: form
        explode: true
        schema:
          type: string
      - name: externalSystemId
        in: query
        description: 'The name of the external system to use as a filter.


          For example, if you want to list only those external mappings created for your Organization for the Salesforce external system, use:


          `?externalSystemId=Salesforce`'
        required: false
        style: form
        explode: true
        schema:
          type: string
      - name: m3terIds
        in: query
        description: IDs for m3ter entities
        required: false
        style: form
        explode: true
        schema:
          type: array
          items:
            type: object
      - name: integrationConfigId
        in: query
        description: ID of the integration config
        required: false
        style: form
        explode: true
        schema:
          type: string
      responses:
        '200':
          description: 'Returns the list of External Mapping entities '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedExternalMappingResponseData'
        4XX:
          $ref: '#/components/responses/Error'
        5XX:
          $ref: '#/components/responses/Error'
    post:
      tags:
      - External Mapping
      summary: Create an External Mapping
      description: 'Creates a new External Mapping.


        This endpoint enables you to create a new External Mapping for the specified Organization. You need to supply a request body with the details of the new External Mapping.'
      operationId: CreateExternalMapping
      parameters:
      - name: orgId
        in: path
        description: The unique identifier (UUID) of your Organization. The Organization represents your company as a direct customer of our service.
        required: true
        style: simple
        explode: false
        schema:
          type: string
      requestBody:
        description: ''
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExternalMappingRequest'
        required: true
      responses:
        '200':
          description: Returns the created External Mapping
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExternalMappingResponse'
        4XX:
          $ref: '#/components/responses/Error'
        5XX:
          $ref: '#/components/responses/Error'
  /organizations/{orgId}/externalmappings/external/{entity}/{m3terId}:
    get:
      tags:
      - External Mapping
      summary: List External Mappings for a m3ter Entity
      description: 'Retrieve a list of External Mapping entities for a specified m3ter entity.


        Use this endpoint to retrieve a list of External Mapping entities associated with a specific m3ter entity. The list can be paginated for easier management.'
      operationId: ListExternalMappingsForM3terEntity
      parameters:
      - name: orgId
        in: path
        description: The unique identifier (UUID) of your Organization. The Organization represents your company as a direct customer of our service.
        required: true
        style: simple
        explode: false
        schema:
          type: string
      - name: entity
        in: path
        description: The entity type.
        required: true
        style: simple
        explode: false
        schema:
          type: string
      - name: m3terId
        in: path
        description: The unique identifer (UUID) of the m3ter entity.
        required: true
        style: simple
        explode: false
        schema:
          type: string
      - name: pageSize
        in: query
        description: Specifies the maximum number of External Mappings to retrieve per page.
        required: false
        allowEmptyValue: true
        style: form
        explode: true
        schema:
          maximum: 200
          minimum: 1
          type: integer
          format: int32
      - name: nextToken
        in: query
        description: The `nextToken` for multi-page retrievals. It is used to fetch the next page of External Mappings in a paginated list.
        required: false
        allowEmptyValue: true
        style: form
        explode: true
        schema:
          type: string
      responses:
        '200':
          description: Returns the list of External Mappings for a m3ter entity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedExternalMappingResponseData'
        4XX:
          $ref: '#/components/responses/Error'
        5XX:
          $ref: '#/components/responses/Error'
  /organizations/{orgId}/externalmappings/externalid/{system}/{externalTable}/{externalId}:
    get:
      tags:
      - External Mapping
      summary: List External Mappings for External Entity
      description: 'Retrieve a list of External Mapping entities for a specified external system entity.


        Use this endpoint to retrieve a list of External Mapping entities associated with a specific external system entity. The list can be paginated for easier management.'
      operationId: ListExternalMappingsForExternalSystemAndEntity
      parameters:
      - name: orgId
        in: path
        description: The unique identifier (UUID) of your Organization. The Organization represents your company as a direct customer of our service.
        required: true
        style: simple
        explode: false
        schema:
          type: string
      - name: system
        in: path
        description: The identifier for the external system.
        required: true
        style: simple
        explode: false
        schema:
          type: string
      - name: externalTable
        in: path
        description: 'The identifier for the external table. '
        required: true
        style: simple
        explode: false
        schema:
          type: string
      - name: externalId
        in: path
        description: The unique identifier (UUID) for the external entity.
        required: true
        style: simple
        explode: false
        schema:
          type: string
      - name: pageSize
        in: query
        description: Specifies the maximum number of External Mappings to retrieve per page.
        required: false
        allowEmptyValue: true
        style: form
        explode: true
        schema:
          maximum: 200
          minimum: 1
          type: integer
          format: int32
      - name: nextToken
        in: query
        description: The `nextToken` for multi-page retrievals. It is used to fetch the next page of External Mappings in a paginated list.
        required: false
        allowEmptyValue: true
        style: form
        explode: true
        schema:
          type: string
      responses:
        '200':
          description: Returns the list of External Mapping entities for the external entity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedExternalMappingResponseData'
        4XX:
          $ref: '#/components/responses/Error'
        5XX:
          $ref: '#/components/responses/Error'
  /organizations/{orgId}/externalmappings/{id}:
    get:
      tags:
      - External Mapping
      summary: Retrieve External Mapping
      description: 'Retrieve an External Mapping with the given UUID.


        This endpoint enables you to retrieve the External Mapping with the specified UUID for a specific Organization.'
      operationId: GetExternalMapping
      parameters:
      - name: orgId
        in: path
        description: The unique identifier (UUID) of your Organization. The Organization represents your company as a direct customer of our service.
        required: true
        style: simple
        explode: false
        schema:
          type: string
      - name: id
        in: path
        description: The unique identifier (UUID) of the External Mapping to retrieve.
        required: true
        style: simple
        explode: false
        schema:
          type: string
      responses:
        '200':
          description: Returns the External Mapping
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExternalMappingResponse'
        4XX:
          $ref: '#/components/responses/Error'
        5XX:
          $ref: '#/components/responses/Error'
    put:
      tags:
      - External Mapping
      summary: Update External Mapping
      description: 'Updates an External Mapping with the given UUID.


        This endpoint enables you to update an existing External Mapping entity, identified by its UUID. You must supply a request body with the new details for the External Mapping.'
      operationId: UpdateExternalMapping
      parameters:
      - name: orgId
        in: path
        description: The unique identifier (UUID) of your Organization. The Organization represents your company as a direct customer of our service.
        required: true
        style: simple
        explode: false
        schema:
          type: string
      - name: id
        in: path
        description: The unique identifier (UUID) of the External Mapping to retrieve.
        required: true
        style: simple
        explode: false
        schema:
          type: string
      requestBody:
        description: ''
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExternalMappingRequest'
        required: true
      responses:
        '200':
          description: Returns the updated External Mapping
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExternalMappingResponse'
        4XX:
          $ref: '#/components/responses/Error'
        5XX:
          $ref: '#/components/responses/Error'
    delete:
      tags:
      - External Mapping
      summary: Delete an External Mapping
      description: Delete an External Mapping with the given UUID.
      operationId: DeleteExternalMapping
      parameters:
      - name: orgId
        in: path
        description: The unique identifier (UUID) of your Organization. The Organization represents your company as a direct customer of our service.
        required: true
        style: simple
        explode: false
        schema:
          type: string
      - name: id
        in: path
        description: The unique identifier (UUID) of the External Mapping to retrieve.
        required: true
        style: simple
        explode: false
        schema:
          type: string
      responses:
        '200':
          description: Returns the deleted External Mapping
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExternalMappingResponse'
        4XX:
          $ref: '#/components/responses/Error'
        5XX:
          $ref: '#/components/responses/Error'
components:
  schemas:
    ExternalMappingResponse:
      type: object
      description: Response containing an External Mapping entity.
      allOf:
      - $ref: '#/components/schemas/AbstractResponseWithAuditFields'
      - $ref: '#/components/schemas/AbstractResponse'
      - required:
        - externalId
        - externalSystem
        - externalTable
        - m3terEntity
        - m3terId
        type: object
        properties:
          m3terEntity:
            minLength: 1
            type: string
            description: 'The name of the m3ter entity that is part of the External Mapping. For example, this could be "Account". '
            example: Account
          m3terId:
            minLength: 1
            type: string
            description: The unique identifier (UUID) of the m3ter entity.
            example: 00000000-0000-0000-0000-000000000000
          externalSystem:
            minLength: 1
            type: string
            description: 'The name of the external system where the entity you are mapping resides. '
            example: Stripe
          externalTable:
            minLength: 1
            type: string
            description: 'The name of the table in the external system where the entity resides. '
            example: Customer
          externalId:
            minLength: 1
            type: string
            description: The unique identifier (UUID) of the entity in the external system.
            example: cus_00000000000000
          integrationConfigId:
            type: string
            description: UUID of the configuration this mapping is for
            example: 00000000-0000-0000-0000-000000000000
        description: Response containing an ExternalMapping entity
    AbstractRequest:
      type: object
      properties:
        version:
          type: integer
          description: 'The version number of the entity:

            - **Create entity:** Not valid for initial insertion of new entity - *do not use for Create*. On initial Create, version is set at 1 and listed in the response.

            - **Update Entity:**  On Update, version is required and must match the existing version because a check is performed to ensure sequential versioning is preserved. Version is incremented by 1 and listed in the response.'
          format: int64
          x-stainless-terraform-configurability: computed
          x-stainless-terraform-always-send: true
      description: ''
    ExternalMappingRequest:
      required:
      - externalId
      - externalSystem
      - externalTable
      - m3terEntity
      - m3terId
      type: object
      properties:
        m3terEntity:
          minLength: 1
          pattern: ^([^[\p{Cntrl}\s]])|([^[\p{Cntrl}\s]][[^[\p{Cntrl}\s]] ]*[^[\p{Cntrl}\s]])$
          type: string
          description: 'The name of the m3ter entity that you are creating or modifying an External Mapping for. As an example, this could be an "Account". '
          example: Account
        m3terId:
          minLength: 1
          pattern: ^([^[\p{Cntrl}\s]])|([^[\p{Cntrl}\s]][[^[\p{Cntrl}\s]] ]*[^[\p{Cntrl}\s]])$
          type: string
          description: 'The unique identifier (UUID) of the m3ter entity. '
          example: 00000000-0000-0000-0000-000000000000
        externalSystem:
          minLength: 1
          pattern: ^([^[\p{Cntrl}\s]])|([^[\p{Cntrl}\s]][[^[\p{Cntrl}\s]] ]*[^[\p{Cntrl}\s]])$
          type: string
          description: 'The name of the external system where the entity you are mapping resides. '
          example: Stripe
        externalTable:
          minLength: 1
          pattern: ^([^[\p{Cntrl}\s]])|([^[\p{Cntrl}\s]][[^[\p{Cntrl}\s]] ]*[^[\p{Cntrl}\s]])$
          type: string
          description: 'The name of the table in ther external system where the entity resides. '
          example: Customer
        externalId:
          minLength: 1
          pattern: ^([^[\p{Cntrl}\s]])|([^[\p{Cntrl}\s]][[^[\p{Cntrl}\s]] ]*[^[\p{Cntrl}\s]])$
          type: string
          description: 'The unique identifier (UUID) of the entity in the external system. This UUID should already exist in the external system. '
          example: cus_00000000000000
        integrationConfigId:
          type: string
          description: UUID of the integration config to link this mapping to
          example: 00000000-0000-0000-0000-000000000000
      description: Request containing an External Mapping entity.
      allOf:
      - $ref: '#/components/schemas/AbstractRequest'
    PaginatedExternalMappingResponseData:
      type: object
      properties:
        data:
          type: array
          description: ''
          items:
            $ref: '#/components/schemas/ExternalMappingResponse'
        nextToken:
          type: string
          description: ''
      description: ''
    ExternalEntityResponse:
      type: object
      properties:
        externalId:
          type: string
          description: ''
        externalName:
          type: string
          description: ''
      description: Response containing an entity on an external system
    AbstractResponse:
      required:
      - id
      type: object
      properties:
        id:
          type: string
          description: 'The UUID of the entity. '
        version:
          type: integer
          description: 'The version number:

            - **Create:** On initial Create to insert a new entity, the version is set at 1 in the response.

            - **Update:** On successful Update, the version is incremented by 1 in the response.'
          format: int64
          x-stainless-terraform-configurability: computed
          x-stainless-terraform-always-send: true
      description: ''
    AbstractResponseWithAuditFields:
      type: object
      description: ''
      allOf:
      - $ref: '#/components/schemas/AbstractResponse'
      - type: object
        properties:
          dtCreated:
            type: string
            description: The DateTime when this item was created *(in ISO-8601 format)*.
            format: date-time
            x-stainless-skip: terraform
          dtLastModified:
            type: string
            description: The DateTime when this item was last modified *(in ISO-8601 format)*.
            format: date-time
            x-stainless-skip: terraform
          createdBy:
            type: string
            description: The ID of the user who created this item.
            x-stainless-skip: terraform
          lastModifiedBy:
            type: string
            description: The ID of the user who last modified this item.
            x-stainless-skip: terraform
  responses:
    Error:
      description: Error message
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
  securitySchemes:
    OAuth2:
      type: oauth2
      description: "m3ter supports machine to machine authentication using the `clientCredentials` OAuth2 flow.\n\nThe `authorizationCode` flow controls access for human users via the m3ter Console application. \n"
      flows:
        clientCredentials:
          tokenUrl: /oauth/token
          scopes:
            m3ter-resources/m3ter-scope: m3ter resources
        authorizationCode:
          authorizationUrl: https://m3ter.auth.us-east-1.amazoncognito.com/oauth2/authorize
          tokenUrl: https://m3ter.auth.us-east-1.amazoncognito.com/oauth2/token
          scopes:
            m3ter-resources/m3ter-scope: m3ter resources
            openid: OpenID
            email: email
