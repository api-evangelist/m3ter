info:
  title: m3ter Events API
  description: 'If you are using Postman, you can:

    - Use the **Download** button above to download the m3ter Open API spec JSON file and then import this file as the **m3ter API Collection** into your Workspace. See Importing the m3ter Open API in our main user Documentation for details. - Copy this link: m3ter-Template API Collection and use it to import the **m3ter-Template API Collection** into your Workspace. See Importing the m3ter Template API Collection in our main user Documentation for details. ---


    # Introduction

    The m3ter platform supports two HTTP-based REST APIs returning JSON encoded responses:

    - The **Ingest API**, which you can use for submitting raw data measurements. *(See the Submit Measurements endpoint in this API Reference.)*

    - The **Config API**, which you can use for configuration and management. *(All other endpoints in this API Reference.)*


    ## Authentication and Authorization

    Our APIs use an industry-standard authorization protocol known as the OAuth 2.0 specification. OAuth2 supports several grant types, each designed for a specific use case. m3ter uses the following two grant types:

    - **Authorization Code**: Used for human login access via the m3ter Console. - **Client Credentials**: Used for machine-to-machine communication and API access. Complete the following flow for API access:


    1. **Create a Service User and add Permissions**: Log in to the m3ter Console, go to **Settings**, **Access** then **Service Users** tab, and create a Service User. To enable API calls, grant the user **Administrator** permissions. 2. **Generate Access Keys**: In the Console, open the *Overview* page for the Service User by clicking on the name. Generate an **Access Key id** and **Api Secret**. Make sure you copy the **Api Secret** because it is only visible at the time of creation. See Service Authentication for detailed instructions and an example. 3. **Obtain a Bearer Token using Basic Auth**: We implement the OAuth 2.0 Client Credentials Grant authentication flow for Service User Authentication. Submit a request to the m3ter OAuth Client Credentials authentication flow, using your concatenated **Access Key id** and **Api Secret** to obtain a Bearer Token for your Service User. *See examples below.*


    4. **Bearer Token Usage**: Use the HTTP ''Authorization'' header with the bearer token to authorise all subsequent API requests. > Warning: The Bearer Token is valid for 18,000 seconds or 5 hours. When the token has expired, you must obtain a new one. Below are two examples for obtaining a Bearer Token using Basic Auth: the first in cURL and the second as a Python script. ### cURL Example

    1. Open your terminal or command prompt. 2. Use the following `cURL` command to obtain a Bearer Token:


    ```bash

    curl -X POST https://api.m3ter.com/oauth/token \

    -H ''Content-Type: application/x-www-form-urlencoded'' \

    -u your_access_key_id:your_api_secret \

    -d ''grant_type=client_credentials''

    ```


    Replace `your_access_key_id` and `your_api_secret` with your actual **Access Key id** and **Api Secret**. 3. Run the command, and if successful, it will return a JSON response containing the Bearer Token. The response will look like this:


    ```json

    {

    "access_token": "your_bearer_token",

    "token_type": "Bearer",

    "expires_in": 18000

    }

    ```


    You can then use the Bearer Token *(the value of `"access_token"`)* for subsequent API calls to m3ter. ### Python Example

    1. Install the `requests` library if you haven''t already:


    ```bash

    pip install requests

    ```


    2.'
  version: '1.0'
  x-logo:
    url: https://console.m3ter.com/m3ter-logo-black.svg
servers:
- url: https://api.m3ter.com
security:
- OAuth2: []
tags:
- name: Events
  description: 'This section provides Endpoints for operations that allow you to retrieve detailed information about individual Events, list all Events or specific Event Types, and explore dynamic fields available for each Event Type.


    Events encompass specific instances of state changes within the system, such as the creation of a new Prepayment/Commitment for an Account. Each Event is classified under an Event Type framework, providing context about what kind of change occurred to generate the Event.


    **Events for Configuration and Billing Entities**


    Many Event Types cover common configuration and billing objects, where the Event is generated for a state change of one of these objects - for when the configuration or billing object is **created**, **deleted**, or **updated**.


    For example:

    * configuration.commitment.created

    * configuration.commitment.deleted

    * configuration.commitment.updated

    * configuration.account.created

    * configuration.account.deleted

    * configuration.account.updated

    * billing.bill.created

    * billing.bill.deleted

    * billing.bill.created


    **Events for Errors or Failures**


    There are also Event Types for certain kinds of error that can occur:


    * For an Integration:

    * validation

    * authentication

    * perform

    * missing account mapping

    * disabled


    * For a Usage Data Ingest Submission:

    * validation failure


    * For Data Export Jobs:

    * data export job failure


    **Scheduled Events**


    In addition to system-generated Events that occur when a configuration entity undergoes a state change at creation, update, or deletion of the entity, you can use API calls to create and configure *Scheduled Event Configurations*. Scheduled Events are custom Event types, which you can set up by referencing Date/Time fields on configuration and billing entities. See the ScheduledEventConfigurations section of this API Reference for more details.


    **Notifications for Events**


    You can create Notification rules based on Events and these rules can reference and apply calculations to the Event''s fields. This allows you to set up customized alerts to be sent out via webhooks when the Event occurs and any conditions you''ve built into the Notification rule''s calculation are satisfied.


    See the Notifications section for more details.


    **Other Events**


    When Events occur, they can cause other Events, such as when a Notification is triggered by the Event it is based on. For these Events there are currently two categories:

    * Notification

    * IntegrationEvent


    Also see Utilizing Events and Notifications and Object Definitions and API Calls in the m3ter documentation for more guidance.'
paths:
  /organizations/{orgId}/events:
    get:
      tags:
      - Events
      summary: List EventResponse
      description: 'List all Events.


        Retrieve a list of all Events, with options to filter the returned list based on various criteria. Each Event represents a unique instance of a state change within the system, classified under a specific kind of Event.


        **NOTES:** You can:

        * Use `eventName` as a valid Query parameter to filter the list of Events returned. For example:

        `.../organizations/{orgId}/events?eventName=configuration.commitment.created`

        * Use the List Notification Events endpoint in this section. The response lists the valid Query parameters.'
      operationId: ListEvents
      parameters:
      - name: orgId
        in: path
        description: The unique identifier (UUID) of the Organization. The Organization represents your company as a direct customer of our service.
        required: true
        style: simple
        explode: false
        schema:
          type: string
      - name: pageSize
        in: query
        description: The maximum number of Events to retrieve per page.
        required: false
        allowEmptyValue: true
        style: form
        explode: true
        schema:
          maximum: 100
          minimum: 1
          type: integer
          format: int32
      - name: ids
        in: query
        description: "List of Event UUIDs to filter the results. \n\n**NOTE:** cannot be used with other filters."
        required: false
        allowEmptyValue: true
        style: form
        explode: true
        schema:
          type: array
          items:
            type: object
      - name: notificationId
        in: query
        description: Notification UUID to filter the results. Returns the Events that have triggered the Notification.
        required: false
        allowEmptyValue: true
        style: form
        explode: true
        schema:
          type: string
      - name: accountId
        in: query
        description: The Account ID associated with the Event to filter the results. Returns the Events that have been generated for the Account.
        required: false
        allowEmptyValue: true
        style: form
        explode: true
        schema:
          type: string
      - name: eventType
        in: query
        description: 'The category of Events to filter the results by. Options:

          * Notification

          * IntegrationEvent

          * IngestValidationFailure

          * DataExportJobFailure'
        required: false
        allowEmptyValue: true
        style: form
        explode: true
        schema:
          type: string
      - name: notificationCode
        in: query
        description: Short code of the Notification to filter the results. Returns the Events that have triggered the Notification.
        required: false
        allowEmptyValue: true
        style: form
        explode: true
        schema:
          type: string
      - name: includeActioned
        in: query
        description: 'A Boolean flag indicating whether to return Events that have been actioned.


          * **TRUE** - include actioned Events.

          * **FALSE** - exclude actioned Events. '
        required: false
        allowEmptyValue: true
        style: form
        explode: true
        schema:
          type: boolean
      - name: nextToken
        in: query
        description: The `nextToken` for multi-page retrievals. It is used to fetch the next page of Events in a paginated list.
        required: false
        allowEmptyValue: true
        style: form
        explode: true
        schema:
          type: string
      - name: eventName
        in: query
        description: ''
        required: false
        style: form
        explode: true
        schema:
          type:
          - string
          - 'null'
      - name: resourceId
        in: query
        description: ''
        required: false
        style: form
        explode: true
        schema:
          type:
          - string
          - 'null'
      responses:
        '200':
          description: Returns list of Events
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedEventResponseData'
        4XX:
          $ref: '#/components/responses/Error'
        5XX:
          $ref: '#/components/responses/Error'
  /organizations/{orgId}/events/fields:
    get:
      tags:
      - Events
      summary: List Event Fields
      description: 'List Event Fields.


        Retrieves a list of Fields for a specific Event Type. These Fields are dynamic and forward compatibile, enabling calculation operations on the Event schema.


        **Notes:**

        - In many of the Response schema for this call, such as when you retrieve the Fields for a `configuration.commitment.created` Event Type, `new` represents the attributes the newly created object has. The Response to a call to retrieve the Fields for a `configuration.commitment.updated` Event Type will contain Field values for both the `old` and `new` objects. The Response to a call to retrieve the Fields for a `configuration.commitment.deleted` Event Type will only contain `old` Fields, for values at point of deletion. Having access to reference both `new` and `old` Field values for an object can be very useful if you want to base a Notification rule on an Event and include a calculation in the rule that, for example, compares `new` values with `old` - for example, trigger a Notification only when a Commitment has been updated and the `new` value for the `amount` is at least $1,000 greater than the `old` value.

        - Some Event types will show `customFields` even though the specific billing or configuration object the Event is for does not yet have the custom fields functionality implemented. For these Events, their `customFields` values will not be populated until such time as the custom fields functionality is implemented for them'
      operationId: ListEventFields
      parameters:
      - name: orgId
        in: path
        description: The unique identifier (UUID) of your Organization. The Organization represents your company as a direct customer of our service.
        required: true
        style: simple
        explode: false
        schema:
          type: string
      - name: eventName
        in: query
        description: The name of the specific Event Type to use as a list filter, for example `configuration.commitment.created`.
        required: false
        allowEmptyValue: true
        style: form
        explode: true
        schema:
          type: string
      responses:
        '200':
          description: Returns the list of Fields for an Event Type
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventFieldsResponse'
        4XX:
          $ref: '#/components/responses/Error'
        5XX:
          $ref: '#/components/responses/Error'
  /organizations/{orgId}/events/types:
    get:
      tags:
      - Events
      summary: List Notification Events
      description: 'Retrieve a list of Notification Event Types.


        This endpoint retrieves a list of Event Types that can have Notification rules configured.'
      operationId: ListEventTypes
      parameters:
      - name: orgId
        in: path
        description: The unique identifer (UUID) of the Organization. The Organization represents your company as a direct customer of our service.
        required: true
        style: simple
        explode: false
        schema:
          type: string
      responses:
        '200':
          description: Returns the list of Event Types that can have Notification rules configured
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventTypeResponse'
        4XX:
          $ref: '#/components/responses/Error'
        5XX:
          $ref: '#/components/responses/Error'
  /organizations/{orgId}/events/{id}:
    get:
      tags:
      - Events
      summary: Retrieve EventResponse
      description: 'Retrieve a specific Event.


        Retrieves detailed information about the specific Event with the given UUID. An Event corresponds to a unique instance of a state change within the system, classified under a specific Event Type.'
      operationId: GetEvent
      parameters:
      - name: orgId
        in: path
        description: The unique identifier (UUID) of your Organization. The Organization represents your company as a direct customer of our service.
        required: true
        style: simple
        explode: false
        schema:
          type: string
      - name: id
        in: path
        description: The unique identifier (UUID) of the Event to retrieve.
        required: true
        style: simple
        explode: false
        schema:
          type: string
      responses:
        '200':
          description: Returns the Event
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventResponse'
        4XX:
          $ref: '#/components/responses/Error'
        5XX:
          $ref: '#/components/responses/Error'
components:
  schemas:
    EventFieldsResponse:
      type: object
      properties:
        events:
          type: object
          additionalProperties:
            type: object
            additionalProperties:
              type: string
          description: "An object containing the list of Fields for the queried Event Type. \n\nSee the 200 Response sample where we have queried to get the Fields for the `configuration.commitment.created` Event Type. \n\n**Note:** `new` represents the attributes the newly created object has."
      description: ''
      example:
        events:
          configuration.commitment.created:
            new.accountCode: string
            new.accountId: string
            new.accountingProductId: string
            new.amount: double
            new.amountFirstBill: double
            new.amountPrePaid: double
            new.amountSpent: double
            new.billEpoch: string
            new.billingInterval: int
            new.billingOffset: int
            new.billingPlanId: string
            new.commitmentFeeBillInAdvance: boolean
            new.commitmentFeeDescription: string
            new.commitmentUsageDescription: string
            new.contractId: string
            new.currency: string
            new.customFields: map
            new.endDate: string
            new.feeDates: array
            new.id: string
            new.overageDescription: string
            new.overageSurchargePercent: double
            new.productIds: array
            new.startDate: string
    EventTypeResponse:
      type: object
      properties:
        events:
