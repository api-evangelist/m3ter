  version: '1.0'
  x-logo:
    url: https://console.m3ter.com/m3ter-logo-black.svg
servers:
- url: https://api.m3ter.com
security:
- OAuth2: []
tags:
- name: BalanceChargeSchedule
  description: 'Endpoints for creating/updating/deleting BalanceChargeSchedules.


    **NOTE!** The BalanceChargeSchedule feature is available in Beta release version. See Feature Release Stages for Beta release definition.'
paths:
  /organizations/{orgId}/balances/{balanceId}/balancechargeschedules:
    get:
      tags:
      - BalanceChargeSchedule
      summary: List BalanceChargeSchedule
      description: Retrieve a list of BalanceChargeSchedule entities
      operationId: ListBalanceChargeSchedule
      parameters:
      - name: orgId
        in: path
        description: UUID of the organization
        required: true
        style: simple
        explode: false
        schema:
          type: string
      - name: balanceId
        in: path
        description: UUID of the balance
        required: true
        style: simple
        explode: false
        schema:
          type: string
      - name: pageSize
        in: query
        description: Number of BalanceChargeSchedules to retrieve per page
        required: false
        allowEmptyValue: true
        style: form
        explode: true
        schema:
          maximum: 200
          minimum: 1
          type: integer
          format: int32
      - name: nextToken
        in: query
        description: nextToken for multi page retrievals
        required: false
        allowEmptyValue: true
        style: form
        explode: true
        schema:
          type: string
      - name: ids
        in: query
        description: ''
        required: false
        style: form
        explode: true
        schema:
          maxItems: 200
          type:
          - array
          - 'null'
          items:
            type: string
      responses:
        '200':
          description: ListBalanceChargeSchedule 200 response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedBalanceChargeScheduleResponseData'
        4XX:
          $ref: '#/components/responses/Error'
        5XX:
          $ref: '#/components/responses/Error'
    post:
      tags:
      - BalanceChargeSchedule
      summary: Create BalanceChargeSchedule
      description: Create a new BalanceChargeSchedule.
      operationId: CreateBalanceChargeSchedule
      parameters:
      - name: orgId
        in: path
        description: UUID of the organization
        required: true
        style: simple
        explode: false
        schema:
          type: string
      - name: balanceId
        in: path
        description: UUID of the balance
        required: true
        style: simple
        explode: false
        schema:
          type: string
      requestBody:
        description: ''
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BalanceChargeScheduleRequest'
        required: true
      responses:
        '200':
          description: Return the created BalanceChargeSchedule
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BalanceChargeScheduleResponse'
        4XX:
          $ref: '#/components/responses/Error'
        5XX:
          $ref: '#/components/responses/Error'
  /organizations/{orgId}/balances/{balanceId}/balancechargeschedules/preview:
    post:
      tags:
      - BalanceChargeSchedule
      summary: Preview ScheduledBalanceCharges
      description: Previews the Charges this Schedule would create, without persisting them. You can use this call to obtain a preview of the Charges a Schedule you plan to create for a Balance would generate.
      operationId: PreviewScheduledCharge
      parameters:
      - name: orgId
        in: path
        description: UUID of the organization
        required: true
        style: simple
        explode: false
        schema:
          type: string
      - name: balanceId
        in: path
        description: UUID of the balance
        required: true
        style: simple
        explode: false
        schema:
          type: string
      - name: pageSize
        in: query
        description: Number of Charges to retrieve per page
        required: false
        allowEmptyValue: true
        style: form
        explode: true
        schema:
          maximum: 200
          minimum: 1
          type: integer
          format: int32
      - name: nextToken
        in: query
        description: nextToken for multi page retrievals
        required: false
        allowEmptyValue: true
        style: form
        explode: true
        schema:
          type: string
      requestBody:
        description: ''
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BalanceChargeScheduleRequest'
        required: true
      responses:
        '200':
          description: Return the list of BalanceCharges this request would create
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BalanceChargeScheduleResponse'
        4XX:
          $ref: '#/components/responses/Error'
        5XX:
          $ref: '#/components/responses/Error'
  /organizations/{orgId}/balances/{balanceId}/balancechargeschedules/{id}:
    get:
      tags:
      - BalanceChargeSchedule
      summary: Retrieve BalanceChargeSchedule
      description: Retrieve a BalanceChargeSchedule for the given UUID.
      operationId: GetBalanceChargeSchedule
      parameters:
      - name: orgId
        in: path
        description: UUID of the organization
        required: true
