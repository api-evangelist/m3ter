      responses:
        '200':
          description: Return the updated BalanceChargeSchedule
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BalanceChargeScheduleResponse'
        4XX:
          $ref: '#/components/responses/Error'
        5XX:
          $ref: '#/components/responses/Error'
