info:
  title: m3ter Account Plan API
  description: 'If you are using Postman, you can:

    - Use the **Download** button above to download the m3ter Open API spec JSON file and then import this file as the **m3ter API Collection** into your Workspace. See Importing the m3ter Open API in our main user Documentation for details. - Copy this link: m3ter-Template API Collection and use it to import the **m3ter-Template API Collection** into your Workspace. See Importing the m3ter Template API Collection in our main user Documentation for details. ---


    # Introduction

    The m3ter platform supports two HTTP-based REST APIs returning JSON encoded responses:

    - The **Ingest API**, which you can use for submitting raw data measurements. *(See the Submit Measurements endpoint in this API Reference.)*

    - The **Config API**, which you can use for configuration and management. *(All other endpoints in this API Reference.)*


    ## Authentication and Authorization

    Our APIs use an industry-standard authorization protocol known as the OAuth 2.0 specification. OAuth2 supports several grant types, each designed for a specific use case. m3ter uses the following two grant types:

    - **Authorization Code**: Used for human login access via the m3ter Console. - **Client Credentials**: Used for machine-to-machine communication and API access. Complete the following flow for API access:


    1. **Create a Service User and add Permissions**: Log in to the m3ter Console, go to **Settings**, **Access** then **Service Users** tab, and create a Service User. To enable API calls, grant the user **Administrator** permissions. 2. **Generate Access Keys**: In the Console, open the *Overview* page for the Service User by clicking on the name. Generate an **Access Key id** and **Api Secret**. Make sure you copy the **Api Secret** because it is only visible at the time of creation. See Service Authentication for detailed instructions and an example. 3. **Obtain a Bearer Token using Basic Auth**: We implement the OAuth 2.0 Client Credentials Grant authentication flow for Service User Authentication. Submit a request to the m3ter OAuth Client Credentials authentication flow, using your concatenated **Access Key id** and **Api Secret** to obtain a Bearer Token for your Service User. *See examples below.*


    4. **Bearer Token Usage**: Use the HTTP ''Authorization'' header with the bearer token to authorise all subsequent API requests. > Warning: The Bearer Token is valid for 18,000 seconds or 5 hours. When the token has expired, you must obtain a new one. Below are two examples for obtaining a Bearer Token using Basic Auth: the first in cURL and the second as a Python script. ### cURL Example

    1. Open your terminal or command prompt. 2. Use the following `cURL` command to obtain a Bearer Token:


    ```bash

    curl -X POST https://api.m3ter.com/oauth/token \

    -H ''Content-Type: application/x-www-form-urlencoded'' \

    -u your_access_key_id:your_api_secret \

    -d ''grant_type=client_credentials''

    ```


    Replace `your_access_key_id` and `your_api_secret` with your actual **Access Key id** and **Api Secret**. 3. Run the command, and if successful, it will return a JSON response containing the Bearer Token. The response will look like this:


    ```json

    {

    "access_token": "your_bearer_token",

    "token_type": "Bearer",

    "expires_in": 18000

    }

    ```


    You can then use the Bearer Token *(the value of `"access_token"`)* for subsequent API calls to m3ter. ### Python Example

    1. Install the `requests` library if you haven''t already:


    ```bash

    pip install requests

    ```


    2.'
  version: '1.0'
  x-logo:
    url: https://console.m3ter.com/m3ter-logo-black.svg
servers:
- url: https://api.m3ter.com
security:
- OAuth2: []
tags:
- name: AccountPlan
  description: 'Endpoints for AccountPlan and AccountPlanGroup related operations such as creation, update, list and delete.


    **AccountPlans**

    An Account represents one of your end-customer accounts. To create an AccountPlan, you attach a Product Plan to an Account. The AccountPlan then determines the charges incurred at billing by your end customer for consuming the Product the Plan is for:

    * **AccountPlan Active/Inactive**. Set start and end dates to define the period the AccountPlan is active for the Account.

    * **AccountPlan per Product**. If an end customer consumes multiple Products, create separate AccountPlans to charge for each Product.


    **AccountPlan - Notes and Constraints:**

    * **Multiple AccountPlans:** The default Organization setting imposes the constraint that only one AccountPlan per Product can be active at any one time for an Account.

    * **Overlapping Plans:** If your billing use case requires you to attach more than one Plan to an Account for the same Product at the same time, then you must first enable the **Allow overlapping attached plans** setting for your Organization.

    * If you create a Plan as a custom Plan for a specific Account, you can only use it to create an AccountPlan for that Account.


    **AccountPlanGroups**

    Plan Groups are used when you want to apply a minimum spend amount at billing across several of your Products each of which are priced separately - when you create the Plan Group, you define an overall minimum spend and then add any priced Plans you want to include in the Group. To create an AccounPlanGroup, you can attach a Plan Group to an Account that consumes the separate Products which are priced using the included Plans. At billing, the minimum spend you''ve defined for the Plan Group is applied:

    * **Active AccountPlanGroup**. Set the start and end dates to define the period for which the Plan Group will be active for the Account.


    **Plan Group Notes:**

    * You can only add *one Plan for the same Product* to a Plan Group. See the Plan Group in this API Reference for more details on creating Plan Groups.

    * You can create a *custom Plan Group* for an Account, which means the Plan Group can only be attached to that Account to create an AccountPlanGroup.


    **AcountPlanGroup - Notes and Constraints:**

    * **AccountPlanGroup is type of AccountPlan** When you attach a Plan Group to an Account, this creates an AccountPlanGroup. However, the m3ter data model *does not support a separate AccountPlanGroup entity*, and an AccountPlanGroup is a type of AccountPlan where a `planGroupId` is used instead of a `planId` when it''s created. See the Create AccountPlan call in this section and Attaching Plan Groups to an Account in our main User Documentation.

    * **Multiple AccountPlan Groups:** You can attach more than one Plan Group to an Account to create multiple AccountPlanGroups, but the default Organization setting preserves the rule that *only one attached Plan per Product can be active at any one time for an Account* is preserved:

    * Multiple attached Plan Groups on an Account can have overlapping dates only if none of the Plan Groups contain a Plan belonging to the same Product. If you try to attach a Plan Group to an Account with Plan Groups already attached and:

    * The new Plan Group contains a Product Plan that also belongs to a Plan Group already attached to the Account.

    * The dates for these "matched Plan" Plan Groups being active for the Account would overlap.

    * Then you''ll receive an error and the attachment will be blocked.

    * **Overlapping Plans in Plan Groups:** If your billing use case requires you to attach more than one Plan Group to an Account and containing Plans for the same Product at the same time, then you must first enable the **Allow overlapping attached plans** setting for your Organization.'
paths:
  /organizations/{orgId}/accountplans:
    get:
      tags:
      - AccountPlan
      summary: List AccountPlans
      description: Retrieves a list of AccountPlan and AccountPlanGroup entities for the specified Organization. The list can be paginated for easier management, and supports filtering with various query parameters.
      operationId: ListAccountPlans
      parameters:
      - name: orgId
        in: path
        description: The unique identifier (UUID) of your Organization. The Organization represents your company as a direct customer of our service.
        required: true
        style: simple
        explode: false
        schema:
          type: string
      - name: pageSize
        in: query
        description: The maximum number of AccountPlans and AccountPlanGroups to return per page.
        required: false
        allowEmptyValue: true
        style: form
        explode: true
        schema:
          maximum: 100
          minimum: 1
          type: integer
          format: int32
      - name: nextToken
        in: query
        description: The `nextToken` for retrieving the next page of AccountPlans and AccountPlanGroups. It is used to fetch the next page of AccountPlans and AccountPlanGroups in a paginated list.
        required: false
        allowEmptyValue: true
        style: form
        explode: true
        schema:
          type: string
      - name: date
        in: query
        description: 'The specific date/time *(in ISO-8601 format)* for which you want to retrieve AccountPlans and AccountPlanGroups.


          **NOTE:** Returns both active and inactive AccountPlans and AccountPlanGroups for the specified date/time.'
        required: false
        allowEmptyValue: true
        style: form
        explode: true
        schema:
          type: string
      - name: account
        in: query
        description: 'The unique identifier (UUID) for the Account whose AccountPlans and AccountPlanGroups you want to retrieve.


          **NOTE:** Only returns the currently active AccountPlans and AccountPlanGroups for the specified Account. Use in combination with the `includeall` query parameter to return both active and inactive.'
        required: false
        allowEmptyValue: true
        style: form
        explode: true
        schema:
          type: string
      - name: plan
        in: query
        description: 'The unique identifier (UUID) for the Plan whose associated AccountPlans you want to retrieve.


          **NOTE:** Does not return AccountPlanGroups if you use a `planGroupId`.'
        required: false
        allowEmptyValue: true
        style: form
        explode: true
        schema:
          type: string
      - name: product
        in: query
        description: 'The unique identifier (UUID) for the Product whose associated AccountPlans you want to retrieve.


          **NOTE:** You cannot use the `product` query parameter as a single filter condition, but must always use it in combination with the `account` query parameter.'
        required: false
        allowEmptyValue: true
        style: form
        explode: true
        schema:
          type: string
      - name: includeall
        in: query
        description: 'A Boolean flag that specifies whether to include both active and inactive AccountPlans and AccountPlanGroups in the list.


          * **TRUE** - both active and inactive AccountPlans and AccountPlanGroups are included in the list.

          * **FALSE** - only active AccountPlans and AccountPlanGroups are retrieved in the list.*(Default)*


          **NOTE:** Only operative if you also have one of `account`, `plan` or `contract` as a query parameter.'
        required: false
        allowEmptyValue: true
        style: form
        explode: true
        schema:
          type: boolean
      - name: ids
        in: query
        description: A list of unique identifiers (UUIDs) for specific AccountPlans and AccountPlanGroups you want to retrieve.
        required: false
        allowEmptyValue: true
        style: form
        explode: true
        schema:
          type: array
          items:
            type: string
      - name: contract
        in: query
        description: 'The unique identifier (UUID) of the Contract which the AccountPlans you want to retrieve have been linked to.


          **NOTE:** Does not return AccountPlanGroups that have been linked to the Contract.'
        required: false
        style: form
        explode: true
        schema:
          type:
          - string
          - 'null'
      responses:
        '200':
          description: Returns the list of AccountPlans and AccountPlanGroups
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAccountPlanResponseData'
        4XX:
          $ref: '#/components/responses/Error'
        5XX:
          $ref: '#/components/responses/Error'
    post:
      tags:
      - AccountPlan
      summary: Create AccountPlan
      description: 'Create a new AccountPlan or AccountPlanGroup.


        This endpoint creates a new AccountPlan or AccountPlanGroup for a specific Account in your Organization. The details of the new AccountPlan or AccountPlanGroup should be supplied in the request body.


        **Note:** You cannot use this call to create *both* an AccountPlan and AccountPlanGroup for an Account at the same time. If you want to create both for an Account, you must submit two separate calls.'
      operationId: PostAccountPlan
      parameters:
      - name: orgId
        in: path
        description: The unique identifier (UUID) for your Organization. The Organization represents your company as a direct customer of our service.
        required: true
        style: simple
        explode: false
        schema:
          type: string
      requestBody:
        description: ''
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountPlanRequest'
        required: true
      responses:
        '200':
          description: Returns the created AccountPlan or AccountPlanGroup
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountPlanResponse'
        4XX:
          $ref: '#/components/responses/Error'
        5XX:
          $ref: '#/components/responses/Error'
  /organizations/{orgId}/accountplans/{id}:
    get:
      tags:
      - AccountPlan
      summary: Retrieve AccountPlan
      description: Retrieve the AccountPlan or AccountPlanGroup details corresponding to the given UUID.
      operationId: GetAccountPlan
      parameters:
      - name: orgId
        in: path
        description: The unique identifier (UUID) for your Organization. The Organization represents your company as a direct customer of our service.
        required: true
        style: simple
        explode: false
        schema:
          type: string
      - name: id
        in: path
        description: The unique identifier (UUID) of the AccountPlan or AccountPlanGroup to retrieve.
        required: true
        style: simple
        explode: false
        schema:
          type: string
      responses:
        '200':
          description: Returns the AccountPlan or AccountPlanGroup
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountPlanResponse'
        4XX:
          $ref: '#/components/responses/Error'
        5XX:
          $ref: '#/components/responses/Error'
    put:
      tags:
      - AccountPlan
      summary: Update AccountPlan
      description: 'Update the AccountPlan or AccountPlanGroup with the given UUID.


        This endpoint updates a new AccountPlan or AccountPlanGroup for a specific Account in your Organization. The updated information should be provided in the request body.


        **Notes:**

        * You cannot use this call to update *both* an AccountPlan and AccountPlanGroup for an Account at the same time. If you want to update an AccounPlan and an AccountPlanGroup attached to an Account, you must submit two separate calls.

        * If you have created Custom Fields for an AccountPlan, when you use this endpoint to update the AccountPlan use the `customFields` parameter to preserve those Custom Fields. If you omit them from the update request, they will be lost.'
      operationId: PutAccountPlan
      parameters:
      - name: orgId
        in: path
        description: The unique identifier (UUID) for your Organization. The Organization represents your company as a direct customer of our service.
        required: true
        style: simple
        explode: false
        schema:
          type: string
      - name: id
        in: path
        description: The unique identifier (UUID) of the AccountPlan or AccountPlanGroup to update.
        required: true
        style: simple
        explode: false
        schema:
          type: string
      requestBody:
        description: ''
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountPlanRequest'
        required: true
      responses:
        '200':
          description: Returns the updated AccountPlan or AccountPlanGroup.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountPlanResponse'
        4XX:
          $ref: '#/components/responses/Error'
        5XX:
          $ref: '#/components/responses/Error'
    delete:
      tags:
      - AccountPlan
      summary: Delete AccountPlan
      description: 'Delete the AccountPlan or AccountPlanGroup with the given UUID.


        This endpoint deletes an AccountPlan or AccountPlanGroup that has been attached to a specific Account in your Organization.'
      operationId: DeleteAccountPlan
      parameters:
      - name: orgId
        in: path
        description: The unique identifier (UUID) of your Organization. The Organization represents your company as a direct customer of our service.
        required: true
        style: simple
        explode: false
        schema:
          type: string
      - name: id
        in: path
        description: The unique identifer (UUID) of the AccountPlan or AccountPlanGroup to delete.
        required: true
        style: simple
        explode: false
        schema:
          type: string
      responses:
        '200':
          description: Returns the deleted AccountPlan or AccountPlanGroup
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountPlanResponse'
        4XX:
          $ref: '#/components/responses/Error'
        5XX:
          $ref: '#/components/responses/Error'
  /organizations/{orgId}/accountplans/{id}/replace:
    post:
      tags:
      - AccountPlan
      summary: Replace AccountPlan
      description: End-dates the specified AccountPlan at the new startDate and creates the new AccountPlan.
      operationId: ReplaceAccountPlan
      parameters:
      - name: orgId
        in: path
        description: UUID of the organization
        required: true
        style: simple
        explode: false
        schema:
          type: string
      - name: id
        in: path
        description: The UUID of the AccountPlan to replace.
        required: true
        style: simple
        explode: false
        schema:
          type: string
      requestBody:
        description: ''
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountPlanRequest'
        required: true
      responses:
        '200':
          description: Return the updated existing AccountPlan and the created AccountPlan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReplaceAccountPlanResponse'
        4XX:
          $ref: '#/components/responses/Error'
        5XX:
          $ref: '#/components/responses/Error'
components:
  schemas:
    PaginatedAccountPlanResponseData:
      type: object
      properties:
        data:
          type: array
          description: ''
          items:
            $ref: '#/components/schemas/AccountPlanResponse'
        nextToken:
          type: string
          description: ''
      description: ''
    AbstractRequest:
      type: object
      properties:
        version:
          type: integer
          description: 'The version number of the entity:

            - **Create entity:** Not valid for initial insertion of new entity - *do not use for Create*. On initial Create, version is set at 1 and listed in the response.

            - **Update Entity:**  On Update, version is required and must match the existing version because a check is performed to ensure sequential versioning is preserved. Version is incremented by 1 and listed in the response.'
          format: int64
          x-stainless-terraform-configurability: computed
          x-stainless-terraform-always-send: true
      description: ''
    ReplaceAccountPlanResponse:
      type: object
      properties:
        originalAccountPlan:
          description: ''
          $ref: '#/components/schemas/AccountPlanResponse'
        newAccountPlan:
          description: ''
          $ref: '#/components/schemas/AccountPlanResponse'
      description: ''
    AbstractResponseWithCustomFields:
      type: object
      description: ''
      allOf:
      - $ref: '#/components/schemas/AbstractResponse'
      - type: object
        properties:
          customFields:
            type: object
            additionalProperties: true
            description: 'User defined fields enabling you to attach custom data. The value for a custom field can be either a string or a number.


              If `customFields` can also be defined for this entity at the Organizational level,`customField` values defined at individual level override values of `customFields` with the same name defined at Organization level.


              See [Working with Custom Fields](https://www.m3ter.com/docs/guides/creating-and-managing-products/working-with-custom-fields) in the m3ter documentation for more information.'
    AccountPlanResponse:
      type: object
      description: ''
      allOf:
      - $ref: '#/components/schemas/AbstractResponseWithCustomFields'
      - $ref: '#/components/schemas/AbstractResponse'
      - type: object
        properties:
          accountId:
            type: string
            description: The unique identifier (UUID) for the Account to which the AccountPlan or AccounPlanGroup is attached.
          productId:
            type: string
            description: 'The unique identifier (UUID) for the Product associated with the AccountPlan.


              **Note:** Not present in response for AccountPlanGroup - Plan Groups can contain multiple Plans belonging to different Products.'
          planId:
            type: string
            description: The unique identifier (UUID) of the Plan that has been attached to the Account to create the AccountPlan.
          planGroupId:
            type: string
            description: The unique identifier (UUID) of the Plan Group that has been attached to the Account to create the AccountPlanGroup.
          startDate:
            type: string
            description: The start date *(in ISO-8601 format)* for the when the AccountPlan or AccountPlanGroup starts to be active for the Account.
            format: date-time
          endDate:
            type: string
            description: The end date *(in ISO-8601 format)* for when the AccountPlan or AccountPlanGroup ceases to be active for the Account. If not specified, the AccountPlan or AccountPlanGroup remains active indefinitely.
            format: date-time
          code:
            type: string
            description: 'The unique short code of the AccountPlan or AccountPlanGroup. '
          billEpoch:
            type: string
            description: The initial date for creating the first bill against the Account for charges due under the AccountPlan or AccountPlanGroup. All subsequent bill creation dates are calculated from this date. If left empty, the first bill date definedfor the Account is used. The date is in ISO-8601 format.
            format: date
          contractId:
            type: string
            description: The unique identifier (UUID) for the Contract to which the Plan or Plan Group  attached to the Account has been added.
          childBillingMode:
            description: 'If the Account is either a Parent or a Child Account, this specifies the Account hierarchy billing mode. The mode determines how billing will be handled and shown on bills for charges due on the Parent Account, and charges due on Child Accounts:


              * **Parent Breakdown** - a separate bill line item per Account. Default setting.


              * **Parent Summary** - single bill line item for all Accounts.


              * **Child** - the Child Account is billed.'
            $ref: '#/components/schemas/ChildBillingMode'
          dtCreated:
            type: string
            description: The date and time *(in ISO 8601 format)* when the AccountPlan or AccountPlanGroup was first created.
            format: date-time
          dtLastModified:
            type: string
            description: The date and time *(in ISO 8601 format)* when the AccountPlan or AccountPlanGroup was last modified.
            format: date-time
          createdBy:
            type: string
            description: The unique identifier (UUID) for the user who created the AccountPlan or AccountPlanGroup.
          lastModifiedBy:
            type: string
            description: The unique identifier (UUID) for the user who last modified the AccountPlan or AccountPlanGroup.
    AbstractResponse:
      required:
      - id
      type: object
      properties:
        id:
          type: string
          description: 'The UUID of the entity. '
        version:
          type: integer
          description: 'The version number:

            - **Create:** On initial Create to insert a new entity, the version is set at 1 in the response.

            - **Update:** On successful Update, the version is incremented by 1 in the response.'
          format: int64
          x-stainless-terraform-configurability: computed
          x-stainless-terraform-always-send: true
      description: ''
    ChildBillingMode:
      type: string
      description: 'If the Account is either a Parent or a Child Account, this specifies the Account hierarchy billing mode. The mode determines how billing will be handled and shown on bills for charges due on the Parent Account, and charges due on Child Accounts:


        * **Parent Breakdown** - a separate bill line item per Account. Default setting.


        * **Parent Summary** - single bill line item for all Accounts.


        * **Child** - the Child Account is billed.'
      enum:
      - PARENT_SUMMARY
      - PARENT_BREAKDOWN
      - CHILD
    AccountPlanRequest:
      type: object
      description: ''
      allOf:
      - $ref: '#/components/schemas/AbstractRequestWithCustomFields'
      - $ref: '#/components/schemas/AbstractRequest'
      - required:
        - accountId
        - startDate
        type: object
        properties:
          accountId:
            maxLength: 36
            minLength: 36
            type: string
            description: The unique identifier (UUID) for the Account.
          planId:
            maxLength: 36
            minLength: 36
            type: string
            description: 'The unique identifier (UUID) of the Plan to be attached to the Account to create an AccountPlan.


              **Note:** Exclusive of the `planGroupId` request parameter - exactly one of `planId` or `planGroupId` must be used per call.'
          planGroupId:
            maxLength: 36
            minLength: 36
            type: string
            description: 'The unique identifier (UUID) of the PlanGroup to be attached to the Account to create an AccountPlanGroup.


              **Note:** Exclusive of the `planId` request parameter - exactly one of `planId` or `planGroupId` must be used per call.'
          startDate:
            type: string
            description: The start date *(in ISO-8601 format)* for the AccountPlan or AccountPlanGroup becoming active for the Account.
            format: date-time
          endDate:
            type: string
            description: The end date *(in ISO-8601 format)* for when the AccountPlan or AccountPlanGroup ceases to be active for the Account. If not specified, the AccountPlan or AccountPlanGroup remains active indefinitely.
            format: date-time
          code:
            maxLength: 80
            pattern: ^([^[\p{Cntrl}\s]])|([^[\p{Cntrl}\s]][[^[\p{Cntrl}\s]] ]*[^[\p{Cntrl}\s]])$
            type: string
            description: A unique short code for the AccountPlan or AccountPlanGroup.
          billEpoch:
            type: string
            description: 'Optional setting to define a *billing cycle date*, which acts as a reference for when in the applied billing frequency period bills are created:

              * For example, if you attach a Plan to an Account where the Plan is configured for monthly billing frequency and you''ve defined the period the Plan will apply to the Account to be from January 1st, 2022 until January 1st, 2023. You then set a `billEpoch` date of February 15th, 2022. The first Bill will be created for the Account on February 15th, and subsequent Bills created on the 15th of the months following for the remainder of the billing period - March 15th, April 15th, and so on.

              * If not defined, then the `billEpoch` date set for the Account will be used instead.

              * The date is in ISO-8601 format.'
            format: date
          contractId:
            maxLength: 36
            minLength: 36
            type: string
            description: The unique identifier (UUID) for a Contract to which you want to add the Plan or Plan Group being attached to the Account.
          childBillingMode:
            description: 'If the Account is either a Parent or a Child Account, this specifies the Account hierarchy billing mode. The mode determines how billing will be handled and shown on bills for charges due on the Parent Account, and charges due on Child Accounts:


              * **Parent Breakdown** - a separate bill line item per Account. Default setting.


              * **Parent Summary** - single bill line item for all Accounts.


              * **Child** - the Child Account is billed.'
            $ref: '#/components/schemas/ChildBillingMode'
    AbstractRequestWithCustomFields:
      type: object
      description: ''
      allOf:
      - $ref: '#/components/schemas/AbstractRequest'
      - type: object
        properties:
          customFields:
            type: object
            description: 'User defined fields enabling you to attach custom data. The value for a custom field can be either a string or a number.


              If `customFields` can also be defined for this entity at the Organizational level, `customField` values defined at individual level override values of `customFields` with the same name defined at Organization level.


              See [Working with Custom Fields](https://www.m3ter.com/docs/guides/creating-and-managing-products/working-with-custom-fields) in the m3ter documentation for more information.'
            allOf:
            - type: object
              additionalProperties: true
            - maxItems: 100
              type: object
  responses:
    Error:
      description: Error message
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
  securitySchemes:
    OAuth2:
      type: oauth2
      description: "m3ter supports machine to machine authentication using the `clientCredentials` OAuth2 flow.\n\nThe `authorizationCode` flow controls access for human users via the m3ter Console application. \n"
      flows:
        clientCredentials:
          tokenUrl: /oauth/token
          scopes:
            m3ter-resources/m3ter-scope: m3ter resources
        authorizationCode:
          authorizationUrl: https://m3ter.auth.us-east-1.amazoncognito.com/oauth2/authorize
          tokenUrl: https://m3ter.auth.us-east-1.amazoncognito.com/oauth2/token
          scopes:
            m3ter-resources/m3ter-scope: m3ter resources
            openid: OpenID
            email: email
