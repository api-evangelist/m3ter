  /organizations/{orgId}/bills/billingperiod/{lastDateInBillingPeriod}/{billingFrequency}:
    get:
      tags:
      - Bill
      summary: Retrieve Bills in Billing Period
      description: 'Retrieve all Bills within a specified billing period. This endpoint allows you to retrieve Bills on various frequencies, such as daily, weekly, monthly, or annually. Specify the last day of the period to define the range.


        For example, to retrieve all Bills on monthly billing up to September with due date of 1st of month, use the last day of September, which is September 30th.


        The list can also be paginated for easier management.'
      operationId: GetAllBillsInBillingPeriod
      parameters:
      - name: orgId
        in: path
        description: The unique identifier (UUID) of your Organization. The Organization represents your company as a direct customer of our service.
        required: true
        style: simple
        explode: false
        schema:
          type: string
          deprecated: true
          x-stainless-deprecation-message: the org id should be set at the client level instead
      - name: pageSize
        in: query
        description: Specifies the maximum number of Bills to retrieve per page.
        required: false
        allowEmptyValue: true
        style: form
        explode: true
        schema:
          maximum: 100
          minimum: 1
          type: integer
          format: int32
      - name: nextToken
        in: query
        description: The `nextToken` for multi-page retrievals. It is used to fetch the next page of Bills in a paginated list.
        required: false
        allowEmptyValue: true
        style: form
        explode: true
        schema:
          type: string
      - name: lastDateInBillingPeriod
        in: path
        description: The last date of the billing period for which you want to retrieve Bills. This date defines the range of Bills to be retrieved.
        required: true
        style: simple
        explode: false
        schema:
          type: string
      - name: billingFrequency
        in: path
        description: The billing frequency for the specified period. Valid options are daily, weekly, monthly, or annually.
        required: true
        style: simple
        explode: false
        schema:
          type: string
      - name: additional
        in: query
        description: Comma separated list of additional fields.
        required: false
        allowEmptyValue: true
        style: form
        explode: true
        schema:
          type: array
          items:
            type: string
      responses:
        '200':
          description: Returns the list of Bills within the billing period
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedBillResponseData'
        4XX:
          $ref: '#/components/responses/Error'
        5XX:
          $ref: '#/components/responses/Error'
  /organizations/{orgId}/bills/download/csv/url:
    post:
      tags:
      - Bill
      summary: Download Bills URL
      description: 'Generate a URL for downloading a CSV file containing a comprehensive list of Bills data for the specified organization for a specified period. This endpoint facilitates easy exporting of billing data for external analysis and reporting.


        The response to this call returns a pre-signed `downloadUrl`, which you then enter into your browser to download the CSV file of the Bill entities.


        You can use the `externalSystem` request parameter to control the format of the Bills data in the CSV file:

        - **STANDARD** A wider range of Bills data columns is given.

        - **XERO** A more limited range of data columns is given and compatible with loading into your 3rd-party Xero system.


        **NOTES:**

        - **Download Limits**. You can only download Bills for a period of up to 31 days or up to a maximum of 5000 Bills. If you attempt a download that exceeds either of these two limits, you''ll receive an error message

        - **Empty Bills**. The CSV formatted file is compiled for download by taking each of the line items found in Bills that exist in your Organization for the specified period. The Bill for each line item record is given, along with Bill Total and other billing attributes. However, this means that if you have an *empty Bill* that exists for the specified period - one for which *no line items currently exist* - then no line item records will be shown for this Bill in the CSV file you download.'
      operationId: DownloadBillsCsvUrl
      parameters:
      - name: orgId
        in: path
        description: The unique identifier (UUID) of your Organization. The Organization represents your company as a direct customer of our service.
        required: true
        style: simple
        explode: false
        schema:
          type: string
          deprecated: true
          x-stainless-deprecation-message: the org id should be set at the client level instead
      requestBody:
        description: ''
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DownloadCsvRequest'
        required: true
      responses:
        '200':
          description: Returns the download URL
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ObjectUrlResponse'
        4XX:
          $ref: '#/components/responses/Error'
        5XX:
          $ref: '#/components/responses/Error'
  /organizations/{orgId}/bills/search:
    get:
      tags:
      - Bill
      summary: Search Bills
      description: 'Search for Bill entities.


        This endpoint executes a search query for Bills based on the user specified search criteria. The search query is customizable, allowing for complex nested conditions and sorting. The returned list of Bills can be paginated for easier management.'
      operationId: SearchBills
      parameters:
      - name: orgId
        in: path
        description: The unique identifier (UUID) of your Organization. The Organization represents your company as a direct customer of our service.
        required: true
        style: simple
        explode: false
        schema:
          type: string
          deprecated: true
          x-stainless-deprecation-message: the org id should be set at the client level instead
      - name: searchQuery
        in: query
        description: "Query for data using special syntax:\n- Query parameters should be delimited using $ (dollar sign).\n- Allowed comparators are:\n\t- (greater than) >\n\t- (greater than or equal to) >=\n\t- (equal to) : \n\t- (less than) < \n\t- (less than or equal to) <= \n\t- (match phrase/prefix) ~ \n-  Allowed parameters: accountId, locked, billDate, startDate, endDate, dueDate, billingFrequency, id, createdBy, dtCreated, lastModifiedBy, ids.\n-  Query example:\n\t-  searchQuery=startDate>2023-01-01$accountId:62eaad67-5790-407e-b853-881564f0e543.\n\t-  This query is translated into: find Bills that startDate is older than 2023-01-01 AND accountId is equal to 62eaad67-5790-407e-b853-881564f0e543.\n\n**Note:** Using the ~ match phrase/prefix comparator. For best results, we recommend treating this as a \"starts with\" comparator for your search query."
        required: false
        allowEmptyValue: true
        style: form
        explode: true
        schema:
          type: string
      - name: fromDocument
        in: query
        description: '`fromDocument` for multi page retrievals.'
        required: false
        allowEmptyValue: true
        style: form
        explode: true
        schema:
          type: integer
          format: int32
      - name: pageSize
        in: query
        description: 'Number of Bills to retrieve per page.


          **NOTE:** If not defined, default is 10.'
        required: false
        allowEmptyValue: true
        style: form
        explode: true
        schema:
          maximum: 100
          minimum: 1
          type: integer
          format: int32
      - name: operator
        in: query
        description: Search Operator to be used while querying search.
        required: false
        allowEmptyValue: true
        style: form
        explode: true
        schema:
          type: string
          enum:
          - AND
          - OR
      - name: sortBy
        in: query
        description: Name of the parameter on which sorting is performed. Use any field available on the Bill entity to sort by, such as `accountId`, `endDate`, and so on.
        required: false
        allowEmptyValue: true
        style: form
        explode: true
        schema:
          type: string
      - name: sortOrder
        in: query
        description: Sorting order.
        required: false
        allowEmptyValue: true
        style: form
        explode: true
        schema:
          type: string
          enum:
          - ASC
          - DESC
      responses:
        '200':
          description: Returns the Bills matching the search criteria
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedBillResponseData'
        4XX:
          $ref: '#/components/responses/Error'
        5XX:
          $ref: '#/components/responses/Error'
components:
  schemas:
    BillResponse:
      type: object
      properties:
        lineItems:
          type: array
          description: An array of the Bill line items.
          items:
            $ref: '#/components/schemas/BillLineItem'
        purchaseOrderNumber:
          type: string
          description: Purchase Order number linked to the Account the Bill is for.
        externalInvoiceReference:
          type: string
          description: 'The reference ID to use for external invoice. '
        externalInvoiceDate:
          type: string
          description: 'For accounting purposes, the date set at Organization level to use for external invoicing with respect to billing periods - two options:

            * `FIRST_DAY_OF_NEXT_PERIOD` *(Default)*.

            * `LAST_DAY_OF_ARREARS`


            For example, if the retrieved Bill was on a monthly billing frequency and the billing period for the Bill is September 2023 and the *External invoice date* is set at `FIRST_DAY_OF_NEXT_PERIOD`, then the `externalInvoiceDate` will be `"2023-10-01"`.


            **NOTE:** To change the `externalInvoiceDate` setting for your Organization, you can use the [Update OrganizationConfig](https://www.m3ter.com/docs/api#tag/OrganizationConfig/operation/GetOrganizationConfig) call.'
          format: date
        jsonStatementGenerated:
          type: boolean
          description: 'Flag to indicate that the statement in JSON format has been generated for the Bill.


            * **TRUE** - JSON statement has been generated.

            * **FALSE** - no JSON statement generated.'
        csvStatementGenerated:
          type: boolean
          description: 'Flag to indicate that the statement in CSV format has been generated for the Bill.


            * **TRUE** - CSV statement has been generated.

            * **FALSE** - no CSV statement generated.'
        statementStale:
          type: boolean
          description: True if the existing bill statement (JSON or CSV) is marked as stale/outdated.
        billTotal:
          type: number
          description: 'The sum total for the Bill. '
        sequentialInvoiceNumber:
          type: string
          description: 'The sequential invoice number of the Bill.


            **NOTE:** If you have not defined a `billPrefix` for your Organization, a `sequentialInvoiceNumber` is not returned in the response. See [Update OrganizationConfig](https://www.m3ter.com/docs/api#tag/OrganizationConfig/operation/UpdateOrganizationConfig)

            '
        dtCreated:
          type: string
          description: The date and time *(in ISO 8601 format)* when the Bill was first created.
          format: date-time
          x-stainless-skip:
          - terraform
        dtLastModified:
          type: string
          description: The date and time *(in ISO 8601 format)* when the Bill was last modified.
          format: date-time
          x-stainless-skip:
          - terraform
        createdBy:
          type: string
          description: The unique identifier (UUID) for the user who created the Bill.
          x-stainless-skip:
          - terraform
        lastModifiedBy:
          type: string
          description: The unique identifier (UUID) for the user who last modified this Bill.
          x-stainless-skip:
          - terraform
        dtApproved:
          type: string
          description: The DateTime when the bill was approved.
          format: date-time
        approvedBy:
          type: string
          description: The id of the user who approved this bill.
        dtLocked:
          type: string
          description: The DateTime when the bill was locked.
          format: date-time
        lockedBy:
          type: string
          description: The id of the user who locked this bill.
      description: ''
      allOf:
      - $ref: '#/components/schemas/AbstractBillResponse'
      - $ref: '#/components/schemas/AbstractResponse'
    AbstractBillLineItemResponse:
      type: object
      description: ''
      allOf:
      - $ref: '#/components/schemas/AbstractResponse'
      - properties:
          lineItemType:
            description: ''
            $ref: '#/components/schemas/LineItemType'
          productId:
            type: string
            description: ''
          description:
            type: string
            description: ''
          servicePeriodStartDate:
            type: string
            description: ''
            format: date-time
          servicePeriodEndDate:
            type: string
            description: ''
            format: date-time
          referencedBillId:
            type: string
            description: ''
          referencedLineItemId:
            type: string
            description: ''
          dtCreated:
            type: string
            description: The DateTime when the line item was created.
            format: date-time
            x-stainless-skip:
            - terraform
          dtLastModified:
            type: string
            description: The DateTime when the line item was last modified.
            format: date-time
            x-stainless-skip:
            - terraform
          createdBy:
            type: string
            description: The ID of the user who created this line item.
            x-stainless-skip:
            - terraform
          lastModifiedBy:
            type: string
            description: The ID of the user who last modified this line item.
            x-stainless-skip:
            - terraform
    AbstractRequest:
      type: object
      properties:
        version:
          type: integer
          description: 'The version number of the entity:

            - **Create entity:** Not valid for initial insertion of new entity - *do not use for Create*. On initial Create, version is set at 1 and listed in the response.

            - **Update Entity:**  On Update, version is required and must match the existing version because a check is performed to ensure sequential versioning is preserved. Version is incremented by 1 and listed in the response.'
          format: int64
          x-stainless-terraform-configurability: computed
          x-stainless-terraform-always-send: true
      description: ''
    DownloadCsvRequest:
      type: object
      properties:
        startDate:
          type: string
          description: Specifies the start date of the billing period for downloading Bills. Format should be a valid date in ISO 8601 format. Bills with a start date on or after this date will be included in the download.
          format: date-time
        endDate:
          type: string
          description: Specifies the end date of the billing period for downloading Bills. Format should be a valid date in ISO 8601. Bills with an end date on or before this date will be included in the download.
          format: date-time
        externalInvoiceDateStart:
          type: string
          description: '*(Optional)*. Specifies the start date in ISO 8601 format for filtering Bills by external invoice date.'
          format: date-time
        externalInvoiceDateEnd:
          type: string
          description: '*(Optional)*. Specifies the end date in ISO 8601 format for filtering Bills by external invoice date.'
          format: date-time
        externalSystem:
          description: 'Use this parameter if you have implemented an integration with your Xero system and want a downloaded CSV file to be loaded into Xero.


            * **XERO** - loads into the Xero system.

            * **STANDARD** - not loaded into the external system.'
          $ref: '#/components/schemas/ExternalSystem'
      description: ''
      example:
        startDate: '2019-08-24T14:15:22Z'
        endDate: '2019-08-24T14:15:22Z'
        externalSystem: STANDARD
    CurrencyConversion:
      required:
      - from
      - to
      type: object
      properties:
        from:
          minLength: 1
          type: string
          description: 'Currency to convert from. For example: GBP.'
          example: EUR
        to:
          minLength: 1
          type: string
          description: 'Currency to convert to. For example: USD.'
          example: USD
        multiplier:
          type: number
          description: Conversion rate between currencies.
          format: double
          example: 1.12
          exclusiveMinimum: 0
      description: An array of currency conversion rates from Bill currency to Organization currency. For example, if Account is billed in GBP and Organization is set to USD, Bill line items are calculated in GBP and then converted to USD using the defined rate.
    ExternalSystem:
      type: string
      description: '*(Optional)*. Specifies the format of the Bills data given:

        - **STANDARD** A wider range of data columns is given.

        - **XERO** A more limited range of data columns is given and compatible with loading into your 3rd-party Xero system.'
      enum:
      - STANDARD
      - XERO
    AbstractBillResponse:
      type: object
      description: ''
      allOf:
      - $ref: '#/components/schemas/AbstractResponse'
      - properties:
          accountId:
            type: string
            description: ''
          accountCode:
            type: string
            description: ''
          startDate:
            type: string
            description: ''
            format: date
          endDate:
            type: string
            description: ''
            format: date
          startDateTimeUTC:
            type: string
            description: ''
            format: date-time
          endDateTimeUTC:
            type: string
            description: ''
            format: date-time
          billDate:
            type: string
            description: ''
            format: date
          dueDate:
            type: string
            description: ''
            format: date
          billingFrequency:
            description: ''
            $ref: '#/components/schemas/BillingFrequency'
          billFrequencyInterval:
            type: integer
            description: ''
            format: int32
          timezone:
            type: string
            description: ''
            example: UTC
            default: UTC
          currency:
            type: string
            description: ''
          locked:
            type: boolean
            description: ''
          createdDate:
            type: string
            description: ''
            format: date-time
          status:
            description: ''
            $ref: '#/components/schemas/BillStatus'
          billJobId:
            type: string
            description: ''
          currencyConversions:
            type: array
            description: ''
            items:
              $ref: '#/components/schemas/CurrencyConversion'
          lastCalculatedDate:
            type: string
            description: ''
            format: date-time
    ApproveBillsRequest:
      required:
      - billIds
      type: object
      properties:
        billIds:
          minItems: 1
          type: array
          description: Use to specify a collection of Bills by their IDs for batch approval
          items:
            type: string
      description: ''
    BillApprovalResponse:
      type: object
      properties:
        message:
          type: string
          description: A message indicating the success or failure of the Bills' approval, along with relevant details.
      description: ''
    LineItemType:
      type: string
      description: See [Bill Line Item Types](https://www.m3ter.com/docs/guides/running-viewing-and-managing-bills/bill-line-item-types) for more information.
      enum:
      - STANDING_CHARGE
      - USAGE
      - COUNTER_RUNNING_TOTAL_CHARGE
      - COUNTER_ADJUSTMENT_DEBIT
      - COUNTER_ADJUSTMENT_CREDIT
      - USAGE_CREDIT
      - MINIMUM_SPEND
      - MINIMUM_SPEND_REFUND
      - CREDIT_DEDUCTION
      - MANUAL_ADJUSTMENT
      - CREDIT_MEMO
      - DEBIT_MEMO
      - COMMITMENT_CONSUMED
      - COMMITMENT_FEE
      - OVERAGE_SURCHARGE
      - OVERAGE_USAGE
      - BALANCE_CONSUMED
      - BALANCE_FEE
      - AD_HOC
    ObjectUrlResponse:
      type: object
      properties:
        downloadUrl:
          type: string
          description: The pre-signed download URL.
          format: url
      description: ''
    PaginatedBillLineItemResponseData:
      type: object
      properties:
        data:
          type: array
          description: ''
          items:
            $ref: '#/components/schemas/BillLineItemResponse'
        nextToken:
          type: string
          description: ''
      description: ''
    AbstractResponse:
      required:
      - id
      type: object
      properties:
        id:
          type: string
          description: 'The UUID of the entity. '
        version:
          type: integer
          description: 'The version number:

            - **Create:** On initial Create to insert a new entity, the version is set at 1 in the response.

            - **Update:** On successful Update, the version is incremented by 1 in the response.'
          format: int64
          x-stainless-terraform-configurability: computed
          x-stainless-terraform-always-send: true
      description: ''
    BillLineItemPricingBandUsage:
      type: object
      properties:
        pricingBandId:
          type: string
          description: 'The UUID for the pricing band. '
        lowerLimit:
          type: number
          description: The lower limit *(start)* of the pricing band.
          format: double
        fixedPrice:
          type: number
          description: 'Fixed price is a charge entered for certain pricing types such as Stairstep, Custom Tiered, and Custom Volume. It is a set price and not dependent on usage.



            '
        unitSubtotal:
          type: number
          description: 'The subtotal of the unit usage. '
        unitPrice:
          type: number
          description: 'The price per unit in the band. '
        bandUnits:
          type: number
          description: 'The number of units used within the band. '
        bandQuantity:
          type: number
          description: 'Usage amount within the band. '
        bandSubtotal:
          type: number
          description: 'Subtotal amount for the band. '
        creditTypeId:
          type: string
          description: The UUID of the credit type.
        convertedBandSubtotal:
          type: number
          description: ''
      description: Array containing the pricing band information, which shows the details for each pricing band or tier.
    BillLineItem:
      required:
      - averageUnitPrice
      - conversionRate
      - convertedSubtotal
      - currency
      - description
      - lineItemType
      - quantity
      - subtotal
      - unit
      - units
      type: object
      properties:
        id:
          type: string
          description: The UUID for the line item.
        productId:
          type: string
          description: The UUID of the Product for the line item.
        productName:
          type: string
          description: 'The name of the Product for the line item. '
        productCode:
          type: string
          description: ''
        accountingProductId:
          type: string
          description: ''
        accountingProductName:
          type: string
          description: ''
        accountingProductCode:
          type: string
          description: ''
        aggregationId:
          type: string
          description: 'The Aggregation ID used for the line item. '
        compoundAggregationId:
          type: string
          description: 'The Compound Aggregation ID for the line item if a Compound Aggregation has been used. '
        counterId:
          type: string
          description: ''
        chargeId:
          type: string
          description: ''
        segment:
          type: object
          additionalProperties:
            type: string
          description: 'Applies only when segmented Aggregations have been used. The Segment to which the usage data in this line item belongs. '
        group:
          type: object
          additionalProperties:
            type: string
          description: ''
        meterId:
          type: string
          description: 'The UUID of the Meter used in the line item. '
        planId:
          type: string
          description: 'The ID of the Plan used for the line item. '
        planGroupId:
          type: string
          description: 'The UUID of the PlanGroup, provided the line item used a PlanGroup. '
        commitmentId:
          type: string
          description: If Commitments *(prepayments)* are used in the line item, this shows the Commitment UUID.
        balanceId:
          type: string
          description: ''
        description:
          minLength: 1
          type: string
          description: 'Line item description. '
        quantity:
          type: number
          description: 'The amount of usage for the line item. '
        units:
          type: number
          description: 'The number of units used for the line item. '
        unit:
          type: string
          description: 'The unit for the usage data in thie line item. For example: **GB** of disk storage space.'
        subtotal:
          type: number
          description: 'The subtotal amount for the line item, before any currency conversions. '
        currency:
          minLength: 1
          type: string
          description: 'The currency code for the currency used in the line item. For example: USD, GBP, or EUR.'
        conversionRate:
          type: number
          description: 'The currency conversion rate if currency conversion is required for the line item. '
        convertedSubtotal:
          type: number
