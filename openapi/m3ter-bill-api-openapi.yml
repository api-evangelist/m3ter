  /organizations/{orgId}/bills/approve:
    post:
      tags:
      - Bill
      summary: Approve Bills
      description: 'Approve multiple Bills for the specified Organization based on the given criteria.


        This endpoint allows you to change currently *Pending* Bills to *Approved* status for further processing.


        Query Parameters:

        - Use `accountIds` to approve Bills for specifed Accounts.


        Request Body Schema Parameter:

        - Use `billIds` to specify a collection of Bills for batch approval.


        **Important!** If you use the `billIds` Request Body Schema parameter, any Query parameters you might have also used are ignored when the call is processed.'
      operationId: ApproveBills
      parameters:
      - name: orgId
        in: path
        description: The unique identifier (UUID) of your Organization. The Organization represents your company as a direct customer of our service.
        required: true
        style: simple
        explode: false
        schema:
          type: string
          deprecated: true
          x-stainless-deprecation-message: the org id should be set at the client level instead
      - name: externalInvoiceDateStart
        in: query
        description: Start date for filtering Bills by external invoice date. Includes Bills with dates equal to or later than this date.
        required: false
        allowEmptyValue: true
        style: form
        explode: true
        schema:
          type: string
      - name: externalInvoiceDateEnd
        in: query
        description: End date for filtering Bills by external invoice date. Includes Bills with dates earlier than this date.
        required: false
        allowEmptyValue: true
        style: form
        explode: true
        schema:
          type: string
      - name: accountIds
        in: query
        description: List of Account IDs to filter Bills. This allows you to approve Bills for specific Accounts within the Organization.
        required: false
        allowEmptyValue: true
        style: form
        explode: true
        schema:
          type: string
      requestBody:
        description: ''
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApproveBillsRequest'
        required: true
      responses:
        '200':
