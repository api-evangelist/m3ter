info:
  title: m3ter Invitations API
  description: 'If you are using Postman, you can:

    - Use the **Download** button above to download the m3ter Open API spec JSON file and then import this file as the **m3ter API Collection** into your Workspace. See Importing the m3ter Open API in our main user Documentation for details. - Copy this link: m3ter-Template API Collection and use it to import the **m3ter-Template API Collection** into your Workspace. See Importing the m3ter Template API Collection in our main user Documentation for details. ---


    # Introduction

    The m3ter platform supports two HTTP-based REST APIs returning JSON encoded responses:

    - The **Ingest API**, which you can use for submitting raw data measurements. *(See the Submit Measurements endpoint in this API Reference.)*

    - The **Config API**, which you can use for configuration and management. *(All other endpoints in this API Reference.)*


    ## Authentication and Authorization

    Our APIs use an industry-standard authorization protocol known as the OAuth 2.0 specification. OAuth2 supports several grant types, each designed for a specific use case. m3ter uses the following two grant types:

    - **Authorization Code**: Used for human login access via the m3ter Console. - **Client Credentials**: Used for machine-to-machine communication and API access. Complete the following flow for API access:


    1. **Create a Service User and add Permissions**: Log in to the m3ter Console, go to **Settings**, **Access** then **Service Users** tab, and create a Service User. To enable API calls, grant the user **Administrator** permissions. 2. **Generate Access Keys**: In the Console, open the *Overview* page for the Service User by clicking on the name. Generate an **Access Key id** and **Api Secret**. Make sure you copy the **Api Secret** because it is only visible at the time of creation. See Service Authentication for detailed instructions and an example. 3. **Obtain a Bearer Token using Basic Auth**: We implement the OAuth 2.0 Client Credentials Grant authentication flow for Service User Authentication. Submit a request to the m3ter OAuth Client Credentials authentication flow, using your concatenated **Access Key id** and **Api Secret** to obtain a Bearer Token for your Service User. *See examples below.*


    4. **Bearer Token Usage**: Use the HTTP ''Authorization'' header with the bearer token to authorise all subsequent API requests. > Warning: The Bearer Token is valid for 18,000 seconds or 5 hours. When the token has expired, you must obtain a new one. Below are two examples for obtaining a Bearer Token using Basic Auth: the first in cURL and the second as a Python script. ### cURL Example

    1. Open your terminal or command prompt. 2. Use the following `cURL` command to obtain a Bearer Token:


    ```bash

    curl -X POST https://api.m3ter.com/oauth/token \

    -H ''Content-Type: application/x-www-form-urlencoded'' \

    -u your_access_key_id:your_api_secret \

    -d ''grant_type=client_credentials''

    ```


    Replace `your_access_key_id` and `your_api_secret` with your actual **Access Key id** and **Api Secret**. 3. Run the command, and if successful, it will return a JSON response containing the Bearer Token. The response will look like this:


    ```json

    {

    "access_token": "your_bearer_token",

    "token_type": "Bearer",

    "expires_in": 18000

    }

    ```


    You can then use the Bearer Token *(the value of `"access_token"`)* for subsequent API calls to m3ter. ### Python Example

    1. Install the `requests` library if you haven''t already:


    ```bash

    pip install requests

    ```


    2.'
  version: '1.0'
  x-logo:
    url: https://console.m3ter.com/m3ter-logo-black.svg
servers:
- url: https://api.m3ter.com
security:
- OAuth2: []
tags:
- name: Invitations
  description: 'Endpoints for creating and retrieving user invitations. Use invitations to invite other people to join your m3ter Organization.


    An invitation sends an email inviting someone to join your Organization. When you set up an invitation, you can:

    * Assign the required permission policies to control what the invitee can do when they accept the invite and join your Organization.

    * Set a date for when the invitation will expire.

    * Set a date for when the invited user''s access will expire.


    When the invitee receives the invitation email:

    * If the invitee is already a m3ter user and has a m3ter account, they can click a link and use their credentials to log into your Organization.

    * If the invitee is not a m3ter user and does not have a m3ter account, they''ll be invited to create a m3ter account before logging into your Organization.


    See Inviting Users to your Organization in our user documentation for more details.'
paths:
  /organizations/{orgId}/invitations:
    get:
      tags:
      - Invitations
      summary: Retrieve Invitations
      description: Retrieve a list of all invitations in the Organization.
      operationId: ListOrgUserInvitations
      parameters:
      - name: orgId
        in: path
        description: UUID of the organization. The Organization represents your company as a direct customer of the m3ter service.
        required: true
        style: simple
        explode: false
        schema:
          type: string
      - name: pageSize
        in: query
        description: Number of invitations to retrieve per page.
        required: false
        allowEmptyValue: true
        style: form
        explode: true
        schema:
          maximum: 200
          minimum: 1
          type: integer
          format: int32
      - name: nextToken
        in: query
        description: '`nextToken` for multi page retrievals.'
        required: false
        allowEmptyValue: true
        style: form
        explode: true
        schema:
          type: string
      responses:
        '200':
          description: Returns the list of invitations
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedOrgUserInvitationResponseData'
        4XX:
          $ref: '#/components/responses/Error'
        5XX:
          $ref: '#/components/responses/Error'
    post:
      tags:
      - Invitations
      summary: Invite User to Organization
      description: 'Invite a new user to your Organization.


        This sends an email to someone inviting them to join your m3ter Organization.'
      operationId: CreateOrgUserInvitation
      parameters:
      - name: orgId
        in: path
        description: UUID of the Organization. The Organization represents your company as a direct customer of the m3ter service.
        required: true
        style: simple
        explode: false
        schema:
          type: string
      requestBody:
        description: ''
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrgUserInvitationRequest'
        required: true
      responses:
        '200':
          description: Returns the Invitation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrgUserInvitationResponse'
        4XX:
          $ref: '#/components/responses/Error'
        5XX:
          $ref: '#/components/responses/Error'
  /organizations/{orgId}/invitations/{id}:
    get:
      tags:
      - Invitations
      summary: Retrieve Invitation
      description: Retrieve the specified invitation with the given UUID.
      operationId: GetOrgUserInvitation
      parameters:
      - name: orgId
        in: path
        description: UUID of the organization. The Organization represents your company as a direct customer of the m3ter service.
        required: true
        style: simple
        explode: false
        schema:
          type: string
      - name: id
        in: path
        description: UUID of the specific invitation to retrieve.
        required: true
        style: simple
        explode: false
        schema:
          type: string
      responses:
        '200':
          description: Returns the specified invitation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrgUserInvitationResponse'
        4XX:
          $ref: '#/components/responses/Error'
        5XX:
          $ref: '#/components/responses/Error'
components:
  schemas:
    UserRequest:
      required:
      - email
      - firstName
      - lastName
      type: object
      properties:
        m3terUser:
          type: boolean
          description: ''
        version:
          type: integer
          description: ''
          format: int64
        firstName:
          maxLength: 100
          minLength: 1
          type: string
          description: ''
        lastName:
          maxLength: 100
          minLength: 1
          type: string
          description: ''
        contactNumber:
          maxLength: 50
          type: string
          description: ''
        email:
          minLength: 1
          type: string
          description: ''
          format: email
      description: ''
    PaginatedOrgUserInvitationResponseData:
      type: object
      properties:
        data:
          type: array
          description: ''
          items:
            $ref: '#/components/schemas/OrgUserInvitationResponse'
        nextToken:
          type: string
          description: ''
      description: ''
    OrgUserInvitationResponse:
      type: object
      description: ''
      allOf:
      - $ref: '#/components/schemas/AbstractResponse'
      - type: object
        properties:
          email:
            type: string
            description: 'The email address of the invitee. The invitation will be sent to this email address. '
          permissionPolicyIds:
            type: array
            description: 'The IDs of the permission policies the invited user has been assigned. This controls the access rights and privileges that this user will have when working in the m3ter Organization. '
            items:
              type: string
          firstName:
            type: string
            description: The first name of the invitee.
          lastName:
            type: string
            description: The surname of the invitee.
          dtEndAccess:
            type: string
            description: 'The date that access will end for the user *(in ISO-8601 format)*. If this is blank, there is no end date  meaning that the user has permanent access. '
            format: date-time
          dtExpiry:
            type: string
            description: The date when the invite expires *(in ISO-8601 format)*. After this date the invited user can no longer accept the invite. By default, any invite is valid for 30 days from the date the invite is sent.
            format: date-time
          invitingPrincipalId:
            type: string
            description: 'The UUID of the user who sent the invite. '
          accepted:
            type: boolean
            description: 'Boolean indicating whether the user has accepted the invitation.


              * TRUE - the invite has been accepted.

              * FALSE - the invite has not yet been accepted.'
          dtCreated:
            type: string
            description: The DateTime when the invitation was created *(in ISO-8601 format)*.
            format: date-time
          dtLastModified:
            type: string
            description: The DateTime when the invitation was last modified *(in ISO-8601 format)*.
            format: date-time
          createdBy:
            type: string
            description: The UUID of the user who created the invitation.
          lastModifiedBy:
            type: string
            description: The UUID of the user who last modified the invitation.
    AbstractResponse:
      required:
      - id
      type: object
      properties:
        id:
          type: string
          description: 'The UUID of the entity. '
        version:
          type: integer
          description: 'The version number:

            - **Create:** On initial Create to insert a new entity, the version is set at 1 in the response.

            - **Update:** On successful Update, the version is incremented by 1 in the response.'
          format: int64
          x-stainless-terraform-configurability: computed
          x-stainless-terraform-always-send: true
      description: ''
    OrgUserInvitationRequest:
      type: object
      description: ''
      allOf:
      - $ref: '#/components/schemas/UserRequest'
      - type: object
        properties:
          permissionPolicyIds:
            type: array
            description: 'The IDs of the permission policies the invited user has been assigned. This controls the access rights and privileges that this user will have when working in the m3ter Organization. '
            items:
              type: string
          dtEndAccess:
            type: string
            description: 'The date when access will end for the user *(in ISO-8601 format)*. Leave blank for no end date, which gives the user permanent access. '
            format: date-time
          dtExpiry:
            type: string
            description: The date when the invite expires *(in ISO-8601 format)*. After this date the invited user can no longer accept the invite. By default, any invite is valid for 30 days from the date the invite is sent.
            format: date-time
  responses:
    Error:
      description: Error message
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
  securitySchemes:
    OAuth2:
      type: oauth2
      description: "m3ter supports machine to machine authentication using the `clientCredentials` OAuth2 flow.\n\nThe `authorizationCode` flow controls access for human users via the m3ter Console application. \n"
      flows:
        clientCredentials:
          tokenUrl: /oauth/token
          scopes:
            m3ter-resources/m3ter-scope: m3ter resources
        authorizationCode:
          authorizationUrl: https://m3ter.auth.us-east-1.amazoncognito.com/oauth2/authorize
          tokenUrl: https://m3ter.auth.us-east-1.amazoncognito.com/oauth2/token
          scopes:
            m3ter-resources/m3ter-scope: m3ter resources
            openid: OpenID
            email: email
