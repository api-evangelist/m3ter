- aid: m3ter:m3ter-customfield-api
  name: M3ter CustomField API
  description: "Endpoints for retrieving and updating Custom Fields at the Organization level for all\
    \ entities that support them.\n\nCustom Fields in m3ter allow you to store custom data in the form\
    \ of number or string values against m3ter entities in a way that does not directly affect the normal\
    \ working operation of the m3ter platform. Having this capability to store data in a free-hand fashion\
    \ can prove very useful in helping you to meet specific usage-based pricing and other operational\
    \ business use cases.\n\nHowever, you can exploit the values stored on Custom Fields in a more direct\
    \ way by referencing them in Derived Field and Compound Aggregation calculations. Given the key role\
    \ these calculations can play when implementing usage-based pricing schema, any Custom Fields you\
    \ reference will then affect how the platform behaves. Referencing Custom Field values in your calculations\
    \ offers a much wider scope of options when it comes to resolving complex usage-based pricing use\
    \ cases.\n\nCustom Fields can be added to the following entities at Organizational level:\n* Organization\n\
    * Account\n* AccountPlan\n* Aggregation\n* Compound Aggregation\n* Meter\n* Product\n* Plan\n* PlanTemplate\n\
    * Contract\n\nThese all follow the same pattern - a new *(optional)* field is available on the entity\
    \ request and response bodies called \"customFields\" which is a object in this format:\n```\n\"customFields\"\
    : {\n\t\t\"exampleCustomField1\": 7.1,\n\t\t\"exampleCustomField2\": \"stringValue\"\n}\n```\nThe\
    \ value for a Custom Field can be a string or a number.\n\n**Using Custom Field values in calculations:**\n\
    - You can add Custom Fields at two levels - the Organization level and the individual entity level.\n\
    - The Organizational level field provides a default value and *must be added* if you want to also\
    \ add a Custom Field of the same name at the corresponding individual entity level. If you reference\
    \ the Custom Field in a calculation, the value for the individual entity level field is used. If no\
    \ field is defined at individual entity level, then the Organization level field value is used.\n\n\
    **Important: Constraints and Exceptions!**\n\n**Custom Fields at Organization Level**. Currently,\
    \ you cannot create Custom Fields at the Organization-level for the following enitites:\n* Plan Group\n\
    * Balance\n* Balance Transaction Schedule\n* Balance Charge Schedule\n\nTherefore you cannot reference\
    \ the Custom Fields values created at the individual entity level for these entities in your Derived\
    \ Field or Compound Aggregation calculations.\n\n\n**Derived Field Calculations**. You can *only reference\
    \ Custom Fields* for the following entities:\n* Organization\n* Meter\n* Account\n\nHowever, if you\
    \ are using Meters belonging to *a specific Product*, that is, not *Global Meters*, you can also reference\
    \ Custom Fields added to a Product in Derived Field calculations.\n\n**Compound Aggregation Calculations\
    \ - Meter Custom Fields**. The value of the *Organization level Meter Custom Field will always be\
    \ used*, even if you have defined a corresponding field at the individual Meter level.\n\nSee [Working\
    \ with Custom Fields](https://www.m3ter.com/docs/guides/creating-and-managing-products/working-with-custom-fields)\
    \ in the m3ter documentation for more information."
  humanURL: https://www.m3ter.com/
