- aid: m3ter:m3ter-invitations-api
  name: M3ter Invitations API
  description: >-
    Endpoints for creating and retrieving user invitations. Use invitations to invite other people to
    join your m3ter Organization.


    An invitation sends an email inviting someone to join your Organization. When you set up an invitation,
    you can:

    *  Assign the required permission policies to control what the invitee can do when they accept the
    invite and join your Organization.

