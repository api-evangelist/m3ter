- aid: m3ter:m3ter-events-api
  name: M3ter Events API
  description: "This section provides Endpoints for operations that allow you to retrieve detailed information\
    \ about individual Events, list all Events or specific Event Types, and explore dynamic fields available\
    \ for each Event Type.\n\nEvents encompass specific instances of state changes within the system,\
    \ such as the creation of a new Prepayment/Commitment for an Account. Each Event is classified under\
    \ an Event Type framework, providing context about what kind of change occurred to generate the Event.\n\
    \n**Events for Configuration and Billing Entities**\n\nMany Event Types cover common configuration\
    \ and billing objects, where the Event is generated for a state change of one of these objects - for\
    \ when the configuration or billing object is **created**, **deleted**, or **updated**. \n\nFor example:\n\
    * configuration.commitment.created\n* configuration.commitment.deleted\n* configuration.commitment.updated\n\
    * configuration.account.created\n* configuration.account.deleted\n* configuration.account.updated\n\
    * billing.bill.created\n* billing.bill.deleted\n* billing.bill.created\n\n**Events for Errors or Failures**\
    \ \n\nThere are also Event Types for certain kinds of error that can occur:\n\n* For an Integration:\n\
    \  * validation\n  * authentication\n  * perform\n  * missing account mapping\n  * disabled\n\n* For\
    \ a Usage Data Ingest Submission:\n  * validation failure\n\n* For Data Export Jobs:\n  * data export\
    \ job failure\n\n**Scheduled Events**\n\nIn addition to system-generated Events that occur when a\
    \ configuration entity undergoes a state change at creation, update, or deletion of the entity, you\
    \ can use API calls to create and configure *Scheduled Event Configurations*. Scheduled Events are\
    \ custom Event types, which you can set up by referencing Date/Time fields on configuration and billing\
    \ entities. See the [ScheduledEventConfigurations](https://www.m3ter.com/docs/api#tag/ScheduledEventConfigurations)\
    \ section of this API Reference for more details.\n\n**Notifications for Events**\n\nYou can create\
    \ Notification rules based on Events and these rules can reference and apply calculations to the Event's\
    \ fields. This allows you to set up customized alerts to be sent out via webhooks when the Event occurs\
    \ and any conditions you've built into the Notification rule's calculation are satisfied.\n\nSee the\
    \ [Notifications](https://www.m3ter.com/docs/api#tag/Notifications) section for more details.\n\n\
    **Other Events**\n\nWhen Events occur, they can cause other Events, such as when a Notification is\
    \ triggered by the Event it is based on. For these Events there are currently two categories:\n* Notification\n\
    * IntegrationEvent\n\nAlso see [Utilizing Events and Notifications](https://www.m3ter.com/docs/guides/utilizing-events-and-notifications)\
    \ and [Object Definitions and API Calls](https://www.m3ter.com/docs/guides/utilizing-events-and-notifications/object-definitions-and-api-calls)\
    \ in the m3ter documentation for more guidance."
  humanURL: https://www.m3ter.com/
  baseURL: https://api.m3ter.com
