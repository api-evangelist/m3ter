- aid: m3ter:m3ter-balances-api
  name: M3ter Balances API
  description: "Endpoints for creating/retrieving/updating/deleting Balances on Accounts.\n\nWhen you\
    \ have created a Balance for an Account, you can create a positive or negative Transaction amounts\
    \ for the Balance. To do this, you must first define Transaction Types for your Organization, and\
    \ then use one of these Transaction Types when you add a specific Transaction to a Balance - see the\
    \ [Create TransactionType](https://www.m3ter.com/docs/api#tag/TransactionType/operation/CreateTransactionType)\
    \ call in the Transaction Type section in this API Reference for more details.\n\nBalances are typically\
    \ used when a customer prepays an amount to add a credit to their Account, which can then be draw-down\
    \ against charges due for product or service consumption. You can include options to top-up the original\
    \ Balance.\n\nExamples of how Balances for end customer Accounts can be used:\n\n* Onboarding Balance/Free\
    \ Trials. Offering an onboarding incentive to new customers as an initial free credit Balance on their\
    \ Account. \n\n* Balance as initial commitment. Add a Balance amount to a new customer Account. This\
    \ acts as an initial commitment, which allows them to use the service and gain an accurate insight\
    \ into their usage level. \n\n* Managing Customer Satisfaction. Use Balance as credits that will be\
    \ applied to subsequent Bills as compensation for acknowledged service delivery issues.\n\n* Facilitating\
    \ Balance Adjustments:\n\t* Apply negative amounts to immediately write-off outstanding Balances.\n\
    \n#### What is the difference between Balances and Commitments/Prepayments?\n\nTo manage credit amounts\
    \ for your end-customer Accounts, you can use Balances or Commitments/Prepayments. However, these\
    \ two kinds of credits for Accounts serve different purposes.\n\nCommitments - also referred to as\
    \ Prepayments - are used for amounts end-customers have agreed to pay for consuming your product or\
    \ services across a full contract term. A customer might pay the entire or only part of the agreed\
    \ amount upfront, but ***the commitment or prepayment amount is payable regardless of the actual usage\
    \ by the customer of your service or product.***\n\nIn contrast, a Balance - often referred to as\
    \ a Top-Up or Prepaid draw-down - is used when a customer wants to add a credit amount to their Account\
    \ at any time during the service period or when you as service provider want to add a credit to a\
    \ customer Account. This Balance credit can then be drawn-down against for billing the Account for\
    \ usage, minimum spend, standing charges, or recurring charges due. Balances therefore serve payment\
    \ use cases in a more flexible way, for example to be used for a \"Free Credit\" sign-up scheme you\
    \ offer to encourage sales or to enhance customer satisfaction by adding credit to an Account to compensate\
    \ for service delivery issues.\n\nYou can use Commitments/Prepayments and Balances together on Account,\
    \ and define at Organization or individual Account level the order in which any Balance/Commitment\
    \ credit on an Account is drawn-down - Balance amounts first or Commitment/Prepayment amounts first."
  humanURL: https://www.m3ter.com/
  baseURL: https://api.m3ter.com
