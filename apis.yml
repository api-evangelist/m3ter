- aid: m3ter:m3ter-exportadhoc-api
  name: M3ter ExportAdHoc API
  description: >-
    Endpoints for triggering one-off, ad-hoc Data Exports. You can set up and run ad-hoc Exports to export
    two kinds of data from your m3ter Organization:

    * Usage data.

    * Operational data for entities.


    **Ad-Hoc Export Destinations** When setting up and running an ad-hoc Export:

    * You can define one or more Export Destinations - see the [ExportDestination](https://www.m3ter.com/docs/api#tag/ExportDestination)
    section of this API Reference. When the export runs, the data is sent through to the sepecified Destination.
    However, the export file is also made available for you to download it locally.

    * You can set up and run Data Exports without defining a Destination. The data is not exported but
    the compiled export file is made available for downloading locally.

    * For details on downloading an export file, see the [Get Data Export File Download URL](https://www.m3ter.com/docs/api#tag/ExportDestination/operation/GenerateDataExportFileDownloadUrl)
    endpoint in this API Reference.


    **Preview Version!** The Data Export feature is currently available only in Preview release version.
    See [Feature Release Stages](https://www.m3ter.com/docs/guides/getting-started/feature-release-stages)
    for Preview release definition. ExportAdHoc endpoints will only be available if Data Export has been
    enabled for your Organization. For more details see [Data Export(Preview)](https://www.m3ter.com/docs/guides/data-exports)
    in our main User documentation. If you're interested in previewing the Data Export feature, please
    get in touch with m3ter Support or your m3ter contact.
