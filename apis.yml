- aid: m3ter:m3ter-notifications-api
  name: M3ter Notifications API
  description: >-
    This section provides endpoints for managing Event Notifications.


    You can create Notifications based on system Events generated by the platform. When you base a Notification
    on a specific Event type, you can include a calculation that references the fields available on that
    Event type to define precise conditions that must be met for the Notification to be triggered when
    an Event of that type occurs. In this way, you can set up highly customized Notifications that act
    as timely alerts to inform you about significant occurrences within your Organization. For instance,
    if you provide a sign-up bonus to new end-customer Accounts, you can set up a Notification to alert
    you when an end-customer Account has used up a certain percentage of their bonus credit.


    You can also set up Notifications based on Scheduled Event types you've created for your Organization.
    See the [ScheduledEventConfigurations](https://www.m3ter.com/docs/api#tag/ScheduledEventConfigurations)
    section of this API Reference and [Working with Scheduled Events](https://www.m3ter.com/docs/guides/alerts-events-and-notifications/utilizing-events-and-notifications/working-with-scheduled-events)
    in our user documentation.


    For more details on Event types and their fields, see the [Events](https://www.m3ter.com/docs/api#tag/Events)
    section.


    For detailed guidance on working with Events and Notifications, refer to the [Utilizing Events and
    Notifications](https://www.m3ter.com/docs/guides/utilizing-events-and-notifications) section of the
    m3ter user documentation.
