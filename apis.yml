apis:
- aid: m3ter:m3ter-account-api
  name: M3ter Account API
  description: "Endpoints for Account related operations such as creation, update, list and delete. \n\
    An Account represents one of your end-customer accounts. \n\nAccounts do not belong to a Product to\
    \ allow for cases where an end customer takes more than one of your Products, and the charges for\
    \ these Products differ.\n\nYou typically attach a priced Plan or Plan Template to an Account before\
    \ you can generate bills for the Account:\n- If a customer consumes several of your Products, you\
    \ can attach a priced Plan or Plan Template to the Account for charging against each Product.\n- If\
    \ an Account is charged solely on the basis of an agreed Prepayment/Commitment amount but not all\
    \ of the Prepayment is prepaid, you can use a customized billing schedule for outstanding fees without\
    \ having to attach a Plan to the Account to generate Bills.\n\nYou can create Child Accounts for end\
    \ customers who hold multiple Accounts with you. You can then set up billing for the Parent/Child\
    \ Account usage to have the end-customer billed once for the Parent Account, instead of having separate\
    \ bills issued for usage against each of their multiple Accounts.\n\n**IMPORTANT! - use of PII:**\
    \ The use of any of your end-customers' Personally Identifiable Information (PII) in m3ter is restricted\
    \ to a few fields on the **Account** entity. Please ensure that only the ``name``, ``address``, or\
    \ ``emailAddress`` fields contain any end-customer PII data on any Accounts you create. See the [Introduction\
    \ section](https://www.m3ter.com/docs/api#section/Introduction) above for more details."
  humanURL: https://www.m3ter.com/
  baseURL: https://api.m3ter.com
